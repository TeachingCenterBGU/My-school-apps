name: Update Homework

# ==========================================================
# ⏸️ מושבת לחופשת הקיץ (יולי 2026)
# העדכון האוטומטי מהמשו"ב כבוי — התשתית נשארת במקום.
#
# 🔄 כדי להפעיל מחדש בתחילת שנה"ל:
#   1. להסיר את סימני ה-# משלוש השורות של schedule למטה
#   2. לעדכן את KIDS_MAPPING בקובץ update_homework.py לכיתות החדשות
#   3. לוודא ש-year בבקשת ההתחברות ב-update_homework.py מעודכן (2027)
#
# בינתיים אפשר תמיד להריץ ידנית דרך לשונית Actions בגיטהאב
# (workflow_dispatch נשאר פעיל).
# ==========================================================

on:
  # schedule:
  #   - cron: '0 12 * * *' # רץ כל יום ב-14:00 שעון ישראל בערך
  workflow_dispatch: # מאפשר הרצה ידנית

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install requests
      - name: Run Script
        env:
          MASHOV_ID: ${{ secrets.MASHOV_ID }}
          MASHOV_PASS: ${{ secrets.MASHOV_PASS }}
          MASHOV_SEMEL: ${{ secrets.MASHOV_SEMEL }}
        run: python update_homework.py
      - name: Commit changes
        run: |
          git config --global user.name "GitHub Bot"
          git config --global user.email "bot@github.com"
          git add homework_data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update homework" && git push)
      - name: Send notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install firebase-admin
          python send_notifications.py