<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ממלכת השברים 👑</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #00b894;
            --wrong: #ff7675;
            --bg: #dfe6e9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            text-align: center;
            margin: 0;
            padding: 20px;
            color: #2d3436;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        h1 { margin-top: 0; color: var(--primary); }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .menu-btn {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 15px;
            border-radius: 15px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .menu-btn:hover, .menu-btn.active {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        #game-area {
            background: #f1f2f6;
            border-radius: 15px;
            padding: 20px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .question-box {
            font-size: 2em;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* עיצוב שברים */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            text-align: center;
            vertical-align: middle;
            font-size: 1em;
            margin: 0 10px;
        }

        .numer { border-bottom: 3px solid #2d3436; padding-bottom: 2px; display: block; min-width: 30px;}
        .denom { padding-top: 2px; display: block; min-width: 30px;}

        /* שדות קלט */
        input[type="number"] {
            font-size: 0.8em;
            width: 50px;
            text-align: center;
            border: 2px solid var(--secondary);
            border-radius: 8px;
            padding: 5px;
            font-family: inherit;
        }
        
        select.op-select {
            font-size: 0.8em;
            padding: 5px;
            border: 2px solid var(--secondary);
            border-radius: 8px;
        }

        /* כפתור בדיקה */
        .btn-check {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .btn-check:hover { transform: scale(1.05); }

        /* אזור הרחבה */
        .expand-arrow-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.6em;
            color: var(--primary);
        }
        .arrow-line { font-size: 2em; line-height: 0.5; color: #b2bec3; }

        /* אזור סיפור */
        .story-text {
            font-size: 1.3em;
            text-align: right;
            line-height: 1.6;
            width: 100%;
            margin-bottom: 20px;
            padding: 10px;
            background: #fff;
            border-radius: 10px;
            border-right: 5px solid var(--accent);
        }

        .story-step {
            background: white;
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            text-align: right;
            border: 1px solid #dfe6e9;
        }
        
        .step-label {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            display: block;
            font-size: 0.9em;
        }

        .feedback {
            font-size: 1.5em;
            font-weight: bold;
            height: 40px;
            margin-top: 15px;
        }
        .correct { color: var(--accent); }
        .wrong { color: var(--wrong); }
        
        .back-link { display: inline-block; margin-top: 20px; text-decoration: none; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>👑 ממלכת השברים</h1>
    
    <div class="menu-grid">
        <button class="menu-btn active" onclick="startGame('expand')">🔍 הרחבה</button>
        <button class="menu-btn" onclick="startGame('compare')">⚖️ השוואה</button>
        <button class="menu-btn" onclick="startGame('calc')">➕ חיבור</button>
        <button class="menu-btn" onclick="startGame('story')">📖 בעיות מילוליות</button>
    </div>

    <div id="game-area"></div>
    
    <div id="feedback" class="feedback"></div>

    <div style="margin-top: 30px; font-size: 1.2em;">
        נקודות: <span id="score">0</span> 🌟
    </div>
    
    <a href="index.html" class="back-link">🔙 חזרה לדף הראשי</a>
</div>

<script>
    let currentMode = 'expand';
    let currentSolution = null;
    let storyData = null; // לשמירת הנתונים של הבעיה המילולית
    let score = 0;

    function startGame(mode) {
        currentMode = mode;
        document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
        // Find button that called function (if event exists) or by index
        if(event && event.target) event.target.classList.add('active');
        
        document.getElementById('feedback').innerText = '';
        generateQuestion();
    }

    function generateQuestion() {
        const area = document.getElementById('game-area');
        area.innerHTML = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('feedback').innerText = '';

        switch(currentMode) {
            case 'expand': generateExpand(area); break;
            case 'compare': generateCompare(area); break;
            case 'calc': generateCalc(area); break;
            case 'story': generateStory(area); break;
        }
    }

    // --- 1. הרחבה וצמצום (משופר) ---
    function generateExpand(area) {
        const baseNumer = randomInt(1, 5);
        const baseDenom = randomInt(baseNumer + 1, 9);
        const factor = randomInt(2, 5);
        
        const expandedNumer = baseNumer * factor;
        const expandedDenom = baseDenom * factor;

        // סוג השאלה: 1 = מצא את הגורם, 2 = מצא את השבר המורחב
        const questionType = Math.random() > 0.5 ? 'find_factor' : 'find_fraction';

        let html = '<div class="question-box">';
        
        // שבר בסיס
        html += createFractionHtml(baseNumer, baseDenom);
        
        // אזור הגורם (חץ)
        html += `<div class="expand-arrow-box">
                    <span>כופלים ב...</span>
                    <div style="font-size: 2.5em;">&#8594;</div>
                    <div style="background:#ffeaa7; padding:5px; border-radius:50%;">
                        <span>x</span>
                        ${questionType === 'find_factor' ? '<input type="number" id="ansFactor" style="width:40px">' : `<b>${factor}</b>`}
                    </div>
                 </div>`;

        // שבר תוצאה
        if (questionType === 'find_factor') {
             html += createFractionHtml(expandedNumer, expandedDenom);
             currentSolution = { type: 'factor', val: factor };
        } else {
             html += `<div class="fraction">
                        <span class="numer"><input type="number" id="ansN" placeholder="?"></span>
                        <span class="denom"><input type="number" id="ansD" placeholder="?"></span>
                      </div>`;
             currentSolution = { type: 'fraction', n: expandedNumer, d: expandedDenom };
        }
        
        html += '</div><button class="btn-check" onclick="checkExpand()">בדיקה</button>';
        area.innerHTML = html;
    }

    function checkExpand() {
        let isCorrect = false;
        if (currentSolution.type === 'factor') {
            const val = parseInt(document.getElementById('ansFactor').value);
            if (val === currentSolution.val) isCorrect = true;
        } else {
            const n = parseInt(document.getElementById('ansN').value);
            const d = parseInt(document.getElementById('ansD').value);
            if (n === currentSolution.n && d === currentSolution.d) isCorrect = true;
        }
        
        if(isCorrect) correct(); else wrong();
    }

    // --- 4. בעיות מילוליות (תהליך מלא) ---
    function generateStory(area) {
        const templates = [
            {
                text: "רוני אכל {frac1} מהפיצה, ודנה אכלה {frac2} מהפיצה. כמה פיצה אכלו שניהם יחד?",
                op: '+',
                type: 'add'
            },
            {
                text: "במיכל היו {frac1} ליטר מים. דני שפך החוצה {frac2} ליטר. כמה מים נשארו במיכל?",
                op: '-',
                type: 'sub' // בחיסור נקפיד שהראשון גדול מהשני
            }
        ];

        const t = templates[Math.floor(Math.random() * templates.length)];
        
        // יצירת מספרים למכנה משותף (לצורך הפשטות בשלב זה - מכנים זהים)
        const denom = randomInt(4, 8);
        let n1, n2;
        
        if (t.type === 'sub') {
             n1 = randomInt(2, denom-1);
             n2 = randomInt(1, n1-1); // n2 קטן מ n1
        } else {
             // בחיבור נדאג שהתוצאה תהיה גדולה מ-1 כדי שיהיה שבר מעורב
             n1 = randomInt(denom - 2, denom - 1); 
             n2 = randomInt(3, denom - 1);
        }

        const frac1Str = `${n1}/${denom}`;
        const frac2Str = `${n2}/${denom}`; // מחרוזת לתצוגה בטקסט

        // חישוב התשובות הנכונות
        let resultN, resultD = denom;
        if (t.op === '+') resultN = n1 + n2;
        else resultN = n1 - n2;

        const mixedWhole = Math.floor(resultN / resultD);
        const mixedRem = resultN % resultD;

        storyData = {
            n1: n1, n2: n2, d: denom, op: t.op,
            resN: resultN, resD: resultD,
            mixW: mixedWhole, mixN: mixedRem
        };

        const storyText = t.text.replace('{frac1}', `<b dir="ltr">${n1}/${denom}</b>`).replace('{frac2}', `<b dir="ltr">${n2}/${denom}</b>`);

        let html = `
            <div class="story-text">${storyText}</div>
            
            <div class="story-step">
                <span class="step-label">שלב 1: כתבי את התרגיל (משמאל לימין)</span>
                <div style="display:flex; justify-content:center; align-items:center; gap:5px; direction:ltr;">
                    <div class="fraction"><input type="number" id="exN1" class="s-inp"><span>/</span><input type="number" id="exD1" class="s-inp"></div>
                    <select id="exOp" class="op-select"><option value="+">+</option><option value="-">-</option></select>
                    <div class="fraction"><input type="number" id="exN2" class="s-inp"><span>/</span><input type="number" id="exD2" class="s-inp"></div>
                    <span>=</span>
                </div>
            </div>

            <div class="story-step">
                <span class="step-label">שלב 2: פתרי כשבר מדומה (רק מונה ומכנה)</span>
                <div class="fraction">
                    <span class="numer"><input type="number" id="impN"></span>
                    <span class="denom"><input type="number" id="impD"></span>
                </div>
            </div>

            <div class="story-step">
                <span class="step-label">שלב 3: הפכי לשבר מעורב (מספר שלם + שבר)</span>
                <div style="display:flex; align-items:center; justify-content:center; gap:5px;">
                    <input type="number" id="mixW" placeholder="שלם" style="width:40px; height:40px; font-size:1.2em;">
                    <div class="fraction">
                        <span class="numer"><input type="number" id="mixN"></span>
                        <span class="denom"><input type="number" id="mixD"></span>
                    </div>
                </div>
                <div style="font-size:0.8em; color:#888; margin-top:5px;">(אם אין שלם או אין שארית, כתבי 0)</div>
            </div>

            <button class="btn-check" onclick="checkStory()">בדיקה</button>
        `;
        area.innerHTML = html;
    }

    function checkStory() {
        const d = storyData;
        let errors = [];

        // בדיקת שלב 1 - התרגיל
        const uN1 = parseInt(document.getElementById('exN1').value);
        const uD1 = parseInt(document.getElementById('exD1').value);
        const uOp = document.getElementById('exOp').value;
        const uN2 = parseInt(document.getElementById('exN2').value);
        const uD2 = parseInt(document.getElementById('exD2').value);

        // בחיבור הסדר לא משנה, בחיסור כן
        let exCorrect = false;
        if (d.op === '+') {
            if (uOp === '+' && uD1 === d.d && uD2 === d.d && 
               ((uN1 === d.n1 && uN2 === d.n2) || (uN1 === d.n2 && uN2 === d.n1))) exCorrect = true;
        } else {
            if (uOp === '-' && uN1 === d.n1 && uN2 === d.n2 && uD1 === d.d && uD2 === d.d) exCorrect = true;
        }
        if (!exCorrect) errors.push("יש טעות בכתיבת התרגיל");

        // בדיקת שלב 2 - שבר מדומה
        const impN = parseInt(document.getElementById('impN').value);
        const impD = parseInt(document.getElementById('impD').value);
        if (impN !== d.resN || impD !== d.resD) errors.push("יש טעות בשבר המדומה");

        // בדיקת שלב 3 - שבר מעורב
        // התייחסות לקלט ריק כ-0
        const mixW = parseInt(document.getElementById('mixW').value) || 0;
        const mixN = parseInt(document.getElementById('mixN').value) || 0;
        const mixD = parseInt(document.getElementById('mixD').value) || d.d;

        if (mixW !== d.mixW || mixN !== d.mixN) errors.push("יש טעות בשבר המעורב");

        if (errors.length === 0) {
            correct();
        } else {
            document.getElementById('feedback').innerText = errors[0]; // מציג רק את הטעות הראשונה
            document.getElementById('feedback').className = 'feedback wrong';
        }
    }

    // --- לוגיקה ישנה (ללא שינוי) עבור השוואה וחיבור ---
    function generateCompare(area) {
        let n1, d1, n2, d2;
        const strategy = randomInt(1, 3); 
        if (strategy === 1) { d1 = d2 = randomInt(3, 12); n1 = randomInt(1, d1-1); n2 = randomInt(1, d2-1); while(n1===n2) n2=randomInt(1, d2-1); }
        else if (strategy === 2) { n1 = n2 = randomInt(1, 5); d1 = randomInt(n1+1, 10); d2 = randomInt(n1+1, 12); while(d1===d2) d2=randomInt(n1+1, 12); }
        else { d1=randomInt(4,10); n1=1; d2=randomInt(3,8); n2=d2-1; if(Math.random()>0.5){[n1,n2]=[n2,n1];[d1,d2]=[d2,d1];} }
        
        const val1 = n1/d1; const val2 = n2/d2;
        currentSolution = val1 > val2 ? '>' : (val1 < val2 ? '<' : '=');

        area.innerHTML = `<div class="question-box">${createFractionHtml(n1,d1)} <div style="width:50px;text-align:center">?</div> ${createFractionHtml(n2,d2)}</div>
                          <div style="display:flex;gap:15px"><button class="menu-btn" onclick="chkComp('>')">&gt;</button><button class="menu-btn" onclick="chkComp('=')">=</button><button class="menu-btn" onclick="chkComp('<')">&lt;</button></div>`;
    }
    function chkComp(s){ if(s===currentSolution) correct(); else wrong(); }

    function generateCalc(area) {
        const denom = randomInt(3, 10);
        const n1 = randomInt(1, denom-1);
        const n2 = randomInt(1, denom-n1);
        const isPlus = Math.random() > 0.4;
        const res = isPlus ? n1+n2 : Math.max(n1,n2)-Math.min(n1,n2);
        const num1 = isPlus ? n1 : Math.max(n1,n2);
        const num2 = isPlus ? n2 : Math.min(n1,n2);
        currentSolution = res;
        area.innerHTML = `<div class="question-box">${createFractionHtml(num1,denom)} <span>${isPlus?'+':'-'}</span> ${createFractionHtml(num2,denom)} <span>=</span> 
                          <div class="fraction"><span class="numer"><input id="ansC" type="number"></span><span class="denom">${denom}</span></div></div>
                          <button class="btn-check" onclick="chkCalc()">בדיקה</button>`;
    }
    function chkCalc(){ if(parseInt(document.getElementById('ansC').value)===currentSolution) correct(); else wrong(); }

    // --- עזרים ---
    function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function createFractionHtml(n, d) { return `<div class="fraction"><span class="numer">${n}</span><span class="denom">${d}</span></div>`; }
    function correct() {
        score += 10; document.getElementById('score').innerText = score;
        document.getElementById('feedback').innerText = 'כל הכבוד! אלופה! 🎉';
        document.getElementById('feedback').className = 'feedback correct';
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        setTimeout(generateQuestion, 2000);
    }
    function wrong() {
        document.getElementById('feedback').innerText = 'אופס, נסי שוב... 💪';
        document.getElementById('feedback').className = 'feedback wrong';
    }
    
    // התחלה
    startGame('expand');
</script>
</body>
</html>
