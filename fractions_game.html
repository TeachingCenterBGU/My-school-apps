<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ממלכת השברים 👑</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #00b894;
            --wrong: #ff7675;
            --bg: #dfe6e9;
            --yellow-tip: #fff3cd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            text-align: center;
            margin: 0;
            padding: 20px;
            color: #2d3436;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        h1 { margin-top: 0; color: var(--primary); }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .menu-btn {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 15px;
            border-radius: 15px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .menu-btn:hover, .menu-btn.active {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        /* סרגל התקדמות */
        .progress-indicator {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 15px;
            background: #f1f2f6;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
        }

        #game-area {
            background: #f1f2f6;
            border-radius: 15px;
            padding: 20px;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* עיצוב בסיסי לשברים */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            text-align: center;
            vertical-align: middle;
            font-size: 1em;
            margin: 0 8px;
            position: relative;
        }

        .numer { border-bottom: 2px solid #2d3436; padding-bottom: 2px; display: block; min-width: 25px;}
        .denom { padding-top: 2px; display: block; min-width: 25px;}

        /* מספר שלם בתוך הסיפור */
        .whole-num-story {
            font-size: 1.4em;
            font-weight: bold;
            color: var(--primary);
            margin: 0 4px;
        }

        /* התאמות לשברים בתוך טקסט רץ */
        .story-text .fraction {
            font-size: 0.9em;
            margin: 0 4px;
            vertical-align: middle;
        }

        /* שדות קלט */
        input[type="number"] {
            font-size: 0.9em;
            width: 50px;
            text-align: center;
            border: 2px solid var(--secondary);
            border-radius: 8px;
            padding: 5px;
            font-family: inherit;
        }
        
        /* כפתור בדיקה */
        .btn-check {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 25px;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-check:hover { transform: scale(1.05); background: #00a383; }

        /* --- הרחבה: עיצוב LTR --- */
        .expand-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            direction: ltr; 
        }
        
        .equation-box {
            font-size: 1.8em;
            display: flex;
            align-items: center;
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .factor-box {
            background: var(--yellow-tip);
            border: 2px dashed #e1c34a;
            padding: 10px 15px;
            border-radius: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .factor-label { font-size: 0.6em; margin-bottom: 5px; color: #856404; font-weight: bold;}

        /* --- סיפור --- */
        .story-text {
            font-size: 1.3em;
            text-align: right;
            line-height: 2.2; 
            width: 100%;
            margin-bottom: 20px;
            padding: 15px;
            background: #fff;
            border-radius: 12px;
            border-right: 5px solid var(--accent);
        }

        .story-step {
            background: white;
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            width: 95%;
            text-align: right;
            border: 1px solid #dfe6e9;
        }
        
        .step-label {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 12px;
            display: block;
            font-size: 1em;
        }

        .tip-box {
            background-color: var(--yellow-tip);
            border-right: 4px solid #ffc107;
            padding: 10px;
            margin: 10px 0;
            font-size: 0.9em;
            text-align: right;
            border-radius: 5px;
            color: #856404;
        }

        .feedback {
            font-size: 1.5em;
            font-weight: bold;
            min-height: 40px;
            margin-top: 20px;
        }
        .correct { color: var(--accent); }
        .wrong { color: var(--wrong); }
        
        .back-link { display: inline-block; margin-top: 30px; text-decoration: none; color: #888; border-bottom: 1px dashed #888;}
        
        .question-box-simple { font-size: 2.5em; margin: 20px 0; display: flex; align-items: center; gap: 15px; direction: ltr; }

        /* מסך סיום */
        .summary-box h2 { font-size: 2.5em; color: var(--accent); margin-bottom: 10px; }
        .summary-box p { font-size: 1.3em; color: #555; }
        .summary-box .final-score { font-size: 1.5em; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .btn-restart { 
            background: var(--primary); 
            color: white; 
            border: none; padding: 15px 40px; 
            font-size: 1.3em; border-radius: 50px; 
            cursor: pointer; box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👑 ממלכת השברים</h1>
    
    <div class="menu-grid">
        <button class="menu-btn active" onclick="initGame('expand')">🔍 הרחבה</button>
        <button class="menu-btn" onclick="initGame('compare')">⚖️ השוואה</button>
        <button class="menu-btn" onclick="initGame('calc')">➕ חיבור</button>
        <button class="menu-btn" onclick="initGame('story')">📖 בעיות מילוליות</button>
    </div>

    <div class="progress-indicator" id="progress-box" style="display:none;">
        שאלה <span id="q-current">1</span> מתוך <span id="q-total">10</span>
    </div>

    <div id="game-area"></div>
    
    <div id="feedback" class="feedback"></div>

    <div style="margin-top: 20px; font-size: 1.2em; color: var(--primary);">
        ניקוד: <span id="score" style="font-weight:bold;">0</span> 🌟
    </div>
    
    <a href="index.html" class="back-link">חזרה לדף הראשי</a>
</div>

<script>
    let currentMode = 'expand';
    let currentSolution = null;
    let storyData = null;
    let score = 0;
    
    // משתנים לניהול סבב שאלות
    let questionCount = 0;
    const MAX_QUESTIONS = 10;

    function initGame(mode) {
        currentMode = mode;
        document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
        if(event && event.target && event.target.classList.contains('menu-btn')) {
            event.target.classList.add('active');
        }

        score = 0;
        questionCount = 1;
        document.getElementById('score').innerText = score;
        
        document.getElementById('progress-box').style.display = 'inline-block';
        document.getElementById('q-total').innerText = MAX_QUESTIONS;
        document.getElementById('feedback').innerText = '';
        
        generateQuestion();
    }

    function generateQuestion() {
        document.getElementById('q-current').innerText = questionCount;
        const area = document.getElementById('game-area');
        area.innerHTML = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('feedback').innerText = '';

        switch(currentMode) {
            case 'expand': generateExpand(area); break;
            case 'compare': generateCompare(area); break;
            case 'calc': generateCalc(area); break;
            case 'story': generateStory(area); break;
        }
    }

    function showSummary() {
        const area = document.getElementById('game-area');
        document.getElementById('progress-box').style.display = 'none';
        document.getElementById('feedback').innerText = ''; 
        confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });

        area.innerHTML = `
            <div class="summary-box">
                <h2>כל הכבוד! 🎉</h2>
                <p>סיימת את האימון בהצלחה!</p>
                <div class="final-score">הניקוד שלך: ${score} מתוך ${MAX_QUESTIONS * 10}</div>
                <button class="btn-restart" onclick="initGame('${currentMode}')">האם תרצי להתאמן שוב?</button>
            </div>
        `;
    }

    // --- 1. הרחבה וצמצום ---
    function generateExpand(area) {
        const baseNumer = randomInt(1, 5);
        const baseDenom = randomInt(baseNumer + 1, 9);
        const factor = randomInt(2, 5);
        const expandedNumer = baseNumer * factor;
        const expandedDenom = baseDenom * factor;
        const qType = randomInt(1, 3);

        let html = `
            <div class="expand-container">
                <div class="equation-box">
                    ${createFractionHtml(baseNumer, baseDenom)}
                    <span style="margin: 0 10px;">=</span>
        `;
        html += `<div class="fraction">`;
        if (qType === 1) { 
            html += `<span class="numer"><input type="number" id="ansN" placeholder="?"></span>
                     <span class="denom"><input type="number" id="ansD" placeholder="?"></span>`;
        } else if (qType === 2) { 
            html += `<span class="numer"><input type="number" id="ansN" placeholder="?"></span>
                     <span class="denom" style="font-weight:bold; font-size:1.1em;">${expandedDenom}</span>`;
        } else { 
            html += `<span class="numer" style="font-weight:bold; font-size:1.1em;">${expandedNumer}</span>
                     <span class="denom"><input type="number" id="ansD" placeholder="?"></span>`;
        }
        html += `</div></div>`; 

        html += `
            <div class="factor-box">
                <span class="factor-label">בכמה כפלנו?</span>
                <div style="font-size: 1.4em; display:flex; align-items:center; justify-content:center;">
                    <span>× </span>
                    ${qType === 1 ? `<b style="margin-left:5px;">${factor}</b>` : '<input type="number" id="ansFactor" style="width:40px; margin-left:5px;">'}
                </div>
            </div>
        </div>`;

        currentSolution = { n: expandedNumer, d: expandedDenom, f: factor, type: qType };
        html += '<button class="btn-check" onclick="checkExpand()">בדיקה</button>';
        area.innerHTML = html;
    }

    function checkExpand() {
        let isCorrect = true;
        const s = currentSolution;
        if (s.type === 1) {
            if (parseInt(document.getElementById('ansN').value) !== s.n) isCorrect = false;
            if (parseInt(document.getElementById('ansD').value) !== s.d) isCorrect = false;
        } else {
            if (parseInt(document.getElementById('ansFactor').value) !== s.f) isCorrect = false;
            if (s.type === 2 && parseInt(document.getElementById('ansN').value) !== s.n) isCorrect = false;
            if (s.type === 3 && parseInt(document.getElementById('ansD').value) !== s.d) isCorrect = false;
        }
        if(isCorrect) correct(); else wrong();
    }

    // --- 4. בעיות מילוליות (משודרג) ---
    function generateStory(area) {
        // רשימת תבניות מורחבת
        const templates = [
            { text: "רוני אכל {frac1} מהפיצה, ודנה אכלה {frac2} מהפיצה. כמה פיצה אכלו שניהם יחד?", op: '+', type: 'add' },
            { text: "במיכל היו {frac1} ליטר מים. דני שפך החוצה {frac2} ליטר. כמה מים נשארו במיכל?", op: '-', type: 'sub' },
            { text: "אמא קנתה {frac1} קילוגרם קמח לעוגה, והוסיפה עוד {frac2} קילוגרם קמח לחלות. כמה קמח יש לה בסך הכל?", op: '+', type: 'add' },
            { text: "יוסי רץ {frac1} קילומטר ביום ראשון, וביום שני רץ {frac2} קילומטר. כמה קילומטרים רץ ביומיים?", op: '+', type: 'add' },
            { text: "לדנה היה חבל באורך {frac1} מטר. היא גזרה ממנו חתיכה באורך {frac2} מטר. מה אורך החבל שנשאר?", op: '-', type: 'sub' },
            { text: "דני קרא {frac1} מהספר בבוקר, ובערב קרא עוד {frac2} מהספר. איזה חלק מהספר קרא בסך הכל?", op: '+', type: 'add' }
        ];

        const t = templates[Math.floor(Math.random() * templates.length)];
        const denom = randomInt(4, 8);
        let n1, n2;
        
        // יצירת מספרים רנדומליים
        if (t.type === 'sub') { 
            n1 = randomInt(2, denom * 2); // מאפשר גם מספרים גדולים מ-1
            n2 = randomInt(1, n1 - 1); 
        } else { 
            n1 = randomInt(denom - 2, denom + 2); 
            n2 = randomInt(3, denom); 
        }

        // --- לוגיקה למספרים שלמים ---
        // בחלק מהמקרים (30%), נהפוך את אחד המספרים לשלם (אם הוא מתחלק ב-denom או בכוח)
        if (Math.random() < 0.3) {
            // נבחר רנדומלית אם להפוך את הראשון או השני לשלם (למשל 2 שלמים)
            const wholeNum = randomInt(1, 3);
            if (Math.random() > 0.5) {
                n1 = wholeNum * denom; // הופך את n1 לשלם
            } else if (t.type === 'sub' && (wholeNum * denom) < n1) {
                n2 = wholeNum * denom; // הופך את n2 לשלם (רק אם זה אפשרי בחיסור)
            }
        }

        // פונקציית עזר להצגת מספר (שבר או שלם)
        const formatStoryNumber = (n, d) => {
            if (n % d === 0) {
                return `<span class="whole-num-story">${n/d}</span>`; // מספר שלם
            }
            return createFractionHtml(n, d); // שבר
        };

        const storyText = t.text
            .replace('{frac1}', formatStoryNumber(n1, denom))
            .replace('{frac2}', formatStoryNumber(n2, denom));

        let resultN = (t.op === '+') ? n1 + n2 : n1 - n2;
        const mixedWhole = Math.floor(resultN / denom);
        const mixedRem = resultN % denom;
        
        storyData = { n1, n2, d: denom, op: t.op, resN: resultN, resD: denom, mixW: mixedWhole, mixN: mixedRem };

        let html = `
            <div class="story-text">${storyText}</div>
            <div class="story-step">
                <span class="step-label">שלב 1: כתבי את התרגיל (משמאל לימין)</span>
                <div style="font-size:0.85em; color:#555; margin-bottom:5px;">(אם יש מספר שלם בסיפור, למשל 3, כתבי אותו כשבר: 3 למעלה ו-1 למטה)</div>
                <div style="display:flex; justify-content:center; align-items:center; gap:8px; direction:ltr;">
                    <div class="fraction">
                        <span class="numer"><input type="number" id="exN1" style="width:40px"></span>
                        <span class="denom"><input type="number" id="exD1" style="width:40px"></span>
                    </div>
                    <select id="exOp" style="font-size:1.2em; padding:5px; margin:0 5px;"><option value="+">+</option><option value="-">-</option></select>
                    <div class="fraction">
                        <span class="numer"><input type="number" id="exN2" style="width:40px"></span>
                        <span class="denom"><input type="number" id="exD2" style="width:40px"></span>
                    </div>
                    <span style="font-size:1.5em; margin:0 5px;">=</span>
                </div>
            </div>
            
            <div class="tip-box">💡 רמז: כדי להפוך שלם לשבר מדומה, כופלים את השלם במכנה. למשל: 3 שלמים עם מכנה 4, זה 12 רבעים (12/4).</div>
            
            <div class="story-step">
                <span class="step-label">שלב 2: פתרי כשבר מדומה (רק מונה ומכנה)</span>
                <div class="fraction" style="font-size:1.3em;">
                    <span class="numer"><input type="number" id="impN"></span>
                    <span class="denom"><input type="number" id="impD"></span>
                </div>
            </div>
            <div class="story-step">
                <span class="step-label">שלב 3: הפכי לשבר מעורב (מספר שלם + שבר)</span>
                <div style="display:flex; align-items:center; justify-content:center; gap:8px; direction: ltr; font-size:1.3em;">
                    <input type="number" id="mixW" placeholder="שלם" style="width:55px; height:50px; font-size:1.1em; border:3px solid var(--primary);">
                    <div class="fraction">
                        <span class="numer"><input type="number" id="mixN" placeholder="שארית"></span>
                        <span class="denom"><input type="number" id="mixD" placeholder="מכנה"></span>
                    </div>
                </div>
                <div style="font-size:0.8em; color:#888; margin-top:5px; text-align:center;">(אם אין שלם או אין שארית, כתבי 0)</div>
            </div>
            <button class="btn-check" onclick="checkStory()">בדיקה</button>
        `;
        area.innerHTML = html;
    }

    function checkStory() {
        const d = storyData;
        let errors = [];
        const uN1 = parseInt(document.getElementById('exN1').value); const uD1 = parseInt(document.getElementById('exD1').value);
        const uOp = document.getElementById('exOp').value;
        const uN2 = parseInt(document.getElementById('exN2').value); const uD2 = parseInt(document.getElementById('exD2').value);

        // בדיקת שקילות (מאפשר גם 3/1 וגם 12/4)
        const val1 = uN1 / uD1;
        const val2 = uN2 / uD2;
        const target1 = d.n1 / d.d;
        const target2 = d.n2 / d.d;

        let exCorrect = false;
        // בדיקת שוויון ערכים (במקום מספרים מדויקים)
        const isEq = (a, b) => Math.abs(a - b) < 0.001;

        if (d.op === '+') { 
            if (uOp === '+' && ((isEq(val1, target1) && isEq(val2, target2)) || (isEq(val1, target2) && isEq(val2, target1)))) exCorrect = true; 
        } 
        else { 
            if (uOp === '-' && isEq(val1, target1) && isEq(val2, target2)) exCorrect = true; 
        }
        
        if (!exCorrect) errors.push("יש טעות בכתיבת התרגיל בשלב 1 (בדקי שהעתקת את המספרים נכון)");

        const impN = parseInt(document.getElementById('impN').value); const impD = parseInt(document.getElementById('impD').value);
        // בדיקה שהתשובה בשבר מדומה שקולה לתוצאה
        if (!isEq(impN / impD, d.resN / d.resD)) errors.push("יש טעות בשבר המדומה בשלב 2");

        const mixW = parseInt(document.getElementById('mixW').value) || 0;
        const mixN = parseInt(document.getElementById('mixN').value) || 0;
        const mixD = parseInt(document.getElementById('mixD').value) || d.d; // אם המשתמש לא מילא מכנה
        
        const userMixVal = mixW + (mixN / mixD);
        if (!isEq(userMixVal, d.resN / d.resD)) errors.push("יש טעות בשבר המעורב בשלב 3");

        if (errors.length === 0) correct(); else {
            document.getElementById('feedback').innerText = errors[0];
            document.getElementById('feedback').className = 'feedback wrong';
        }
    }

    // --- פונקציות עזר ומשחקים אחרים ---
    function generateCompare(area) {
        let n1, d1, n2, d2;
        const strategy = randomInt(1, 3); 
        
        // יצירת המספרים
        if (strategy === 1) { 
            d1 = d2 = randomInt(3, 12); 
            n1 = randomInt(1, d1-1); 
            n2 = randomInt(1, d2-1); 
            while(n1===n2) n2=randomInt(1, d2-1); 
        } else if (strategy === 2) { 
            n1 = n2 = randomInt(1, 5); 
            d1 = randomInt(n1+1, 10); 
            d2 = randomInt(n1+1, 12); 
            while(d1===d2) d2=randomInt(n1+1, 12); 
        } else { 
            d1=randomInt(4,10); n1=1; 
            d2=randomInt(3,8); n2=d2-1; 
            if(Math.random()>0.5){[n1,n2]=[n2,n1];[d1,d2]=[d2,d1];} 
        }
        
        const val1 = n1/d1; 
        const val2 = n2/d2; 
        currentSolution = val1 > val2 ? '>' : (val1 < val2 ? '<' : '=');

        area.innerHTML = `
            <div class="question-box-simple">
                ${createFractionHtml(n1,d1)} 
                <div style="width:50px;text-align:center">?</div> 
                ${createFractionHtml(n2,d2)}
            </div>
            
            <div style="display:flex; gap:20px; margin-top:20px; direction:ltr;">
                <button class="menu-btn" style="font-size:1.5em; width:60px;" onclick="chkComp('>')">&gt;</button>
                <button class="menu-btn" style="font-size:1.5em; width:60px;" onclick="chkComp('=')">=</button>
                <button class="menu-btn" style="font-size:1.5em; width:60px;" onclick="chkComp('<')">&lt;</button>
            </div>
        `;
    }
    function chkComp(s){ if(s===currentSolution) correct(); else wrong(); }

    function generateCalc(area) {
        const denom = randomInt(3, 10); const n1 = randomInt(1, denom-1); const n2 = randomInt(1, denom-n1);
        const isPlus = Math.random() > 0.4;
        const num1 = isPlus ? n1 : Math.max(n1,n2); const num2 = isPlus ? n2 : Math.min(n1,n2);
        currentSolution = isPlus ? n1+n2 : num1-num2;
        area.innerHTML = `<div class="question-box-simple">${createFractionHtml(num1,denom)} <span>${isPlus?'+':'-'}</span> ${createFractionHtml(num2,denom)} <span>=</span> 
                          <div class="fraction"><span class="numer"><input id="ansC" type="number"></span><span class="denom">${denom}</span></div></div>
                          <button class="btn-check" onclick="chkCalc()">בדיקה</button>`;
    }
    function chkCalc(){ if(parseInt(document.getElementById('ansC').value)===currentSolution) correct(); else wrong(); }

    function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function createFractionHtml(n, d) { return `<div class="fraction"><span class="numer">${n}</span><span class="denom">${d}</span></div>`; }
    
    function correct() {
        score += 10; document.getElementById('score').innerText = score;
        document.getElementById('feedback').innerText = 'כל הכבוד! אלופה! 🎉';
        document.getElementById('feedback').className = 'feedback correct';
        confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
        
        if (questionCount >= MAX_QUESTIONS) {
            setTimeout(showSummary, 1500); 
        } else {
            questionCount++;
            setTimeout(generateQuestion, 2000);
        }
    }
    
    function wrong() {
        document.getElementById('feedback').innerText = 'אופס, נסי שוב... 💪';
        document.getElementById('feedback').className = 'feedback wrong';
    }
    
    initGame('expand');
</script>
</body>
</html>
