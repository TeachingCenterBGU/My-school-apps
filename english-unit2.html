<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הכנה למבחן באנגלית - כיתה ג' (גרסה מלאה)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Varela+Round&display=swap');

        body {
            font-family: 'Varela Round', sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }

        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            padding: 20px;
            width: 95%;
            max-width: 600px;
            text-align: center;
            margin-top: 20px;
        }

        h1 { color: #3f51b5; margin: 10px 0; font-size: 1.8em; }
        
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .menu-btn {
            background-color: white;
            border: 2px solid #3f51b5;
            border-radius: 15px;
            padding: 15px;
            font-size: 1.1em;
            cursor: pointer;
            transition: 0.2s;
            color: #3f51b5;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .menu-btn:hover { background-color: #e8eaf6; transform: translateY(-3px); }
        .menu-btn span { font-size: 2em; }

        /* Game Area */
        .game-area { display: none; }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #666;
        }

        .word-display {
            font-size: 2.5em;
            font-weight: bold;
            color: #e91e63;
            margin: 10px 0;
            font-family: sans-serif;
            letter-spacing: 1px;
        }

        .speaker-btn {
            background: #ff9800;
            border: none;
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 2em;
            cursor: pointer;
            box-shadow: 0 4px #f57c00;
            margin-bottom: 20px;
            transition: transform 0.1s;
        }
        .speaker-btn:active { transform: scale(0.95); box-shadow: 0 2px #f57c00; }

        .options-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .option-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 10px;
            font-size: 2.5em;
            cursor: pointer;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .option-card:hover { border-color: #2196f3; background: #e3f2fd; }
        
        .text-option {
            font-size: 1.5em;
            width: auto;
            min-width: 80px;
            font-weight: bold;
            padding: 10px 20px;
        }

        .feedback {
            height: 40px;
            margin-top: 15px;
            font-size: 1.3em;
            font-weight: bold;
        }
        .correct { color: #4caf50; }
        .wrong { color: #f44336; }

        .home-btn {
            margin-top: 30px;
            background: transparent;
            border: 1px solid #999;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        .progress-container {
            width: 100%;
            background-color: #eee;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 15px;
        }
        .progress-fill {
            height: 100%;
            background-color: #4caf50;
            width: 0%;
            border-radius: 10px;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="menu-screen">
            <h1>מתכוננים למבחן! 🇬🇧</h1>
            <p>בחרי מה לתרגל עכשיו:</p>
            
            <div class="menu-grid">
                <button class="menu-btn" onclick="startGame('vocab1')">
                    <span>🎒</span>
                    חלק א':<br>בית ספר וצבעים
                </button>
                <button class="menu-btn" onclick="startGame('vocab2')">
                    <span>🦁</span>
                    חלק ב':<br>חיות, אנשים ופעלים
                </button>
                <button class="menu-btn" onclick="startGame('letters')">
                    <span>Cc</span>
                    אותיות וצלילים
                </button>
                <button class="menu-btn" onclick="startGame('syllables')">
                    <span>👏</span>
                    חלוקה להברות
                </button>
            </div>
        </div>

        <div id="game-screen" class="game-area">
            <div class="top-bar">
                <span id="game-title"></span>
                <span>נותרו: <span id="cards-left">0</span></span>
            </div>
            
            <div class="progress-container"><div class="progress-fill" id="progress-bar"></div></div>

            <div id="question-area">
                <div id="instruction-text" style="font-size:1.1em; margin-bottom:10px;"></div>
                <div id="main-display" class="word-display"></div>
                <button class="speaker-btn" onclick="speakCurrent()">🔊</button>
                
                <div class="options-grid" id="options-box"></div>
            </div>

            <div class="feedback" id="feedback-msg"></div>

            <button class="home-btn" onclick="location.reload()">חזרה לתפריט</button>
        </div>

        <div id="win-screen" class="game-area" style="text-align: center;">
            <div style="font-size: 4em;">🏆🎉</div>
            <h2>כל הכבוד! סיימת את כל החפיסה!</h2>
            <p>את מוכנה לחלק הזה במבחן.</p>
            <button class="menu-btn" onclick="location.reload()" style="margin: 20px auto; width: 200px;">חזרה לתפריט</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        const vocab1 = [
            { word: "bag", icon: "🎒" }, { word: "book", icon: "📖" }, { word: "pen", icon: "🖊️" },
            { word: "pencil", icon: "✏️" }, { word: "glue", icon: "🧴" }, { word: "paper", icon: "📄" },
            { word: "ruler", icon: "📏" }, { word: "scissors", icon: "✂️" }, { word: "chair", icon: "🪑" },
            { word: "desk", icon: "🏫" }, { word: "classroom", icon: "👩‍🏫" }, { word: "school", icon: "🏫" },
            { word: "library", icon: "📚" }, { word: "pink", icon: "🩷" }, { word: "white", icon: "⚪" },
            { word: "black", icon: "⚫" }, { word: "green", icon: "🟢" }, { word: "orange", icon: "🟠" },
            { word: "bus", icon: "🚌" }, { word: "television", icon: "📺" }, { word: "star", icon: "⭐" }
        ];

        const vocab2 = [
            { word: "ant", icon: "🐜" }, { word: "alligator", icon: "🐊" }, { word: "bat", icon: "🦇" },
            { word: "cat", icon: "🐈" }, { word: "elephant", icon: "🐘" }, { word: "snake", icon: "🐍" },
            { word: "apple", icon: "🍎" }, { word: "banana", icon: "🍌" }, { word: "egg", icon: "🥚" },
            { word: "cake", icon: "🎂" }, { word: "teacher", icon: "👩‍🏫" }, { word: "pupil", icon: "👦" },
            { word: "woman", icon: "👩" }, { word: "clown", icon: "🤡" }, { word: "read", icon: "📖" },
            { word: "ask", icon: "❓" }, { word: "talk", icon: "🗣️" }, { word: "cut", icon: "✂️" },
            { word: "big", icon: "🐘" }, { word: "small", icon: "🐜" }, { word: "happy", icon: "😃" },
            { word: "sad", icon: "😢" }, { word: "mad", icon: "😡" }, { word: "afraid", icon: "😨" }
        ];

        // Syllables Data - UPDATED (No Hyphens for visual help)
        const syllablesData = [
            { word: "bag", count: 1 }, { word: "cat", count: 1 }, { word: "pen", count: 1 },
            { word: "book", count: 1 }, { word: "red", count: 1 }, { word: "big", count: 1 },
            { word: "dog", count: 1 }, { word: "glue", count: 1 },
            { word: "pencil", count: 2 }, { word: "ruler", count: 2 },
            { word: "teacher", count: 2 }, { word: "paper", count: 2 },
            { word: "zebra", count: 2 }, { word: "pupil", count: 2 },
            { word: "banana", count: 3 }, { word: "elephant", count: 3 },
            { word: "television", count: 4 }, { word: "alligator", count: 4 }
        ];

        // Letters Data - UPDATED & EXPANDED (Beginning, Middle, End)
        const lettersData = [
            // Matching Big/Small
            { type: "match", q: "B", a: "b", opts: ["b","d","p"] },
            { type: "match", q: "D", a: "d", opts: ["b","d","p"] },
            { type: "match", q: "E", a: "e", opts: ["e","c","o"] },
            { type: "match", q: "G", a: "g", opts: ["g","q","p"] },
            { type: "match", q: "A", a: "a", opts: ["a","o","e"] },
            { type: "match", q: "Q", a: "q", opts: ["q","g","p"] },
            { type: "match", q: "T", a: "t", opts: ["f","t","j"] },
            { type: "match", q: "S", a: "s", opts: ["s","z","c"] },

            // Beginning Sounds
            { type: "sound", pos: "Beginning", word: "cat", a: "c", opts: ["c","k","s"] },
            { type: "sound", pos: "Beginning", word: "bus", a: "b", opts: ["b","d","p"] },
            { type: "sound", pos: "Beginning", word: "ten", a: "t", opts: ["t","d","b"] },
            { type: "sound", pos: "Beginning", word: "egg", a: "e", opts: ["e","a","i"] },
            { type: "sound", pos: "Beginning", word: "snake", a: "s", opts: ["s","c","z"] },
            { type: "sound", pos: "Beginning", word: "pencil", a: "p", opts: ["p","b","f"] },
            { type: "sound", pos: "Beginning", word: "apple", a: "a", opts: ["a","e","o"] },

            // Ending Sounds
            { type: "sound", pos: "End", word: "bus", a: "s", opts: ["s","c","z"] },
            { type: "sound", pos: "End", word: "dog", a: "g", opts: ["g","k","j"] },
            { type: "sound", pos: "End", word: "cat", a: "t", opts: ["t","d","p"] },
            { type: "sound", pos: "End", word: "bag", a: "g", opts: ["g","d","b"] },
            { type: "sound", pos: "End", word: "pen", a: "n", opts: ["n","m","l"] },
            { type: "sound", pos: "End", word: "book", a: "k", opts: ["k","c","g"] },

            // Middle Sounds (Vowels)
            { type: "sound", pos: "Middle", word: "cat", a: "a", opts: ["a","e","i"] },
            { type: "sound", pos: "Middle", word: "pen", a: "e", opts: ["e","a","i"] },
            { type: "sound", pos: "Middle", word: "big", a: "i", opts: ["i","e","a"] },
            { type: "sound", pos: "Middle", word: "dad", a: "a", opts: ["a","o","u"] },
            { type: "sound", pos: "Middle", word: "sit", a: "i", opts: ["i","e","a"] },
            { type: "sound", pos: "Middle", word: "ten", a: "e", opts: ["e","a","i"] }
        ];

        // --- STATE & AUDIO ---
        let currentDeck = [];
        let currentItem = null;
        let gameMode = ""; 
        let initialDeckSize = 0;
        let canClick = true;

        // בחירת קול דיבור 
        let selectedVoice = null;

        // בוחרים "קול גברי" אם קיים במכשיר
        function pickPreferredVoice() {
            const voices = window.speechSynthesis?.getVoices?.() || [];
            if (!voices.length) return null;

            // רשימת העדפה לקולות גבריים נפוצים (ישתנה בין מחשבים/טלפונים)
            const preferredNames = [
                "Google US English",
                "Microsoft David",
                "Daniel",
                "Alex",
                "Mark",
                "David"
            ];

            // קודם מנסים לפי שם
            for (const name of preferredNames) {
                const v = voices.find(v => (v.name || "").includes(name) && (v.lang || "").startsWith("en"));
                if (v) return v;
            }

            // אחר כך כל קול אנגלית שמופיע "male" בשם (לא תמיד קיים)
            const maleHint = voices.find(v =>
                (v.lang || "").startsWith("en") &&
                /male|man|david|daniel|alex/i.test(v.name || "")
            );
            if (maleHint) return maleHint;

            // fallback: כל קול en-US / en-GB
            return voices.find(v => (v.lang || "").startsWith("en-US"))
                || voices.find(v => (v.lang || "").startsWith("en"))
                || voices[0];
        }

        function initVoices() {
            selectedVoice = pickPreferredVoice();
        }

        // חשוב: בדפדפנים שונים הקולות נטענים באיחור
        if ("speechSynthesis" in window) {
            window.speechSynthesis.onvoiceschanged = initVoices;
            initVoices();
        }

        function speakText(text) {
            if (!text) return;

            // מפסיקים דיבור קודם, כדי שלא יצטבר
            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = "en-US";
                u.rate = 0.9;
                if (selectedVoice) u.voice = selectedVoice;

                window.speechSynthesis.speak(u);
            } else {
                console.log("SpeechSynthesis לא נתמך בדפדפן הזה");
            }
        }
        // סוף בחירת דיבור

        function startGame(mode) {
            gameMode = mode;
            let sourceData = [];

            if (mode === 'vocab1') sourceData = [...vocab1];
            else if (mode === 'vocab2') sourceData = [...vocab2];
            else if (mode === 'syllables') sourceData = [...syllablesData];
            else if (mode === 'letters') sourceData = [...lettersData];

            currentDeck = sourceData.sort(() => Math.random() - 0.5);
            initialDeckSize = currentDeck.length;

            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            let title = "";
            if (mode === 'vocab1') title = "אוצר מילים: כיתה וצבעים";
            if (mode === 'vocab2') title = "אוצר מילים: חיות ופעלים";
            if (mode === 'letters') title = "אותיות וצלילים";
            if (mode === 'syllables') title = "חלוקה להברות";
            document.getElementById('game-title').innerText = title;

            loadNextCard();
        }

        function loadNextCard() {
            if (currentDeck.length === 0) {
                document.getElementById('game-screen').style.display = 'none';
                document.getElementById('win-screen').style.display = 'block';
                return;
            }

            currentItem = currentDeck[0];
            canClick = true;
            document.getElementById('feedback-msg').innerText = "";
            document.getElementById('cards-left').innerText = currentDeck.length;
            
            let percent = ((initialDeckSize - currentDeck.length) / initialDeckSize) * 100;
            document.getElementById('progress-bar').style.width = percent + "%";

            // Pre-load audio
            let textToSpeak = getSpeakableText();
            if (textToSpeak) {
                currentAudio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${textToSpeak}`);
            }

            renderCardUI();
        }

        function getSpeakableText() {
            if (gameMode.startsWith('vocab')) return currentItem.word;
            if (gameMode === 'syllables') return currentItem.word; // Now sends clean word "pencil"
            if (gameMode === 'letters' && currentItem.type === 'sound') return currentItem.word;
            return null;
        }

        function renderCardUI() {
            const display = document.getElementById('main-display');
            const instruct = document.getElementById('instruction-text');
            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = "";

            // VOCAB
            if (gameMode.startsWith('vocab')) {
                instruct.innerText = "הקשיבי למילה ובחרי את התמונה:";
                display.innerText = currentItem.word;
                
                let opts = [currentItem];
                while (opts.length < 3) {
                    let rand = (gameMode === 'vocab1' ? vocab1 : vocab2)[Math.floor(Math.random() * 20)];
                    if (rand && rand.word !== currentItem.word && !opts.includes(rand)) opts.push(rand);
                }
                opts.sort(() => Math.random() - 0.5);

                opts.forEach(o => {
                    let btn = document.createElement('div');
                    btn.className = 'option-card';
                    btn.innerText = o.icon;
                    btn.onclick = () => checkAnswer(o.word === currentItem.word);
                    optionsBox.appendChild(btn);
                });
            }
            
            // SYLLABLES
            else if (gameMode === 'syllables') {
                instruct.innerText = "הקשיבי: כמה הברות יש במילה?";
                display.innerText = currentItem.word; // Shows "pencil" without hyphens
                
                [1, 2, 3, 4].forEach(num => {
                    let btn = document.createElement('div');
                    btn.className = 'option-card text-option';
                    btn.innerText = num;
                    btn.onclick = () => checkAnswer(num === currentItem.count);
                    optionsBox.appendChild(btn);
                });
            }

            // LETTERS & SOUNDS
            else if (gameMode === 'letters') {
                if (currentItem.type === 'match') {
                    instruct.innerText = "התאימי אות קטנה לאות הגדולה:";
                    display.innerText = currentItem.q;
                    document.querySelector('.speaker-btn').style.display = 'none';
                } else {
                    instruct.innerText = `איזו אות את שומעת ב-${translatePos(currentItem.pos)} המילה?`;
                    display.innerText = "❓"; // Hide word so they listen
                    document.querySelector('.speaker-btn').style.display = 'inline-block';
                }

                currentItem.opts.sort(() => Math.random() - 0.5).forEach(letter => {
                    let btn = document.createElement('div');
                    btn.className = 'option-card text-option';
                    btn.innerText = letter;
                    btn.onclick = () => checkAnswer(letter === currentItem.a);
                    optionsBox.appendChild(btn);
                });
            }
        }

        function translatePos(pos) {
            if (pos === "Beginning") return "תחילת";
            if (pos === "End") return "סוף";
            if (pos === "Middle") return "אמצע";
            return "";
        }

        function speakCurrent() {
            const textToSpeak = getSpeakableText();
            speakText(textToSpeak);
        }

        function checkAnswer(isCorrect) {
            if (!canClick) return;
            canClick = false;

            const fb = document.getElementById('feedback-msg');
            if (isCorrect) {
                fb.innerText = "מעולה! 👏";
                fb.className = "feedback correct";
                setTimeout(() => {
                    currentDeck.shift();
                    loadNextCard();
                }, 1000);
            } else {
                fb.innerText = "לא נורא, נסי שוב מאוחר יותר";
                fb.className = "feedback wrong";
                setTimeout(() => {
                    let item = currentDeck.shift();
                    currentDeck.push(item);
                    loadNextCard();
                }, 1500);
            }
        }
    </script>
</body>
</html>
