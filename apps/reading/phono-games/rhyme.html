<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W58S98V8J0"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
      gtag('js',new Date());gtag('config','G-W58S98V8J0');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>שומרי החרוזים 🚪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&family=Secular+One&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Heebo',system-ui,sans-serif;color:#2a2350;text-align:center;
       background:linear-gradient(180deg,#dfeaff 0%,#eae0ff 100%);min-height:100vh;
       -webkit-user-select:none;user-select:none;touch-action:manipulation;}
  .stage{padding:16px 14px 40px;max-width:600px;margin:0 auto;}
  .instr{font-weight:800;color:#4a2f9e;font-size:1.12rem;margin:6px 0 2px;}
  .progress{color:#8a7fb8;font-weight:700;font-size:.95rem;margin-bottom:6px;}

  .hero{position:relative;display:flex;flex-direction:column;align-items:center;margin:8px 0 4px;}
  .heldpic{background:#fff;border-radius:26px;box-shadow:0 8px 22px rgba(0,0,0,.12);
       width:min(46vw,170px);height:min(46vw,170px);display:flex;align-items:center;justify-content:center;
       font-size:min(26vw,100px);border:4px solid #b39ddb;cursor:pointer;transition:transform .12s;}
  .heldpic:active{transform:scale(.96);}
  .say{background:#fff;border:2px solid #d1c4e9;border-radius:50px;padding:6px 16px;font-family:inherit;
       font-weight:800;color:#5e35b1;font-size:.95rem;cursor:pointer;margin:8px 0 2px;}

  .doors{display:flex;gap:16px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
  .door{background:linear-gradient(180deg,#a9764a,#8a5a2f);border-radius:16px 16px 8px 8px;
       padding:14px 12px 16px;width:min(40vw,180px);box-shadow:0 8px 18px rgba(0,0,0,.2);
       cursor:pointer;position:relative;border:4px solid #6e4423;transition:transform .12s;}
  .door:active{transform:scale(.97);}
  .door .win{background:#fff;border-radius:14px;height:min(34vw,150px);display:flex;align-items:center;
       justify-content:center;font-size:min(22vw,86px);}
  .door .knob{position:absolute;top:50%;right:10px;width:12px;height:12px;border-radius:50%;background:#ffd76a;}
  .door.right{animation:cheer .6s;border-color:#4caf50;}
  .door.wrong{animation:shake .4s;border-color:#e53935;}
  @keyframes cheer{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .guard{font-size:2.6rem;margin-top:2px;}
</style>
</head>
<body>
  <div class="stage">
    <div class="instr">מצאו את הדלת עם המילה שמתחרזת! 🎵</div>
    <div class="progress" id="prog"></div>
    <div class="hero">
      <div class="guard" id="guard"></div>
      <div class="heldpic" id="held" title="להשמיע שוב">❓</div>
      <button class="say" id="say">🔊 שמעו שוב</button>
    </div>
    <div class="doors" id="doors"></div>
  </div>

  <script src="../phono-data.js?v=17"></script>
  <script src="../reading-progress.js?v=16"></script>
  <script src="../reading-engine.js?v=16"></script>
  <script src="../reading-voices.js?v=17"></script>
  <script src="../phono-engine.js?v=17"></script>
  <script>
    const station = PG.currentStation() || { id:'ph-rhyme' };
    PG.mountTopBar('שומרי החרוזים 🚪');
    document.getElementById('guard').innerHTML = PG.unicorn(56);

    function buildRounds(n){
      const groups = phonoRimeGroups();
      const rounds = [];
      for(let i=0;i<n;i++){
        const g = phonoOne(groups);
        const pair = phonoPick(g, 2);          // [prompt, correct] מאותו חרוז
        const prompt = pair[0], right = pair[1];
        // מסיח: מילה מחרוז אחר, עם אימוג'י שונה
        let wrong;
        let guard=0;
        do { wrong = phonoOne(PHONO_WORDS); guard++; }
        while((wrong.rime===prompt.rime || wrong.emoji===right.emoji || wrong.emoji===prompt.emoji) && guard<50);
        rounds.push({ prompt, right, wrong });
      }
      return rounds;
    }

    let ROUNDS = buildRounds(6), idx=0, correct=0, locked=false;
    const heldEl=document.getElementById('held'), doorsEl=document.getElementById('doors'), progEl=document.getElementById('prog');

    function load(){
      locked=false;
      const r=ROUNDS[idx];
      progEl.textContent = `שלב ${idx+1} מתוך ${ROUNDS.length}`;
      heldEl.textContent = r.prompt.emoji;
      const opts = phonoShuffle([{w:r.right,ok:true},{w:r.wrong,ok:false}]);
      doorsEl.innerHTML='';
      opts.forEach(o=>{
        const d=document.createElement('div'); d.className='door';
        d.innerHTML=`<div class="win">${o.w.emoji}</div><span class="knob"></span>`;
        d.addEventListener('click', ()=>{ PG.playWord(o.w); choose(o.ok,d); });
        doorsEl.appendChild(d);
      });
      setTimeout(()=>PG.playWord(r.prompt), 350);
    }

    function choose(ok, el){
      if(locked) return;
      if(ok){
        locked=true; correct++; el.classList.add('right'); PG.ding();
        setTimeout(next, 850);
      }else{
        el.classList.add('wrong'); PG.buzz();
        setTimeout(()=>el.classList.remove('wrong'), 450);
      }
    }

    function next(){
      idx++;
      if(idx>=ROUNDS.length){
        PG.finish({ stationId:station.id, correct, total:ROUNDS.length,
          replay(){ idx=0;correct=0;ROUNDS=buildRounds(6);load(); }});
        return;
      }
      load();
    }

    heldEl.addEventListener('click', ()=>PG.playWord(ROUNDS[idx].prompt));
    document.getElementById('say').addEventListener('click', ()=>PG.playWord(ROUNDS[idx].prompt));
    load();
  </script>
</body>
</html>
