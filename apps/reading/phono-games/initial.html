<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W58S98V8J0"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
      gtag('js',new Date());gtag('config','G-W58S98V8J0');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>מפעל המיון 🏭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&family=Secular+One&display=swap">
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:'Heebo',system-ui,sans-serif;color:#173a1f;text-align:center;
       background:linear-gradient(180deg,#dff6e2 0%,#c7edcd 100%);
       -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;}
  .top{padding:4px 12px 6px;}
  .target{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:50px;
       padding:8px 18px;box-shadow:0 4px 12px rgba(0,0,0,.1);font-weight:800;color:#1f7a37;
       font-size:1.15rem;margin:4px auto;cursor:pointer;border:3px solid #86dd98;}
  .target .snd{font-size:1.6rem;}
  .hint{color:#4c8a5a;font-weight:700;font-size:.9rem;margin:2px 0;}
  .scorebar{font-weight:800;color:#2e7d32;}

  .area{position:relative;margin:6px auto 0;width:100%;max-width:620px;height:64vh;
       overflow:hidden;border-top:3px dashed #a5d6a7;}
  .belt{position:absolute;left:0;right:0;bottom:0;height:42px;
       background:repeating-linear-gradient(90deg,#8d6e63 0 20px,#795548 20px 40px);opacity:.85;}
  .belt::before{content:"🏭";position:absolute;bottom:6px;right:12px;font-size:1.8rem;}
  .item{position:absolute;width:70px;height:70px;display:flex;align-items:center;justify-content:center;
       font-size:52px;cursor:pointer;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18));will-change:transform;}
  .item.caught{animation:caught .4s forwards;}
  @keyframes caught{to{transform:scale(1.6);opacity:0}}
  .item.nope{animation:nope .4s;}
  @keyframes nope{0%,100%{transform:rotate(0)}25%{transform:rotate(-16deg)}75%{transform:rotate(16deg)}}
</style>
</head>
<body>
  <div class="top">
    <div class="target" id="target"><span class="snd" id="snd">🔊</span><span id="tlabel">/ /</span></div>
    <div class="hint">תפסו רק תמונות שמתחילות בצליל הזה! ✋</div>
    <div class="scorebar" id="score"></div>
  </div>
  <div class="area" id="area"><div class="belt"></div></div>

  <script src="../phono-data.js?v=17"></script>
  <script src="../reading-progress.js?v=16"></script>
  <script src="../reading-engine.js?v=16"></script>
  <script src="../reading-voices.js?v=18"></script>
  <script src="../phono-engine.js?v=17"></script>
  <script>
    const station = PG.currentStation() || { id:'ph-catch-p1', sounds:['מ','ש','ר','ל','ס'] };
    PG.mountTopBar('מפעל המיון 🏭');
    const SOUNDS = (station.sounds && station.sounds.length) ? station.sounds : ['מ','ש','ר','ל','ס'];

    const NEED = 3;                                  // כמה נכונים לתפוס בכל גל
    const targets = phonoPick(SOUNDS, Math.min(3, SOUNDS.length));
    let waveIdx = 0, correct = 0, total = NEED * targets.length;
    let active = [], spawnQueue = [], spawnTimer = null, rafId = null, target = null;

    const area = document.getElementById('area');
    const sndEl = document.getElementById('snd');
    const tlabel = document.getElementById('tlabel');
    const scoreEl = document.getElementById('score');
    document.getElementById('target').addEventListener('click', ()=>PG.playSound(target));

    function updateScore(){ scoreEl.textContent = '⭐ ' + correct + ' / ' + total; }

    function startWave(){
      target = targets[waveIdx];
      sndEl.textContent = (PHONO_SOUNDS[target]||{}).emoji || '🔊';
      tlabel.textContent = phonoSoundLabel(target);
      setTimeout(()=>PG.playSound(target), 300);

      // רשימת פריטים: 3 נכונים + 4 מסיחים, מעורבבים
      const corrects = phonoPick(phonoWordsBySound(target), NEED);
      const distractPool = PHONO_WORDS.filter(w=>w.init!==target);
      const distract = phonoPick(distractPool, 4);
      spawnQueue = phonoShuffle(corrects.map(w=>({w,ok:true})).concat(distract.map(w=>({w,ok:false}))));
      scheduleSpawn();
    }

    function scheduleSpawn(){
      if(spawnQueue.length===0){ spawnTimer=null; return; }
      const it = spawnQueue.shift();
      spawnItem(it);
      spawnTimer = setTimeout(scheduleSpawn, 850 + Math.random()*350);
    }

    function spawnItem(it){
      const el=document.createElement('div');
      el.className='item'; el.textContent=it.w.emoji;
      const maxX = area.clientWidth - 74;
      const x = 4 + Math.random()*Math.max(10,maxX);
      const speed = 60 + Math.random()*35;           // px לשנייה
      const obj = { el, ...it, x, y:-74, speed, alive:true };
      el.style.left = x+'px'; el.style.top = '0px';
      el.addEventListener('click', ()=>catchItem(obj));
      area.appendChild(el);
      active.push(obj);
    }

    function catchItem(obj){
      if(!obj.alive) return;
      if(obj.ok){
        obj.alive=false; correct++; updateScore();
        obj.el.classList.add('caught'); PG.ding(); PG.playWord(obj.w);
        setTimeout(()=>obj.el.remove(), 380);
        removeActive(obj);
      }else{
        PG.buzz(); obj.el.classList.remove('nope'); void obj.el.offsetWidth; obj.el.classList.add('nope');
      }
    }

    function removeActive(obj){ const i=active.indexOf(obj); if(i>=0) active.splice(i,1); }

    let last = null;
    function loop(ts){
      if(last===null) last=ts;
      const dt = Math.min(0.05,(ts-last)/1000); last=ts;
      const bottom = area.clientHeight - 40;
      for(let i=active.length-1;i>=0;i--){
        const o=active[i];
        o.y += o.speed*dt;
        o.el.style.transform = `translateY(${o.y}px)`;
        if(o.y >= bottom){
          o.alive=false; o.el.remove(); active.splice(i,1);
          // פריט נכון שנפל = החמצה (נספר כ"הזדמנות" שכבר נכללת ב-total)
        }
      }
      // סוף גל: אין תור ואין פריטים חיים
      if(!spawnTimer && spawnQueue.length===0 && active.length===0){
        endWave(); return;
      }
      rafId = requestAnimationFrame(loop);
    }

    function endWave(){
      waveIdx++;
      if(waveIdx >= targets.length){
        PG.finish({ stationId:station.id, correct, total,
          replay(){ location.reload(); }});
        return;
      }
      last=null; startWave(); rafId=requestAnimationFrame(loop);
    }

    updateScore();
    startWave();
    rafId = requestAnimationFrame(loop);
  </script>
</body>
</html>
