<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>הכרת האות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Heebo',system-ui,sans-serif;background:#fff3e0;color:#3a2a12;
       min-height:100vh;text-align:center;display:flex;flex-direction:column;align-items:center;}
  .stage{width:100%;max-width:460px;padding:16px;flex:1;display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:10px;}
  .prompt{font-size:1.4em;font-weight:800;color:#e65100;min-height:1.4em;}
  .card{background:#fff;border:5px solid #ffb74d;border-radius:28px;padding:22px;width:100%;
        box-shadow:0 10px 24px rgba(0,0,0,.10);}
  .big-letter{font-size:9rem;line-height:1;font-weight:800;color:#ef6c00;cursor:pointer;
              transition:transform .15s;user-select:none;}
  .big-letter:active{transform:scale(.9);}
  .example{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;cursor:pointer;}
  .example .emo{font-size:3.4rem;}
  .example .word{font-size:2rem;font-weight:700;color:#555;}
  .hint{color:#999;font-size:.95em;margin-top:6px;}
  .go-btn{margin-top:16px;background:#ff9800;color:#fff;border:none;border-radius:50px;
          padding:14px 40px;font-size:1.35em;font-weight:800;font-family:inherit;cursor:pointer;
          box-shadow:0 4px 0 #e67e00;}
  .go-btn:active{transform:translateY(3px);box-shadow:none;}
  .options{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;margin-top:6px;}
  .opt{background:#e0f7fa;border:4px solid #4dd0e1;border-radius:20px;font-size:3.4rem;
       font-weight:800;color:#006064;padding:14px 0;cursor:pointer;box-shadow:0 5px 0 #00acc1;
       transition:transform .1s;}
  .opt:active{transform:translateY(4px);box-shadow:none;}
  .opt.correct{background:#c8e6c9;border-color:#4caf50;box-shadow:0 5px 0 #388e3c;color:#1b5e20;animation:bp .5s;}
  .opt.wrong{background:#ffcdd2;border-color:#ef5350;color:#b71c1c;animation:sh .4s;}
  @keyframes bp{40%{transform:translateY(-10px)}}
  @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .progress-dots{display:flex;gap:8px;justify-content:center;margin-top:4px;}
  .dot{width:12px;height:12px;border-radius:50%;background:#ffe0b2;}
  .dot.on{background:#ff9800;}
</style>
</head>
<body>
  <div class="stage" id="stage"></div>

  <script src="../reading-data.js"></script>
  <script src="../reading-progress.js"></script>
  <script src="../reading-engine.js"></script>
  <script>
    RG.audioBase = '../../../letters/';
    const station = RG.currentStation();
    const stage = document.getElementById('stage');

    if (!station || station.type !== 'meet') {
      stage.innerHTML = '<p>לא נמצאה תחנה. <a href="../journey.html">חזרה למפה</a></p>';
    } else {
      RG.mountTopBar('הכרת האות ' + station.letter);
      const letter = station.letter;
      const data = READING_LETTERS[letter];
      const ROUNDS = 4;
      let round = 0, correct = 0, locked = false;

      showIntro();

      function showIntro() {
        stage.innerHTML =
          `<div class="prompt">בואי נכיר את האות</div>
           <div class="card">
             <div class="big-letter" id="bl">${letter}</div>
             <div class="example" id="ex">
               <span class="emo">${data.emoji}</span>
               <span class="word">${data.word}</span>
             </div>
             <div class="hint">לחצי על האות או על התמונה כדי לשמוע 🔊</div>
           </div>
           <button class="go-btn" id="go">אני מוכנה! ➡️</button>`;
        document.getElementById('bl').onclick = () => RG.playLetter(letter);
        document.getElementById('ex').onclick = () => RG.playWord(letter);
        document.getElementById('go').onclick = startPractice;
        // הצגה קולית פותחת: "האות ... כמו במילה ..."
        setTimeout(async () => {
          await RG.playLetter(letter);
          setTimeout(() => RG.playWord(letter), 350);
        }, 400);
      }

      function startPractice() { round = 0; correct = 0; nextRound(); }

      function nextRound() {
        if (round >= ROUNDS) {
          RG.finish({ stationId: station.id, correct, total: ROUNDS, replay: showIntro });
          return;
        }
        locked = false;
        const distractors = RG.pickDistractors(2, [letter]);
        const opts = RG.shuffle([letter, ...distractors]);
        stage.innerHTML =
          `<div class="prompt">איפה האות <b style="color:#ef6c00">${letter}</b>?</div>
           <div class="progress-dots">${dotsHTML()}</div>
           <div class="options" id="opts"></div>
           <div class="hint">שמעת? לחצי על האות הנכונה</div>`;
        const grid = document.getElementById('opts');
        opts.forEach(l => {
          const b = document.createElement('div');
          b.className = 'opt'; b.textContent = l;
          b.onclick = () => choose(l, b);
          grid.appendChild(b);
        });
        setTimeout(() => RG.playLetter(letter), 350);
      }

      function dotsHTML() {
        let h = '';
        for (let i = 0; i < ROUNDS; i++) h += `<span class="dot ${i < round ? 'on' : ''}"></span>`;
        return h;
      }

      function choose(l, el) {
        if (locked) return;
        if (l === letter) {
          locked = true;
          el.classList.add('correct');
          correct++; round++;
          RG.ding(); RG.playLetter(letter);
          setTimeout(nextRound, 1000);
        } else {
          el.classList.add('wrong');
          RG.buzz();
          setTimeout(() => el.classList.remove('wrong'), 450);
        }
      }
    }
  </script>
</body>
</html>
