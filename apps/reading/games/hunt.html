<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ציד האותיות ביער</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:'Heebo',system-ui,sans-serif;color:#2a3b2a;min-height:100vh;
       display:flex;flex-direction:column;}
  .hud{text-align:center;font-weight:800;font-size:1.2em;color:#1b5e20;padding:8px;
       background:rgba(255,255,255,.75);}
  .hud b{color:#ef6c00;font-size:1.35em;}
  .hud .sfx{cursor:pointer;}
  .hud .sc{background:#2e7d32;color:#fff;border-radius:50px;padding:2px 12px;margin-inline-start:6px;font-size:.85em;}
  .waves{font-size:.8em;color:#33691e;}

  .scene{position:relative;flex:1;width:100%;overflow:hidden;touch-action:manipulation;
         background:linear-gradient(180deg,#aee3ff 0%,#cdeffb 22%,#bfe89a 52%,#8ccf63 100%);}
  .deco{position:absolute;pointer-events:none;user-select:none;z-index:0;
        filter:drop-shadow(0 3px 3px rgba(0,0,0,.12));}
  .letter{position:absolute;z-index:2;font-weight:800;cursor:pointer;user-select:none;
          text-shadow:0 2px 0 rgba(255,255,255,.7),0 3px 6px rgba(0,0,0,.25);
          transition:transform .1s;}
  .letter:active{transform:scale(.85);}
  .letter.found{animation:found .5s forwards;pointer-events:none;}
  @keyframes found{60%{transform:scale(1.5)}100%{transform:scale(0);opacity:0}}
  .letter.miss{animation:miss .35s;}
  @keyframes miss{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
  .spark{position:absolute;z-index:3;font-size:1.6rem;pointer-events:none;animation:sp .6s forwards;}
  @keyframes sp{to{transform:translateY(-30px) scale(1.4);opacity:0}}
</style>
</head>
<body>
  <div class="hud" id="hud"></div>
  <div class="scene" id="scene"></div>

  <script src="../reading-data.js"></script>
  <script src="../reading-progress.js"></script>
  <script src="../reading-engine.js"></script>
  <script>
    RG.audioBase = '../../../letters/';
    const station = RG.currentStation();

    if (!station || station.type !== 'hunt') {
      document.getElementById('scene').innerHTML =
        '<p style="padding:20px">לא נמצאה תחנה. <a href="../journey.html">חזרה למפה</a></p>';
    } else {
      RG.mountTopBar('ציד האותיות', { bg: false });
      const scene = document.getElementById('scene');
      const groupLetters = station.letters;
      const allLetters = Object.keys(READING_LETTERS);
      const COLORS = ['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa','#d81b60','#00897b','#6d4c41'];
      const waves = RG.shuffle(groupLetters).slice(0, 4);
      let waveIdx = 0, totalTargets = 0, wrongTaps = 0;

      buildDeco();
      nextWave();

      // עצים/פרחים/פטריות ברקע (לא נלחצים)
      function buildDeco() {
        const trees = ['🌳','🌲','🌳','🌲','🌳'];
        trees.forEach((t, i) => {
          const d = document.createElement('div');
          d.className = 'deco'; d.textContent = t;
          d.style.fontSize = (70 + Math.random() * 40) + 'px';
          d.style.bottom = '-6px';
          d.style.left = (i * 21 + Math.random() * 6) + '%';
          scene.appendChild(d);
        });
        ['🌿','🍄','🌸','🌼','🌿','🐞','🦋'].forEach(e => {
          const d = document.createElement('div');
          d.className = 'deco'; d.textContent = e;
          d.style.fontSize = (22 + Math.random() * 22) + 'px';
          d.style.top = (30 + Math.random() * 60) + '%';
          d.style.left = (Math.random() * 92) + '%';
          scene.appendChild(d);
        });
        const sun = document.createElement('div');
        sun.className = 'deco'; sun.textContent = '☀️';
        sun.style.fontSize = '54px'; sun.style.top = '6px'; sun.style.left = '6%';
        scene.appendChild(sun);
      }

      function clearLetters() {
        scene.querySelectorAll('.letter,.spark').forEach(el => el.remove());
      }

      function nextWave() {
        RG.stopAudio();
        if (waveIdx >= waves.length) {
          const correct = Math.max(0, totalTargets - wrongTaps);
          RG.finish({ stationId: station.id, correct, total: totalTargets, replay: restart });
          return;
        }
        clearLetters();
        const target = waves[waveIdx];
        const nTargets = 2 + Math.floor(Math.random() * 2); // 2-3
        totalTargets += nTargets;
        let found = 0;

        // רשימת אותיות: יעדים + מסיחים
        const items = [];
        for (let i = 0; i < nTargets; i++) items.push(target);
        const distractors = allLetters.filter(l => l !== target);
        const nDistract = 11 + Math.floor(Math.random() * 4);
        for (let i = 0; i < nDistract; i++)
          items.push(distractors[Math.floor(Math.random() * distractors.length)]);

        updateHud(target, found, nTargets);

        RG.shuffle(items).forEach(ch => {
          const el = document.createElement('div');
          el.className = 'letter';
          el.textContent = ch;
          el.style.fontSize = (30 + Math.random() * 44) + 'px';
          el.style.color = COLORS[Math.floor(Math.random() * COLORS.length)];
          el.style.left = (4 + Math.random() * 86) + '%';
          el.style.top = (6 + Math.random() * 78) + '%';
          el.style.transform = 'rotate(' + (Math.random() * 40 - 20) + 'deg)';
          el.onclick = () => {
            if (el.classList.contains('found')) return;
            if (ch === target) {
              el.classList.add('found');
              sparkle(el);
              RG.ding();
              found++;
              updateHud(target, found, nTargets);
              if (found >= nTargets) { waveIdx++; setTimeout(nextWave, 800); }
            } else {
              wrongTaps++;
              RG.buzz();
              el.classList.add('miss');
              setTimeout(() => el.classList.remove('miss'), 350);
            }
          };
          scene.appendChild(el);
        });
        setTimeout(() => RG.playLetter(target), 400);
      }

      function sparkle(el) {
        const s = document.createElement('div');
        s.className = 'spark'; s.textContent = '⭐';
        s.style.left = el.style.left; s.style.top = el.style.top;
        scene.appendChild(s);
        setTimeout(() => s.remove(), 600);
      }

      function updateHud(target, found, nTargets) {
        document.getElementById('hud').innerHTML =
          `מצאי את כל האותיות <b>${target}</b> <span class="sfx" id="sfx">🔊</span>
           <span class="sc">${found}/${nTargets}</span>
           <div class="waves">גל ${Math.min(waveIdx + 1, waves.length)} מתוך ${waves.length}</div>`;
        document.getElementById('sfx').onclick = () => RG.playLetter(target);
      }

      function restart() { waveIdx = 0; totalTargets = 0; wrongTaps = 0; nextWave(); }
    }
  </script>
</body>
</html>
