<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <!-- Google Analytics (מזהה האתר הגדול) -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>מסע האוצרות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:'Heebo',system-ui,sans-serif;color:#2a3b2a;min-height:100vh;display:flex;flex-direction:column;}
  .hud{text-align:center;font-weight:800;font-size:1.15em;color:#2e7d32;padding:8px;background:rgba(255,255,255,.85);}
  .hud .big{color:#ef6c00;font-size:1.5em;vertical-align:-2px;}
  .hud .sfx{cursor:pointer;}
  .hud .sc{background:#2e7d32;color:#fff;border-radius:50px;padding:2px 12px;margin-inline-start:6px;font-size:.85em;}
  .hud .nm{color:#7a5cc0;font-size:.8em;}

  .scene{position:relative;flex:1;width:100%;overflow:hidden;touch-action:none;
         background:linear-gradient(180deg,#bfe9ff 0%,#dff3ff 22%,#c8ef9e 52%,#96d86a 100%);}
  .watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
             font-weight:800;font-size:44vh;color:rgba(255,255,255,.30);z-index:0;pointer-events:none;user-select:none;}
  .deco{position:absolute;bottom:-4px;pointer-events:none;user-select:none;z-index:0;}
  .item{position:absolute;z-index:2;display:flex;align-items:center;justify-content:center;border-radius:50%;
        background:rgba(255,255,255,.85);box-shadow:0 3px 8px rgba(0,0,0,.18);}
  .item.got{animation:got .45s forwards;}
  @keyframes got{60%{transform:scale(1.4)}100%{transform:scale(0);opacity:0}}
  .item.no{animation:no .35s;}
  @keyframes no{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
  .uni{position:absolute;z-index:4;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25));}
  .spark{position:absolute;z-index:5;font-size:1.5rem;pointer-events:none;animation:rise .7s forwards;}
  @keyframes rise{to{transform:translateY(-40px) scale(1.4);opacity:0}}
  .banner{position:absolute;top:8px;right:50%;transform:translateX(50%);z-index:3;
          background:rgba(255,255,255,.9);border-radius:40px;padding:4px 16px;font-weight:800;color:#5a3d1e;
          box-shadow:0 3px 8px rgba(0,0,0,.12);white-space:nowrap;}
</style>
</head>
<body>
  <div class="hud" id="hud"></div>
  <div class="scene" id="scene">
    <div class="watermark" id="wm"></div>
    <div class="uni" id="uni"></div>
  </div>

  <script src="../reading-data.js?v=16"></script>
  <script src="../reading-progress.js?v=16"></script>
  <script src="../reading-profile.js?v=16"></script>
  <script src="../reading-voices.js?v=18"></script>
  <script src="../reading-engine.js?v=16"></script>
  <script>
    RG.audioBase = '../../../letters/';
    const station = RG.currentStation();
    const scene = document.getElementById('scene');

    if (!station || station.type !== 'quiz') {
      scene.innerHTML = '<p style="padding:20px">לא נמצאה תחנה. <a href="../journey.html">חזרה למפה</a></p>';
    } else {
      RG.mountTopBar('מסע האוצרות ' + (station.groupName || ''), { bg: false });
      const pool = station.letters;
      const mixed = !!station.mixed;
      const allLetters = Object.keys(READING_LETTERS);
      const screens = mixed ? RG.shuffle(pool).slice(0, 5) : pool.slice();

      const uni = document.getElementById('uni');
      uni.innerHTML = RG.unicorn(66);
      const UR = 33, IR = 28;
      let ux = 60, uy = 60, tx = 60, ty = 60;         // מיקום ויעד של היוניקורן
      let items = [], screenIdx = 0, target = null, needed = 0, gotThis = 0;
      let collectedAll = 0, wrongAll = 0, raf = null, lastT = 0, running = true;

      buildDeco();
      requestAnimationFrame(() => { ux = tx = scene.clientWidth / 2; uy = ty = scene.clientHeight - 80;
                                    setupScreen(); raf = requestAnimationFrame(frame); });

      function buildDeco() {
        ['🌳','🌲','🌳','🌲','🌳'].forEach((t, i) => {
          const d = document.createElement('div'); d.className = 'deco'; d.textContent = t;
          d.style.fontSize = (58 + Math.random() * 26) + 'px'; d.style.left = (i * 21 + Math.random() * 5) + '%';
          scene.appendChild(d);
        });
      }

      // הזזת היוניקורן לפי האצבע
      function setTarget(e) { const r = scene.getBoundingClientRect(); tx = e.clientX - r.left; ty = e.clientY - r.top; }
      scene.addEventListener('pointerdown', e => { if (running) setTarget(e); });
      scene.addEventListener('pointermove', e => { if (running && (e.buttons || e.pressure)) setTarget(e); });

      function setupScreen() {
        RG.stopAudio();
        items.forEach(it => it.el.remove()); items = [];
        target = screens[screenIdx];
        const W = scene.clientWidth, H = scene.clientHeight;
        document.getElementById('wm').textContent = target;

        // אוצרות נכונים = מילים של האות; מסיחים = מילים של אותיות אחרות
        const correct = RG.shuffle(letterWords(target)).slice(0, Math.min(3, letterWords(target).length));
        needed = correct.length; gotThis = 0;
        updateHud(0, needed);
        const others = allLetters.filter(l => l !== target);
        const distract = [];
        for (let i = 0; i < 5; i++) { const l = others[Math.floor(Math.random() * others.length)]; distract.push({ l, w: pickWord(l) }); }

        const list = RG.shuffle(
          correct.map(w => ({ correct: true, letter: target, w }))
            .concat(distract.map(d => ({ correct: false, letter: d.l, w: d.w }))));

        const placed = [];
        list.forEach(entry => {
          const size = 52 + Math.random() * 10, r = size / 2;
          let cx, cy, ok = false;
          for (let t = 0; t < 60 && !ok; t++) {
            cx = 10 + r + Math.random() * Math.max(1, W - 20 - 2 * r);
            cy = 60 + r + Math.random() * Math.max(1, H - 150 - 2 * r);
            ok = placed.every(p => Math.hypot(p.x - cx, p.y - cy) > r + p.r + 12)
              && Math.hypot(cx - ux, cy - uy) > 90;
          }
          placed.push({ x: cx, y: cy, r });
          const el = document.createElement('div');
          el.className = 'item';
          el.style.width = el.style.height = size + 'px';
          el.style.left = (cx - r) + 'px'; el.style.top = (cy - r) + 'px';
          el.style.fontSize = Math.round(size * 0.62) + 'px';
          el.textContent = entry.w.emoji;
          scene.appendChild(el);
          items.push({ el, x: cx, y: cy, r, correct: entry.correct, letter: entry.letter, w: entry.w, cool: false });
        });

        setTimeout(() => RG.playLetter(target), 300);   // שם + צליל האות
      }

      function frame(t) {
        if (!running) return;
        if (!lastT) lastT = t;
        lastT = t;
        // הליכה חלקה לכיוון היעד
        ux += (tx - ux) * 0.16; uy += (ty - uy) * 0.16;
        const W = scene.clientWidth, H = scene.clientHeight;
        ux = Math.max(UR, Math.min(W - UR, ux)); uy = Math.max(UR + 40, Math.min(H - UR, uy));
        uni.style.left = (ux - 33) + 'px'; uni.style.top = (uy - 33) + 'px';

        for (const it of items) {
          if (it.got) continue;
          const d = Math.hypot(it.x - ux, it.y - uy);
          if (d < UR + it.r - 6) {
            if (it.correct) collect(it);
            else if (!it.cool) { it.cool = true; wrongAll++; RG.buzz(); it.el.classList.add('no');
              setTimeout(() => { it.el.classList.remove('no'); it.cool = false; }, 700); }
          }
        }
        raf = requestAnimationFrame(frame);
      }

      function collect(it) {
        it.got = true;
        it.el.classList.add('got');
        setTimeout(() => it.el.remove(), 450);
        RG.ding(); sparkle(it.x, it.y);
        RG.playWord(it.letter, it.w);
        gotThis++; collectedAll++;
        updateHud(gotThis, needed);
        if (gotThis >= needed) {
          screenIdx++;
          if (screenIdx >= screens.length) return win();
          setTimeout(setupScreen, 850);
        }
      }

      function sparkle(x, y) {
        const s = document.createElement('div'); s.className = 'spark'; s.textContent = '⭐';
        s.style.left = (x - 10) + 'px'; s.style.top = (y - 20) + 'px';
        scene.appendChild(s); setTimeout(() => s.remove(), 700);
      }

      function updateHud(got, need) {
        const name = (READING_LETTERS[target] || {}).name || '';
        document.getElementById('hud').innerHTML =
          `אספי דברים שמתחילים ב-<span class="big">${target}</span> <span class="nm">(${name})</span>
           <span class="sfx" id="sfx">🔊</span> <span class="sc">${got}/${need}</span>`;
        document.getElementById('sfx').onclick = () => RG.playLetter(target);
      }

      function win() {
        running = false;
        if (raf) cancelAnimationFrame(raf);
        items.forEach(it => it.el.remove()); items = [];
        RG.finish({ stationId: station.id, correct: collectedAll, total: collectedAll + wrongAll,
                    replay: () => location.reload() });
      }
    }
  </script>
</body>
</html>
