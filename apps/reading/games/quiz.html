<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>חדר הבריחה של האותיות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:'Heebo',system-ui,sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;
       background:radial-gradient(120% 80% at 50% 0%,#4a2c66,#2a1836 60%,#1b1026);}
  .room{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
        padding:10px 12px 16px;overflow:hidden;}

  /* התיבה + המנעולים */
  .top{display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2;}
  .chest{font-size:4.4rem;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));transition:transform .3s;}
  .chest.open{animation:chestPop .6s forwards;}
  @keyframes chestPop{40%{transform:scale(1.25) rotate(-6deg)}100%{transform:scale(1.1)}}
  .locks{display:flex;gap:8px;}
  .lock{font-size:1.8rem;transition:transform .25s,opacity .25s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));}
  .lock.current{animation:lockPulse 1s infinite;}
  .lock.done{opacity:.35;transform:scale(.85);}
  @keyframes lockPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px) scale(1.12)}}
  .hint{color:#e5d6ff;font-weight:800;font-size:1.05em;text-align:center;}

  /* קלף השאלה */
  .qcard{background:rgba(255,255,255,.96);color:#3a2a12;border-radius:24px;padding:14px 20px;text-align:center;
         box-shadow:0 12px 30px rgba(0,0,0,.45);cursor:pointer;min-width:180px;z-index:2;transition:transform .15s;}
  .qcard.flash{animation:cardFlash .4s;}
  @keyframes cardFlash{50%{transform:scale(1.06)}}
  .qcard .ptitle{font-weight:800;color:#7e57c2;font-size:1.02rem;}
  .qcard .emo{font-size:4rem;display:block;line-height:1;margin-top:2px;}
  .qcard .word{font-size:1.6rem;font-weight:800;color:#555;}
  .qcard .earbig{font-size:4rem;}
  .qcard .say{font-size:.85rem;color:#999;margin-top:2px;}

  /* רוּנוֹת (אותיות) */
  .runes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%;max-width:440px;z-index:2;}
  .rune{width:70px;height:70px;border-radius:18px;display:flex;align-items:center;justify-content:center;
        font-size:2.6rem;font-weight:800;color:#fff;cursor:pointer;
        background:linear-gradient(160deg,#b98cff,#7e57c2);
        box-shadow:0 6px 0 #5e35b1,0 0 16px rgba(180,140,255,.5);transition:transform .1s;}
  .rune:active{transform:translateY(5px);box-shadow:0 1px 0 #5e35b1;}
  .rune.correct{background:linear-gradient(160deg,#66bb6a,#43a047);box-shadow:0 6px 0 #2e7d32,0 0 24px #7bed9f;animation:cardFlash .4s;}
  .rune.wrong{background:linear-gradient(160deg,#ef5350,#c62828);box-shadow:0 6px 0 #8e0000;animation:shake .4s;}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .spark{position:absolute;z-index:5;font-size:1.7rem;pointer-events:none;animation:rise .8s forwards;}
  @keyframes rise{to{transform:translateY(-90px) scale(1.4);opacity:0}}
  .mascot{position:absolute;bottom:6px;left:8px;z-index:1;pointer-events:none;animation:cheer 1.2s ease-in-out infinite;}
  @keyframes cheer{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
</style>
</head>
<body>
  <div class="room" id="room">
    <div class="top">
      <div class="chest" id="chest">🎁</div>
      <div class="locks" id="locks"></div>
      <div class="hint" id="hint">פתחי את כל המנעולים כדי לפתוח את התיבה!</div>
    </div>
    <div class="qcard" id="qcard" onclick="replay()"></div>
    <div class="runes" id="runes"></div>
    <div class="mascot" id="mascot"></div>
  </div>

  <script src="../reading-data.js?v=14"></script>
  <script src="../reading-progress.js?v=14"></script>
  <script src="../reading-voices.js?v=14"></script>
  <script src="../reading-engine.js?v=14"></script>
  <script>
    RG.audioBase = '../../../letters/';
    const station = RG.currentStation();
    const room = document.getElementById('room');

    if (!station || station.type !== 'quiz') {
      room.innerHTML = '<p style="padding:20px">לא נמצאה תחנה. <a href="../journey.html">חזרה למפה</a></p>';
    } else {
      RG.mountTopBar('חדר הבריחה ' + (station.groupName || ''), { bg: false });
      document.getElementById('mascot').innerHTML = RG.unicorn(56);
      const letters = station.letters;
      const mixed = !!station.mixed;
      const LOCKS = 5;
      let solved = 0, wrong = 0, target = null, curWord = null, kind = null, locked = false, active = letters;

      renderLocks();
      nextLock();

      function renderLocks() {
        let h = '';
        for (let i = 0; i < LOCKS; i++) {
          const cls = i < solved ? 'done' : (i === solved ? 'current' : '');
          h += `<span class="lock ${cls}">${i < solved ? '🔓' : '🔒'}</span>`;
        }
        document.getElementById('locks').innerHTML = h;
      }

      function nextLock() {
        RG.stopAudio();
        locked = false;
        if (solved >= LOCKS) return escape();
        active = mixed ? RG.shuffle(letters).slice(0, 4) : letters;
        target = active[Math.floor(Math.random() * active.length)];
        kind = Math.random() < 0.5 ? 'hear' : 'word';
        curWord = pickWord(target);

        const qcard = document.getElementById('qcard');
        if (kind === 'hear') {
          qcard.innerHTML = `<div class="ptitle">איזו אות שמעת?</div>
                             <span class="earbig">🎧</span><div class="say">לחצי לשמוע שוב 🔊</div>`;
        } else {
          qcard.innerHTML = `<div class="ptitle">באיזה צליל מתחילה המילה?</div>
                             <span class="emo">${curWord.emoji}</span>
                             <span class="word">${curWord.word}</span>
                             <div class="say">לחצי לשמוע שוב 🔊</div>`;
        }
        const runes = document.getElementById('runes');
        runes.innerHTML = '';
        RG.shuffle(active).forEach(l => {
          const b = document.createElement('div');
          b.className = 'rune'; b.textContent = l;
          b.onclick = () => choose(l, b);
          runes.appendChild(b);
        });
        renderLocks();
        setTimeout(playPrompt, 400);
      }

      function playPrompt() { if (kind === 'hear') RG.playLetter(target); else RG.playWord(target, curWord); }
      window.replay = playPrompt;

      function choose(l, el) {
        if (locked) return;
        if (l === target) {
          locked = true;
          solved++;
          el.classList.add('correct');
          document.getElementById('qcard').classList.add('flash');
          RG.ding();
          burst(el);
          renderLocks();
          setTimeout(() => RG.playLetter(target), 220);
          setTimeout(nextLock, 950);
        } else {
          wrong++;
          el.classList.add('wrong');
          RG.buzz();
          setTimeout(() => el.classList.remove('wrong'), 420);
        }
      }

      function burst(el) {
        const a = room.getBoundingClientRect(), r = el.getBoundingClientRect();
        for (let i = 0; i < 4; i++) {
          const s = document.createElement('div');
          s.className = 'spark'; s.textContent = ['🔑', '✨', '⭐'][i % 3];
          s.style.left = (r.left - a.left + r.width / 2 - 12 + (Math.random() * 30 - 15)) + 'px';
          s.style.top = (r.top - a.top - 6) + 'px';
          s.style.animationDelay = (i * 0.05) + 's';
          room.appendChild(s);
          setTimeout(() => s.remove(), 850);
        }
      }

      function escape() {
        const chest = document.getElementById('chest');
        chest.textContent = '🎉'; chest.classList.add('open');
        document.getElementById('hint').textContent = 'פתחת את התיבה! 💎';
        RG.confetti(); RG.fanfare();
        setTimeout(() => {
          RG.finish({ stationId: station.id, correct: LOCKS, total: LOCKS + wrong,
                      replay: () => { solved = 0; wrong = 0; chest.textContent = '🎁';
                                      chest.classList.remove('open'); nextLock(); } });
        }, 900);
      }
    }
  </script>
</body>
</html>
