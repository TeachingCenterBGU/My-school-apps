<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>אתגר הסיכום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:'Heebo',system-ui,sans-serif;color:#fff;min-height:100vh;
       display:flex;flex-direction:column;
       background:radial-gradient(1px 1px at 20% 20%,#fff,transparent),
                  radial-gradient(1px 1px at 70% 30%,#fff,transparent),
                  radial-gradient(2px 2px at 40% 70%,#fff,transparent),
                  radial-gradient(1px 1px at 85% 60%,#fff,transparent),
                  linear-gradient(180deg,#1a1140,#3a1c6e 55%,#5b2a86);}
  .arena{position:relative;flex:1;width:100%;display:flex;flex-direction:column;
         align-items:center;justify-content:space-between;padding:12px 12px 18px;overflow:hidden;}

  /* מד הקסם */
  .meter{width:100%;max-width:420px;display:flex;align-items:center;gap:10px;z-index:2;padding:0 4px;}
  .meter .crystal{font-size:2.2rem;transition:transform .2s;}
  .meter .crystal.pulse{animation:cryPulse .4s;}
  @keyframes cryPulse{50%{transform:scale(1.4) rotate(8deg)}}
  .bar{flex:1;height:20px;background:rgba(255,255,255,.15);border-radius:20px;overflow:hidden;
       border:2px solid rgba(255,255,255,.3);}
  .bar>i{display:block;height:100%;width:0;border-radius:20px;transition:width .5s cubic-bezier(.2,.8,.2,1);
         background:linear-gradient(90deg,#ff8a5c,#ffd166,#43e0c0,#8f6ed5,#ff5ca8);}
  .combo{min-width:64px;text-align:center;font-weight:800;color:#ffd166;font-size:1.05rem;height:1.3em;}

  /* קלף השאלה */
  .qcard{background:rgba(255,255,255,.96);color:#3a2a12;border-radius:26px;padding:16px 22px;text-align:center;
         box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 0 4px rgba(255,255,255,.15);cursor:pointer;
         min-width:190px;z-index:2;position:relative;transition:transform .15s;}
  .qcard.flash{animation:cardFlash .4s;}
  @keyframes cardFlash{50%{transform:scale(1.06)}}
  .qcard .ptitle{font-weight:800;color:#7e57c2;font-size:1.05rem;}
  .qcard .emo{font-size:4.4rem;display:block;line-height:1;margin-top:4px;}
  .qcard .word{font-size:1.7rem;font-weight:800;color:#555;}
  .qcard .earbig{font-size:4.4rem;}
  .qcard .say{font-size:.9rem;color:#999;margin-top:2px;}

  /* רוּנוֹת (אותיות) */
  .runes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%;max-width:440px;z-index:2;}
  .rune{width:74px;height:74px;border-radius:18px;display:flex;align-items:center;justify-content:center;
        font-size:2.8rem;font-weight:800;color:#fff;cursor:pointer;
        background:linear-gradient(160deg,#7e57c2,#5e35b1);
        box-shadow:0 6px 0 #4527a0,0 0 18px rgba(155,120,255,.5);transition:transform .1s;}
  .rune:active{transform:translateY(5px);box-shadow:0 1px 0 #4527a0;}
  .rune.correct{background:linear-gradient(160deg,#66bb6a,#43a047);box-shadow:0 6px 0 #2e7d32,0 0 26px #7bed9f;animation:cardFlash .4s;}
  .rune.wrong{background:linear-gradient(160deg,#ef5350,#c62828);box-shadow:0 6px 0 #8e0000;animation:shake .4s;}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .spark{position:absolute;z-index:5;font-size:1.6rem;pointer-events:none;animation:rise .8s forwards;}
  @keyframes rise{to{transform:translateY(-120px) scale(1.5);opacity:0}}
  .mascot{position:absolute;bottom:6px;left:8px;z-index:1;pointer-events:none;
          animation:cheer 1.2s ease-in-out infinite;}
  @keyframes cheer{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
  .title-tag{position:absolute;top:8px;right:12px;font-weight:800;color:#ffd166;z-index:1;opacity:.9;}
</style>
</head>
<body>
  <div class="arena" id="arena">
    <div class="meter">
      <span class="crystal" id="crystal">🔮</span>
      <div class="bar"><i id="fill"></i></div>
      <span class="combo" id="combo"></span>
    </div>
    <div class="qcard" id="qcard" onclick="replay()"></div>
    <div class="runes" id="runes"></div>
    <div class="mascot" id="mascot"></div>
  </div>

  <script src="../reading-data.js?v=13"></script>
  <script src="../reading-progress.js?v=13"></script>
  <script src="../reading-voices.js?v=13"></script>
  <script src="../reading-engine.js?v=13"></script>
  <script>
    RG.audioBase = '../../../letters/';
    const station = RG.currentStation();
    const arena = document.getElementById('arena');

    if (!station || station.type !== 'quiz') {
      arena.innerHTML = '<p style="padding:20px">לא נמצאה תחנה. <a href="../journey.html">חזרה למפה</a></p>';
    } else {
      RG.mountTopBar('אתגר הסיכום ' + (station.groupName || ''), { bg: false });
      document.getElementById('mascot').innerHTML = RG.unicorn(58);
      const letters = station.letters;
      const mixed = !!station.mixed;                 // אתגר גדול: מגרילים אותיות בכל סיבוב
      const ROUNDS = 8;
      let correct = 0, wrong = 0, combo = 0, bestCombo = 0;
      let target = null, curWord = null, kind = null, locked = false, active = letters;

      newRound();

      function newRound() {
        RG.stopAudio();
        locked = false;
        if (correct >= ROUNDS) return win();
        active = mixed ? RG.shuffle(letters).slice(0, 4) : letters;
        target = active[Math.floor(Math.random() * active.length)];
        kind = Math.random() < 0.5 ? 'hear' : 'word';
        curWord = pickWord(target);

        const qcard = document.getElementById('qcard');
        if (kind === 'hear') {
          qcard.innerHTML = `<div class="ptitle">איזו אות שמעת?</div>
                             <span class="earbig">🎧</span>
                             <div class="say">לחצי לשמוע שוב 🔊</div>`;
        } else {
          qcard.innerHTML = `<div class="ptitle">באיזה צליל מתחילה המילה?</div>
                             <span class="emo">${curWord.emoji}</span>
                             <span class="word">${curWord.word}</span>
                             <div class="say">לחצי לשמוע שוב 🔊</div>`;
        }

        const runes = document.getElementById('runes');
        runes.innerHTML = '';
        RG.shuffle(active).forEach(l => {
          const b = document.createElement('div');
          b.className = 'rune';
          b.textContent = l;
          b.onclick = () => choose(l, b);
          runes.appendChild(b);
        });
        updateHud();
        setTimeout(playPrompt, 400);
      }

      function playPrompt() {
        if (kind === 'hear') RG.playLetter(target);
        else RG.playWord(target, curWord);
      }
      window.replay = playPrompt;

      function choose(l, el) {
        if (locked) return;
        if (l === target) {
          locked = true;
          correct++; combo++; bestCombo = Math.max(bestCombo, combo);
          el.classList.add('correct');
          document.getElementById('qcard').classList.add('flash');
          burst(el);
          fillMeter();
          if (combo >= 2) RG.ding();
          RG.ding();
          setTimeout(() => RG.playLetter(target), 220);
          setTimeout(newRound, 1050);
        } else {
          wrong++; combo = 0;
          el.classList.add('wrong');
          RG.buzz();
          updateHud();
          setTimeout(() => el.classList.remove('wrong'), 420);
        }
      }

      function fillMeter() {
        document.getElementById('fill').style.width = Math.round(correct / ROUNDS * 100) + '%';
        const c = document.getElementById('crystal');
        c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse');
        updateHud();
      }

      function updateHud() {
        document.getElementById('combo').textContent = combo >= 2 ? '🔥 x' + combo : '';
      }

      function burst(el) {
        const a = arena.getBoundingClientRect(), r = el.getBoundingClientRect();
        for (let i = 0; i < 5; i++) {
          const s = document.createElement('div');
          s.className = 'spark';
          s.textContent = ['⭐', '✨', '🌟'][i % 3];
          s.style.left = (r.left - a.left + r.width / 2 - 12 + (Math.random() * 40 - 20)) + 'px';
          s.style.top = (r.top - a.top - 6) + 'px';
          s.style.animationDelay = (i * 0.05) + 's';
          arena.appendChild(s);
          setTimeout(() => s.remove(), 850);
        }
      }

      function win() {
        RG.finish({ stationId: station.id, correct: ROUNDS, total: ROUNDS + wrong,
                    replay: () => location.reload() });
      }
    }
  </script>
</body>
</html>
