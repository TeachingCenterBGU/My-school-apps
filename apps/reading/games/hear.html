<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>איזו אות שמעת?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Heebo',system-ui,sans-serif;background:#ede7f6;color:#311b52;
       min-height:100vh;text-align:center;display:flex;flex-direction:column;align-items:center;}
  .stage{width:100%;max-width:460px;padding:16px;flex:1;display:flex;flex-direction:column;
         align-items:center;gap:16px;justify-content:center;}
  .prompt{font-size:1.35em;font-weight:800;color:#5e35b1;}
  .ear{width:120px;height:120px;border-radius:50%;background:#fff;border:5px solid #b39ddb;
       font-size:4rem;display:flex;align-items:center;justify-content:center;cursor:pointer;
       box-shadow:0 8px 20px rgba(94,53,177,.18);transition:transform .12s;}
  .ear:active{transform:scale(.92);}
  .ear.playing{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 8px 20px rgba(94,53,177,.18)}50%{box-shadow:0 8px 34px rgba(94,53,177,.45)}}
  .options{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;}
  .options.three{grid-template-columns:repeat(3,1fr);}
  .opt{background:#fff;border:4px solid #9575cd;border-radius:20px;font-size:3.4rem;font-weight:800;
       color:#4527a0;padding:18px 0;cursor:pointer;box-shadow:0 5px 0 #7e57c2;transition:transform .1s;}
  .opt:active{transform:translateY(4px);box-shadow:none;}
  .opt.correct{background:#c8e6c9;border-color:#4caf50;box-shadow:0 5px 0 #388e3c;color:#1b5e20;animation:bp .5s;}
  .opt.wrong{background:#ffcdd2;border-color:#ef5350;color:#b71c1c;animation:sh .4s;}
  @keyframes bp{40%{transform:translateY(-10px)}}
  @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .progress-dots{display:flex;gap:8px;justify-content:center;}
  .dot{width:12px;height:12px;border-radius:50%;background:#d1c4e9;}
  .dot.on{background:#7e57c2;}
  .hint{color:#9e9e9e;font-size:.95em;}
</style>
</head>
<body>
  <div class="stage" id="stage"></div>

  <script src="../reading-data.js"></script>
  <script src="../reading-progress.js"></script>
  <script src="../reading-engine.js"></script>
  <script>
    RG.audioBase = '../../../letters/';
    const station = RG.currentStation();
    const stage = document.getElementById('stage');

    if (!station || station.type !== 'hear') {
      stage.innerHTML = '<p>לא נמצאה תחנה. <a href="../journey.html">חזרה למפה</a></p>';
    } else {
      RG.mountTopBar('איזו אות שמעת?');
      const letters = station.letters;
      const ROUNDS = 6;
      let round = 0, correct = 0, target = null, locked = false;

      nextRound();

      function nextRound() {
        if (round >= ROUNDS) {
          RG.finish({ stationId: station.id, correct, total: ROUNDS, replay: restart });
          return;
        }
        locked = false;
        target = letters[Math.floor(Math.random() * letters.length)];
        const opts = RG.shuffle(letters);
        stage.innerHTML =
          `<div class="prompt">איזו אות שמעת?</div>
           <div class="ear" id="ear">👂</div>
           <div class="progress-dots">${dotsHTML()}</div>
           <div class="options ${opts.length === 3 ? 'three' : ''}" id="opts"></div>
           <div class="hint">לחצי על האוזן לשמוע שוב 🔊</div>`;
        document.getElementById('ear').onclick = playTarget;
        const grid = document.getElementById('opts');
        opts.forEach(l => {
          const b = document.createElement('div');
          b.className = 'opt'; b.textContent = l;
          b.onclick = () => choose(l, b);
          grid.appendChild(b);
        });
        setTimeout(playTarget, 450);
      }

      function playTarget() {
        const ear = document.getElementById('ear');
        if (ear) { ear.classList.add('playing'); setTimeout(() => ear.classList.remove('playing'), 900); }
        RG.playLetter(target);
      }

      function dotsHTML() {
        let h = '';
        for (let i = 0; i < ROUNDS; i++) h += `<span class="dot ${i < round ? 'on' : ''}"></span>`;
        return h;
      }

      function choose(l, el) {
        if (locked) return;
        if (l === target) {
          locked = true;
          el.classList.add('correct');
          correct++; round++;
          RG.ding(); RG.playLetter(target);
          setTimeout(nextRound, 950);
        } else {
          el.classList.add('wrong');
          RG.buzz();
          setTimeout(() => el.classList.remove('wrong'), 450);
        }
      }

      function restart() { round = 0; correct = 0; nextRound(); }
    }
  </script>
</body>
</html>
