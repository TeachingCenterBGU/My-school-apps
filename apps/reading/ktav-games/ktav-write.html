<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-W58S98V8J0"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
      gtag('js',new Date());gtag('config','G-W58S98V8J0');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>אות בכתב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:'Heebo',system-ui,sans-serif;color:#1b4a63;min-height:100vh;
       display:flex;flex-direction:column;background:linear-gradient(180deg,#eaf6ff,#dcecff);}
  .hud{text-align:center;font-weight:800;font-size:1.15em;color:#1565c0;padding:8px;background:rgba(255,255,255,.85);}
  .hud b{color:#0d47a1;font-size:1.15em;}
  .cover{max-width:300px;margin:7px auto 0;height:12px;background:#e3f2fd;border-radius:10px;overflow:hidden;border:2px solid #90caf9;}
  .cover>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#42a5f5,#1565c0);transition:width .15s;}

  .stage{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
         gap:10px;padding:10px;overflow:hidden;}
  .pad{position:relative;background:#fff;border-radius:24px;box-shadow:0 10px 24px rgba(0,0,0,.12);
       border:4px solid #90caf9;touch-action:none;}
  .pad canvas{position:absolute;inset:0;border-radius:20px;}
  .pad canvas.draw{cursor:crosshair;}
  .tools{display:flex;gap:10px;}
  .tools button{font-family:inherit;font-weight:800;border:none;border-radius:40px;padding:10px 18px;
       cursor:pointer;font-size:1.05em;background:#fff;color:#1565c0;box-shadow:0 4px 0 #90caf9;}
  .tools button:active{transform:translateY(3px);box-shadow:none;}
  .tools .go{background:#1565c0;color:#fff;box-shadow:0 4px 0 #0d47a1;}
  .mascot{position:absolute;bottom:4px;left:6px;z-index:3;pointer-events:none;animation:cheer 1.2s ease-in-out infinite;}
  @keyframes cheer{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
  .spark{position:absolute;z-index:5;font-size:1.8rem;pointer-events:none;animation:sp .7s forwards;}
  @keyframes sp{to{transform:translateY(-34px) scale(1.5);opacity:0}}
</style>
</head>
<body>
  <div class="hud" id="hud"></div>
  <div class="stage" id="stage">
    <div class="pad" id="pad">
      <canvas class="bg" id="bg"></canvas>
      <canvas class="draw" id="draw"></canvas>
    </div>
    <div class="tools">
      <button id="clear">🧹 נקה</button>
      <button class="go" id="hear">🔊 שמע</button>
    </div>
    <div class="mascot" id="mascot"></div>
  </div>

  <script src="../reading-data.js?v=16"></script>
  <script src="../reading-progress.js?v=16"></script>
  <script src="../reading-profile.js?v=16"></script>
  <script src="../reading-voices.js?v=18"></script>
  <script src="../reading-engine.js?v=16"></script>
  <script src="../ktav-data.js?v=18"></script>
  <script>
    RG.audioBase = '../../../letters/';
    const stage = document.getElementById('stage');
    const id = new URLSearchParams(location.search).get('station');
    const station = getKtavStationById(id);

    if (!station) {
      stage.innerHTML = '<p style="padding:20px">לא נמצאה תחנה. <a href="../ktav.html">חזרה למפה</a></p>';
    } else {
      const data = KTAV_LETTERS[station.char];
      const soundChar = ktavSoundChar(station.char);

      // סרגל עליון — בית חוזר למפת הכתב
      RG.mountTopBar('אות בכתב ✍️', { bg: false });
      const home = document.querySelector('.rg-topbar .rg-home');
      if (home) { home.setAttribute('href', '../ktav.html'); home.setAttribute('title', 'חזרה למפה'); }
      document.getElementById('mascot').innerHTML = RG.unicorn(56);

      const THRESH = 0.5;
      let locked = false;

      const side = Math.max(240, Math.min(window.innerWidth - 28, window.innerHeight - 250, 460));
      const pad = document.getElementById('pad');
      pad.style.width = pad.style.height = side + 'px';
      const bg = document.getElementById('bg'), draw = document.getElementById('draw');
      [bg, draw].forEach(c => { c.width = side; c.height = side; });
      const bgc = bg.getContext('2d'), dc = draw.getContext('2d');

      // אובייקטים לציור צורת האות
      const shape = document.createElement('canvas'); shape.width = shape.height = side;
      const sc = shape.getContext('2d');
      const tint = document.createElement('canvas'); tint.width = tint.height = side;
      const tc = tint.getContext('2d');
      let letterIdx = [], letterCount = 1;

      const img = new Image();

      function fitRect(image) {
        const pd = side * 0.12, maxW = side - pd * 2, maxH = side - pd * 2;
        const s = Math.min(maxW / image.width, maxH / image.height);
        const w = image.width * s, h = image.height * s;
        return { x: (side - w) / 2, y: (side - h) / 2, w, h };
      }

      function buildShape() {
        sc.clearRect(0, 0, side, side);
        const r = fitRect(img);
        sc.drawImage(img, r.x, r.y, r.w, r.h);
        const md = sc.getImageData(0, 0, side, side).data;
        letterIdx = [];
        for (let i = 0; i < md.length; i += 4) if (md[i + 3] > 40) letterIdx.push(i + 3);
        letterCount = Math.max(1, letterIdx.length);
      }

      // ציור צורת האות בגוון אחיד (רפאים / הדגשה)
      function drawGhost(color, alpha) {
        tc.clearRect(0, 0, side, side);
        tc.drawImage(shape, 0, 0);
        tc.globalCompositeOperation = 'source-in';
        tc.fillStyle = color; tc.fillRect(0, 0, side, side);
        tc.globalCompositeOperation = 'source-over';
        bgc.clearRect(0, 0, side, side);
        bgc.globalAlpha = alpha; bgc.drawImage(tint, 0, 0); bgc.globalAlpha = 1;
      }

      function setupLetter() {
        locked = false;
        dc.clearRect(0, 0, side, side);
        buildShape();
        drawGhost('#c3d9ef', 1);           // אות רפאים חיוורת לעקוב אחריה
        updateHud(0);
        setTimeout(() => RG.playLetter(soundChar), 350);
      }

      // ציור באצבע/עכבר
      let drawing = false, last = null;
      dc.lineWidth = Math.round(side * 0.1);
      dc.lineCap = dc.lineJoin = 'round';
      dc.strokeStyle = '#ff6d00';
      function pt(e) { const r = draw.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
      draw.addEventListener('pointerdown', e => {
        if (locked) return; drawing = true; last = pt(e);
        dc.beginPath(); dc.arc(last.x, last.y, dc.lineWidth / 2, 0, 7); dc.fillStyle = '#ff6d00'; dc.fill();
      });
      draw.addEventListener('pointermove', e => {
        if (!drawing || locked) return;
        const p = pt(e);
        dc.beginPath(); dc.moveTo(last.x, last.y); dc.lineTo(p.x, p.y); dc.stroke();
        last = p;
        if (throttle()) checkCoverage();
      });
      const end = () => { if (!drawing) return; drawing = false; checkCoverage(); };
      draw.addEventListener('pointerup', end);
      draw.addEventListener('pointerleave', end);

      let lastCheck = 0;
      function throttle() { const t = Date.now(); if (t - lastCheck > 180) { lastCheck = t; return true; } return false; }

      function checkCoverage() {
        const dd = dc.getImageData(0, 0, side, side).data;
        let covered = 0;
        for (const a of letterIdx) if (dd[a] > 20) covered++;
        const cov = covered / letterCount;
        updateHud(cov);
        if (cov >= THRESH && !locked) success();
      }

      function success() {
        locked = true;
        RG.ding(); sparkle();
        drawGhost('#ffb74d', 1);            // האות מודגשת בכתום
        setTimeout(finishKtav, 950);
      }

      function sparkle() {
        const s = document.createElement('div');
        s.className = 'spark'; s.textContent = '⭐';
        s.style.left = (side / 2 - 14) + 'px'; s.style.top = (side / 2 - 60) + 'px';
        pad.appendChild(s); setTimeout(() => s.remove(), 700);
      }

      function updateHud(cov) {
        document.getElementById('hud').innerHTML =
          `עקבי עם האצבע על האות <b>${data.name}</b>
           <span id="sfx" style="cursor:pointer">🔊</span>
           <div class="cover"><i style="width:${Math.min(100, Math.round(cov / THRESH * 100))}%"></i></div>`;
        document.getElementById('sfx').onclick = () => RG.playLetter(soundChar);
      }

      document.getElementById('clear').onclick = () => { if (!locked) { dc.clearRect(0, 0, side, side); updateHud(0); } };
      document.getElementById('hear').onclick = () => RG.playLetter(soundChar);

      // --- דיווח + מסך סיום (מותאם למסלול הכתב) ---
      function reportKtav() {
        try {
          const max = (window.KTAV_STATIONS || []).length * 3;
          if (!max) return;
          let got = 0; KTAV_STATIONS.forEach(s => got += ReadingProgress.starsOf(s.id));
          if (typeof window.saveAppScore === 'function') window.saveAppScore('reading-ktav', got, max);
          else {
            const p = JSON.parse(localStorage.getItem('pending_scores') || '[]');
            p.push({ appId: 'reading-ktav', score: got, total: max, timestamp: new Date().toISOString() });
            localStorage.setItem('pending_scores', JSON.stringify(p));
          }
        } catch (e) {}
      }

      function nextStationHref() {
        const i = KTAV_STATIONS.findIndex(s => s.id === station.id);
        const nx = KTAV_STATIONS[i + 1];
        return nx ? ('ktav-write.html?station=' + encodeURIComponent(nx.id)) : null;
      }

      function finishKtav() {
        RG.injectStyle();
        ReadingProgress.record(station.id, 3);
        reportKtav();
        RG.confetti(); RG.fanfare();
        const nx = nextStationHref();
        const overlay = document.createElement('div');
        overlay.className = 'rg-overlay';
        overlay.innerHTML =
          `<div class="rg-card">
             <div class="rg-mascot" style="display:flex;justify-content:center">${RG.unicorn(90)}</div>
             <div class="rg-stars"><span class="s on">⭐</span><span class="s on">⭐</span><span class="s on">⭐</span></div>
             <h2>כתבת יפה! ✍️</h2>
             <div class="rg-sub">האות ${data.name}</div>
             <div class="rg-btns">
               ${nx ? `<a class="rg-btn primary" href="${nx}">➡️ האות הבאה</a>` : ''}
               <button class="rg-btn ${nx ? 'ghost' : 'primary'}" id="k-again">🔁 עוד פעם</button>
               <a class="rg-btn ghost" href="../ktav.html">🗺️ חזרה למפה</a>
             </div>
           </div>`;
        document.body.appendChild(overlay);
        requestAnimationFrame(() => overlay.classList.add('show'));
        overlay.querySelector('#k-again').addEventListener('click', () => { overlay.remove(); setupLetter(); });
        RG.praise();
      }

      img.onload = setupLetter;
      img.onerror = () => { stage.innerHTML = '<p style="padding:20px">התמונה לא נטענה 😕</p>'; };
      img.src = '../ktav/' + data.img;
    }
  </script>
</body>
</html>
