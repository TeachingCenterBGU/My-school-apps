<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לומדים בכיף</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rubik', sans-serif; background-color: #f0f9ff; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .cloze-select { border: 2px solid #6366f1; color: #4338ca; padding: 4px 8px; border-radius: 6px; font-weight: bold; background: white; cursor: pointer; }
        .cloze-select.correct { background: #dcfce7; border-color: #22c55e; color: #15803d; pointer-events: none; }
        .cloze-select.wrong { background: #fee2e2; border-color: #ef4444; }

        .game-card { transition: all 0.2s; }
        .game-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }

        .match-card { cursor: pointer; transition: all 0.2s; user-select: none; }
        .match-card.selected { background-color: #fbbf24; border-color: #d97706; transform: scale(1.05); }
        .match-card.matched { background-color: #dcfce7; border-color: #22c55e; opacity: 0; pointer-events: none; transform: scale(0.9); transition: opacity 0.5s, transform 0.5s; }
        .match-card.error { animation: shake 0.5s; background-color: #fee2e2; border-color: #ef4444; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* תמיכה בכיווניות */
        [dir="ltr"] .text-right { text-align: left; }
        [dir="ltr"] .border-l-4 { border-left: 0; border-right: 4px solid; } 
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-3xl mb-6 flex justify-between items-center" dir="rtl">
        <button onclick="goHome()" class="bg-white text-gray-600 px-4 py-2 rounded-full shadow-sm hover:bg-gray-50 font-bold border">🏠 תפריט ראשי</button>
        <div id="exam-badge" class="hidden bg-red-100 text-red-700 px-4 py-2 rounded-full font-bold border border-red-200 text-sm animate-pulse">
            📅 המבחן בעוד <span id="days-left">0</span> ימים!
        </div>
    </header>

    <main id="app-container" class="w-full max-w-3xl bg-white rounded-3xl shadow-xl p-6 min-h-[500px] relative border-t-8 border-indigo-500">
        
        <div id="loading" class="text-center py-20 text-gray-500">
            <div class="text-4xl animate-bounce mb-4">⏳</div>
            טוען נתונים...
        </div>

        <div id="menu-view" class="hidden text-center fade-in">
            <h1 id="app-title" class="text-3xl font-bold text-gray-800 mb-2"></h1>
            <p id="app-subtitle" class="text-gray-500 mb-8 text-lg"></p>
            <div id="activities-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <div id="game-view" class="hidden fade-in">
            <button onclick="showMenu()" class="mb-4 text-indigo-600 font-bold flex items-center hover:underline" dir="rtl">⬅ חזרה לתפריט</button>
            <div id="game-content-wrapper">
                <div id="game-content"></div>
            </div>
            <div id="feedback-area" class="mt-6 text-center text-xl font-bold h-8"></div>
        </div>
    </main>

    <script>
        let appData = null;

        window.onload = async () => {
            const params = new URLSearchParams(window.location.search);
            const contentId = params.get('id'); 
            if (!contentId) { alert("חסר מזהה משחק"); return; }

            try {
                const response = await fetch(`../../data/${contentId}.json`);
                if (!response.ok) throw new Error("קובץ לא נמצא");
                appData = await response.json();
                initApp();
            } catch (error) {
                document.getElementById('loading').innerHTML = `<div class="text-red-500">שגיאה בטעינה: ${error.message}<br><small>אם את מריצה מקומית, ודאי שאת משתמשת ב-Live Server</small></div>`;
            }
        };

        function initApp() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('menu-view').classList.remove('hidden');
            
            document.getElementById('app-title').innerText = appData.title;
            document.getElementById('app-subtitle').innerText = appData.description || "";
            document.title = appData.title;

            // עדכון כיוון הטקסט הכללי של האפליקציה אם הוגדר
            const direction = appData.direction || 'rtl';
            document.getElementById('game-content-wrapper').dir = direction;

            if (appData.examDate) {
                const days = Math.ceil((new Date(appData.examDate) - new Date()) / (1000 * 60 * 60 * 24));
                if (days >= 0 && days <= 14) {
                    document.getElementById('exam-badge').classList.remove('hidden');
                    document.getElementById('days-left').innerText = days === 0 ? "היום" : days;
                }
            }

            const grid = document.getElementById('activities-grid');
            grid.innerHTML = appData.activities.map((act, index) => `
                <button onclick="loadActivity(${index})" class="game-card bg-indigo-50 border-2 border-indigo-100 p-6 rounded-2xl text-right hover:bg-indigo-100 hover:border-indigo-300" dir="rtl">
                    <div class="text-3xl mb-2">${act.icon || '🎮'}</div>
                    <div class="font-bold text-xl text-indigo-900">${act.name}</div>
                    <div class="text-sm text-gray-500">${getActivityTypeHebrew(act.type)}</div>
                </button>
            `).join('');
        }

        function getActivityTypeHebrew(type) {
            const types = { 'trivia': 'שאלות', 'cloze': 'השלמה', 'order': 'סדר', 'matching_pairs': 'התאמה', 'reading': 'קריאה' };
            return types[type] || 'פעילות';
        }

        function goHome() { window.location.href = '../../index.html'; }
        function showMenu() {
            document.getElementById('game-view').classList.add('hidden');
            document.getElementById('menu-view').classList.remove('hidden');
            document.getElementById('feedback-area').innerText = "";
        }

        function loadActivity(index) {
            const activity = appData.activities[index];
            const container = document.getElementById('game-content');
            document.getElementById('menu-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');
            document.getElementById('feedback-area').innerText = "";
            
            // כותרת הפעילות תמיד מיושרת לימין כדי שיהיה ברור שזה תפריט
            container.innerHTML = `<h2 class="text-2xl font-bold mb-4 text-indigo-700 border-b pb-2" dir="auto">${activity.name}</h2>`;

            if (activity.type === 'trivia') renderTrivia(activity, container);
            else if (activity.type === 'cloze') renderCloze(activity, container);
            else if (activity.type === 'order') renderOrder(activity, container);
            else if (activity.type === 'matching_pairs') renderMatching(activity, container);
            else if (activity.type === 'reading') renderReading(activity, container);
        }

        // --- רכיבי המשחק ---

        function renderMatching(data, container) {
            let pairs = data.pairs;
            let lefts = pairs.map((p, i) => ({ txt: p.left, id: i, side: 'L' })).sort(() => Math.random() - 0.5);
            let rights = pairs.map((p, i) => ({ txt: p.right, id: i, side: 'R' })).sort(() => Math.random() - 0.5);
            
            let selected = null;
            let matchesFound = 0;

            // הגריד יסתדר אוטומטית לפי ה-dir שהגדרנו ב-initApp
            container.innerHTML += `
                <div class="grid grid-cols-2 gap-8 mt-4">
                    <div class="space-y-3" id="col-left">${lefts.map(renderCard).join('')}</div>
                    <div class="space-y-3" id="col-right">${rights.map(renderCard).join('')}</div>
                </div>
            `;

            function renderCard(item) {
                return `<div id="${item.side}-${item.id}" onclick="cardClick('${item.side}', ${item.id})" 
                class="match-card bg-white border-2 border-indigo-200 p-4 rounded-xl text-center font-bold shadow-sm hover:bg-indigo-50">
                ${item.txt}</div>`;
            }

            window.cardClick = (side, id) => {
                const el = document.getElementById(`${side}-${id}`);
                if (el.classList.contains('matched')) return;

                if (selected && selected.side === side && selected.id === id) {
                    el.classList.remove('selected');
                    selected = null;
                    return;
                }

                if (!selected) {
                    selected = { side, id, el };
                    el.classList.add('selected');
                    return;
                }

                if (selected.side === side) {
                    selected.el.classList.remove('selected');
                    selected = { side, id, el };
                    el.classList.add('selected');
                    return;
                }

                if (selected.id === id) {
                    el.classList.remove('selected');
                    selected.el.classList.remove('selected');
                    el.classList.add('matched');
                    selected.el.classList.add('matched');
                    matchesFound++;
                    selected = null;
                    if (matchesFound === pairs.length) showWin(container, "כל הכבוד! סיימת את הכל!");
                } else {
                    el.classList.add('error');
                    selected.el.classList.add('error');
                    setTimeout(() => {
                        el.classList.remove('error', 'selected');
                        selected.el.classList.remove('error', 'selected');
                        selected = null;
                    }, 500);
                }
            };
        }

        function renderReading(data, container) {
            // הוספת הטקסט
            container.innerHTML += `
                <div class="bg-yellow-50 border-s-4 border-yellow-400 p-6 mb-8 rounded-e-lg shadow-sm text-lg leading-relaxed font-medium text-gray-800">
                    ${data.text}
                </div>
                <div id="reading-questions" class="space-y-8"></div>
            `;
            
            const qContainer = document.getElementById('reading-questions');
            let score = 0;
            let answered = 0;

            data.questions.forEach((q, idx) => {
                const qDiv = document.createElement('div');
                qDiv.innerHTML = `
                    <h3 class="font-bold text-lg mb-3 flex items-center gap-2">
                        <span class="bg-indigo-100 text-indigo-800 text-sm font-bold px-2 py-1 rounded-full">${idx+1}</span>
                        ${q.q}
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        ${q.opts.map((opt, i) => `
                            <button onclick="checkReading(this, ${idx}, ${i === q.a})" class="text-start p-3 border rounded-lg hover:bg-gray-50 transition q-btn-${idx}">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                    <div id="fb-${idx}" class="mt-2 text-sm font-bold min-h-[20px]"></div>
                `;
                qContainer.appendChild(qDiv);
            });

            window.checkReading = (btn, qIdx, isCorrect) => {
                const btns = document.querySelectorAll(`.q-btn-${qIdx}`);
                btns.forEach(b => b.disabled = true);
                const fb = document.getElementById(`fb-${qIdx}`);
                if (isCorrect) {
                    btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                    fb.innerText = "✅ נכון!";
                    fb.className = "mt-2 text-sm font-bold text-green-600";
                    score++;
                } else {
                    btn.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                    fb.innerText = "❌ טעות";
                    fb.className = "mt-2 text-sm font-bold text-red-500";
                }
                answered++;
                if (answered === data.questions.length) {
                    document.getElementById('feedback-area').innerHTML = `
                        <div class="text-2xl mt-4 text-indigo-800">ציון: ${score}/${data.questions.length}</div>
                        <button onclick="showMenu()" class="mt-4 bg-indigo-600 text-white px-6 py-2 rounded-full font-bold">סיום</button>
                    `;
                    if (score === data.questions.length) confetti();
                }
            };
        }

        function renderTrivia(data, container) {
            let currentQ = 0;
            let score = 0;
            
            function showQ() {
                if (currentQ >= data.questions.length) {
                    showWin(container, `ציון: ${score}/${data.questions.length}`);
                    return;
                }
                const q = data.questions[currentQ];
                let optsWithIndex = q.opts.map((opt, i) => ({txt: opt, idx: i}));
                optsWithIndex.sort(() => Math.random() - 0.5);

                container.innerHTML = `
                    <h2 class="text-2xl font-bold mb-4 text-indigo-700 border-b pb-2" dir="auto">${data.name}</h2>
                    <div class="mb-2 text-gray-400 text-sm">שאלה ${currentQ + 1} מתוך ${data.questions.length}</div>
                    <h3 class="text-xl font-bold mb-6 leading-relaxed">${q.q}</h3>
                    <div class="space-y-3">
                        ${optsWithIndex.map(o => `
                            <button onclick="checkTrivia(this, ${o.idx === q.a})" class="w-full text-start p-4 border-2 rounded-xl text-lg hover:bg-gray-50 transition">
                                ${o.txt}
                            </button>
                        `).join('')}
                    </div>
                `;
            }

            window.checkTrivia = (btn, isCorrect) => {
                if (isCorrect) {
                    btn.className = "w-full text-start p-4 border-2 rounded-xl text-lg bg-green-100 border-green-500 text-green-800 font-bold";
                    document.getElementById('feedback-area').innerText = "✅ יפה מאוד!";
                    document.getElementById('feedback-area').className = "mt-6 text-center text-xl font-bold h-8 text-green-600";
                    score++;
                    setTimeout(() => { 
                        currentQ++; 
                        document.getElementById('feedback-area').innerText = "";
                        showQ(); 
                    }, 1000);
                } else {
                    btn.className = "w-full text-start p-4 border-2 rounded-xl text-lg bg-red-100 border-red-500 text-red-800";
                    document.getElementById('feedback-area').innerText = "❌ נסי שוב";
                    document.getElementById('feedback-area').className = "mt-6 text-center text-xl font-bold h-8 text-red-500";
                }
            };
            showQ();
        }

        function renderCloze(data, container) {
            const textParts = data.text.split(/\{([^}]+)\}/g);
            let html = `<div class="bg-blue-50 p-6 rounded-xl text-lg leading-loose shadow-inner mb-6">`;
            
            let wordBank = data.bank || [];
            if(wordBank.length === 0) {
                 textParts.forEach((part, i) => { if (i % 2 !== 0) wordBank.push(part); });
                 wordBank.sort(() => Math.random() - 0.5);
            }
            let optionsHtml = `<option value="">?</option>` + wordBank.map(w => `<option value="${w}">${w}</option>`).join('');

            textParts.forEach((part, i) => {
                if (i % 2 === 0) html += part;
                else html += `<select class="cloze-select mx-1" data-answer="${part}">${optionsHtml}</select>`;
            });
            html += `</div><button onclick="checkCloze()" class="bg-indigo-600 text-white px-8 py-2 rounded-full font-bold shadow-lg hover:bg-indigo-700 w-full md:w-auto">בדיקה</button>`;
            
            container.innerHTML += html;

            window.checkCloze = () => {
                let allCorrect = true;
                document.querySelectorAll('.cloze-select').forEach(sel => {
                    if (sel.value === sel.dataset.answer) {
                        sel.classList.remove('wrong'); sel.classList.add('correct');
                    } else {
                        sel.classList.add('wrong'); allCorrect = false;
                    }
                });
                const fb = document.getElementById('feedback-area');
                if (allCorrect) { fb.innerText = "מעולה! 🎉"; fb.className = "mt-6 text-center text-xl font-bold h-8 text-green-600"; confetti(); } 
                else { fb.innerText = "יש טעויות..."; fb.className = "mt-6 text-center text-xl font-bold h-8 text-red-500"; }
            };
        }

        function renderOrder(data, container) {
            let items = [...data.items];
            items.sort(() => Math.random() - 0.5);
            let selection = [];

            container.innerHTML += `
                <div id="order-container" class="space-y-2">
                    ${items.map(item => `<div onclick="selectOrderItem(this, '${item}')" class="p-4 bg-white border-2 rounded-lg cursor-pointer hover:bg-gray-50 transition select-none">${item}</div>`).join('')}
                </div>
                <div class="mt-6 flex gap-2 justify-center">
                    <button onclick="loadActivity(${appData.activities.indexOf(data)})" class="bg-gray-200 px-4 py-2 rounded-full">איפוס</button>
                    <button onclick="checkOrder('${data.items.join('|')}')" class="bg-indigo-600 text-white px-6 py-2 rounded-full font-bold">בדיקה</button>
                </div>
            `;

            window.selectOrderItem = (el, txt) => {
                if (el.classList.contains('bg-indigo-500')) return;
                selection.push(txt);
                el.classList.remove('bg-white', 'hover:bg-gray-50');
                el.classList.add('bg-indigo-500', 'text-white', 'border-indigo-600');
            };

            window.checkOrder = (correctStr) => {
                const correctArr = correctStr.split('|');
                const fb = document.getElementById('feedback-area');
                if (selection.length !== correctArr.length) { fb.innerText = "חסר משפטים"; fb.className = "mt-6 text-center text-xl font-bold h-8 text-orange-500"; return; }
                let isCorrect = selection.every((val, index) => val === correctArr[index]);
                if (isCorrect) { fb.innerText = "סדר נכון! 🏆"; fb.className = "mt-6 text-center text-xl font-bold h-8 text-green-600"; confetti(); } 
                else { fb.innerText = "טעות בסדר"; fb.className = "mt-6 text-center text-xl font-bold h-8 text-red-500"; }
            };
        }

        function showWin(container, msg) {
            container.innerHTML = `<div class="text-center py-10"><div class="text-6xl mb-4">👑</div><h2 class="text-2xl font-bold text-indigo-800 mb-6">${msg}</h2><button onclick="showMenu()" class="bg-indigo-600 text-white px-8 py-3 rounded-full font-bold shadow-lg">לתפריט</button></div>`;
            confetti();
        }
    </script>
</body>
</html>
