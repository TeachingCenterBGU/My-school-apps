<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚔️ לוחמת המילים</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;800;900&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root {
  --hp-green: #44cc44;
  --hp-red: #ee4444;
  --gold: #ffd700;
  --dark: #1a1a2e;
  --darker: #0f0f23;
  --panel: rgba(20,20,50,0.92);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Rubik', sans-serif;
  background: var(--darker);
  color: white;
  min-height: 100vh;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* ===== SCREENS ===== */
.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }

/* ===== START SCREEN ===== */
#startScreen {
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #1a1a4e 0%, #2d1b69 40%, #4a1942 100%);
  text-align: center;
  padding: 20px;
  gap: 16px;
}
.game-logo {
  font-family: 'Secular One', sans-serif;
  font-size: 2.6em;
  background: linear-gradient(135deg, var(--gold), #ff9500, var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: none;
  filter: drop-shadow(0 3px 8px rgba(255,200,0,0.3));
}
.game-logo-sub {
  font-size: 1.1em;
  color: #b8b8e0;
  margin-bottom: 10px;
}
.hero-preview {
  font-size: 6em;
  animation: heroFloat 2s ease-in-out infinite;
}
@keyframes heroFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
.start-btn {
  background: linear-gradient(135deg, #ff6b35, #ff2e63);
  color: white;
  border: none;
  border-radius: 18px;
  padding: 18px 50px;
  font-family: 'Secular One', sans-serif;
  font-size: 1.4em;
  cursor: pointer;
  box-shadow: 0 6px 25px rgba(255,46,99,0.4);
  transition: all 0.3s;
  margin-top: 10px;
}
.start-btn:hover { transform: scale(1.05); }
.start-btn:active { transform: scale(0.97); }

/* ===== MAP SCREEN ===== */
#mapScreen {
  background: linear-gradient(180deg, #1a1a4e, #16213e);
  padding: 20px;
}
.map-title {
  font-family: 'Secular One', sans-serif;
  font-size: 1.6em;
  text-align: center;
  color: var(--gold);
  margin-bottom: 20px;
}
.map-stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.map-stat {
  background: var(--panel);
  border-radius: 12px;
  padding: 8px 16px;
  font-weight: 700;
  font-size: 1em;
}
.level-list {
  max-width: 500px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.level-card {
  background: var(--panel);
  border: 2px solid #333;
  border-radius: 18px;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.level-card:hover { border-color: var(--gold); transform: translateX(-4px); }
.level-card.locked { opacity: 0.45; pointer-events: none; }
.level-card.cleared { border-color: #44cc44; }
.level-card.cleared::after {
  content: '✅';
  position: absolute;
  left: 14px;
  top: 14px;
  font-size: 1.2em;
}
.level-emoji { font-size: 2.5em; }
.level-info { flex: 1; }
.level-name { font-weight: 800; font-size: 1.15em; margin-bottom: 2px; }
.level-desc { color: #aaa; font-size: 0.85em; }
.level-badge {
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 0.8em;
  color: #ccc;
}
.level-card.boss { border-color: #ff2e63; }
.level-card.boss .level-name { color: #ff6b6b; }

/* ===== BATTLE SCREEN ===== */
#battleScreen {
  background: linear-gradient(180deg, #1a0a2e 0%, #16213e 50%, #0a3d0a 100%);
  position: relative;
}
.battle-top {
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.battle-level-name {
  font-family: 'Secular One', sans-serif;
  font-size: 1em;
  color: var(--gold);
}
.battle-progress {
  font-size: 0.85em;
  color: #aaa;
}

/* Battle Arena */
.arena {
  flex: 1;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px 20px;
  min-height: 220px;
  position: relative;
}
.fighter {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  position: relative;
}
.fighter-sprite {
  font-size: 4.5em;
  transition: transform 0.3s;
  position: relative;
}
.fighter-sprite.attack-right {
  animation: attackRight 0.4s ease;
}
.fighter-sprite.attack-left {
  animation: attackLeft 0.4s ease;
}
.fighter-sprite.hurt {
  animation: hurt 0.4s ease;
}
.fighter-sprite.defeat {
  animation: defeat 0.6s ease forwards;
}
@keyframes attackRight {
  0% { transform: translateX(0); }
  40% { transform: translateX(-60px) scale(1.2); }
  100% { transform: translateX(0); }
}
@keyframes attackLeft {
  0% { transform: translateX(0); }
  40% { transform: translateX(60px) scale(1.2); }
  100% { transform: translateX(0); }
}
@keyframes hurt {
  0% { transform: translateX(0); filter: brightness(1); }
  20% { transform: translateX(10px); filter: brightness(2); }
  40% { transform: translateX(-10px); filter: brightness(0.5); }
  60% { transform: translateX(6px); }
  100% { transform: translateX(0); filter: brightness(1); }
}
@keyframes defeat {
  0% { transform: scale(1) rotate(0); opacity: 1; }
  50% { transform: scale(1.3) rotate(10deg); opacity: 0.7; }
  100% { transform: scale(0) rotate(40deg); opacity: 0; }
}

.fighter-name {
  font-weight: 700;
  font-size: 0.9em;
}
.hp-bar-container {
  width: 120px;
  height: 14px;
  background: #333;
  border-radius: 8px;
  overflow: hidden;
  border: 2px solid #555;
}
.hp-bar {
  height: 100%;
  background: var(--hp-green);
  border-radius: 6px;
  transition: width 0.5s ease, background 0.5s;
}
.hp-bar.low { background: var(--hp-red); }
.hp-text {
  font-size: 0.75em;
  color: #aaa;
}

/* Damage popup */
.damage-popup {
  position: absolute;
  font-weight: 900;
  font-size: 1.8em;
  pointer-events: none;
  animation: damageFloat 1s ease forwards;
  z-index: 50;
}
.damage-popup.hit { color: #ff4444; }
.damage-popup.heal { color: #44ff44; }
@keyframes damageFloat {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-60px) scale(1.4); }
}

/* VS flash */
.vs-flash {
  position: absolute;
  font-family: 'Secular One', sans-serif;
  font-size: 2em;
  color: var(--gold);
  opacity: 0;
  pointer-events: none;
}
.vs-flash.show {
  animation: vsFlash 1s ease forwards;
}
@keyframes vsFlash {
  0% { opacity: 0; transform: scale(3); }
  30% { opacity: 1; transform: scale(1); }
  70% { opacity: 1; }
  100% { opacity: 0; }
}

/* Question Panel */
.question-panel {
  background: var(--panel);
  backdrop-filter: blur(10px);
  border-top: 3px solid #444;
  padding: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.q-category {
  font-size: 0.8em;
  color: var(--gold);
  font-weight: 600;
}
.q-word {
  font-family: 'Secular One', sans-serif;
  font-size: 2.2em;
  color: #fff;
  text-shadow: 0 2px 10px rgba(255,200,0,0.2);
}
.q-prompt {
  color: #ccc;
  font-size: 0.95em;
}
.q-options {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 4px 0;
}
.q-btn {
  background: rgba(255,255,255,0.08);
  border: 2.5px solid rgba(255,255,255,0.2);
  color: white;
  border-radius: 14px;
  padding: 12px 28px;
  font-family: 'Rubik', sans-serif;
  font-size: 1.1em;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  min-width: 110px;
}
.q-btn:hover { border-color: var(--gold); background: rgba(255,215,0,0.1); }
.q-btn:active { transform: scale(0.95); }
.q-btn.correct-btn {
  border-color: #44ff44;
  background: rgba(68,255,68,0.2);
  color: #44ff44;
  animation: pop 0.3s ease;
}
.q-btn.wrong-btn {
  border-color: #ff4444;
  background: rgba(255,68,68,0.2);
  color: #ff4444;
}
@keyframes pop {
  50% { transform: scale(1.1); }
}

/* ===== VICTORY SCREEN ===== */
#victoryScreen {
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #0a2a0a 0%, #1a4a1a 50%, #0a3a0a 100%);
  text-align: center;
  padding: 30px;
  gap: 14px;
}
.victory-emoji { font-size: 5em; animation: heroFloat 1.5s ease-in-out infinite; }
.victory-title {
  font-family: 'Secular One', sans-serif;
  font-size: 2em;
  color: var(--gold);
}
.victory-subtitle { color: #aaa; font-size: 1.1em; }
.victory-stars { font-size: 2.5em; letter-spacing: 8px; margin: 8px 0; }
.loot-box {
  background: var(--panel);
  border-radius: 16px;
  padding: 16px 24px;
  display: flex;
  gap: 20px;
  justify-content: center;
}
.loot-item { text-align: center; }
.loot-val { font-size: 1.5em; font-weight: 800; color: var(--gold); }
.loot-label { font-size: 0.8em; color: #aaa; }
.victory-btn {
  background: linear-gradient(135deg, var(--gold), #ff9500);
  color: #1a1a2e;
  border: none;
  border-radius: 16px;
  padding: 14px 40px;
  font-family: 'Secular One', sans-serif;
  font-size: 1.2em;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 0 4px 20px rgba(255,200,0,0.3);
  transition: transform 0.2s;
}
.victory-btn:hover { transform: scale(1.05); }

/* ===== GAME OVER ===== */
#gameoverScreen {
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #2a0a0a 0%, #1a1a2e 100%);
  text-align: center;
  padding: 30px;
  gap: 16px;
}
.gameover-emoji { font-size: 5em; }
.gameover-title {
  font-family: 'Secular One', sans-serif;
  font-size: 2em;
  color: #ff6b6b;
}
.gameover-sub { color: #aaa; }

/* ===== RESPONSIVE ===== */
@media (max-width: 500px) {
  .game-logo { font-size: 2em; }
  .hero-preview { font-size: 4em; }
  .fighter-sprite { font-size: 3.5em; }
  .q-word { font-size: 1.8em; }
  .q-btn { padding: 10px 20px; font-size: 1em; min-width: 90px; }
  .hp-bar-container { width: 90px; }
  .arena { min-height: 180px; padding: 10px; }
  .level-card { padding: 14px; }
  .level-emoji { font-size: 2em; }
}
</style>
</head>

<!-- ===== START SCREEN ===== -->

// ==================== STATE ====================
let coins = 0;
let totalStars = 0;
let clearedLevels = new Set();
let currentLevel = null;
let currentLevelId = 0;
let battleQuestions = [];
let bqIndex = 0;
let battleScore = 0;
let currentMonsterIdx = 0;
let heroHp = 100;
let heroMaxHp = 100;
let monsterHp = 0;
let monsterMaxHp = 0;
let questionsPerMonster = 0;
let isAnswering = false;

// ==================== NAVIGATION ====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showMap() {
  renderMap();
  showScreen('mapScreen');
}

function renderMap() {
  document.getElementById('mapCoins').textContent = coins;
  document.getElementById('mapStars').textContent = totalStars;
  const list = document.getElementById('levelList');
  list.innerHTML = '';
  levels.forEach((lv, i) => {
    const unlocked = i === 0 || clearedLevels.has(i - 1);
    const cleared = clearedLevels.has(i);
    const card = document.createElement('div');
    card.className = `level-card ${lv.boss ? 'boss' : ''} ${!unlocked ? 'locked' : ''} ${cleared ? 'cleared' : ''}`;
    card.innerHTML = `
      <div class="level-emoji">${lv.emoji}</div>
      <div class="level-info">
        <div class="level-name">${lv.name}</div>
        <div class="level-desc">${lv.desc}</div>
      </div>
      ${!unlocked ? '<div class="level-badge">🔒 נעול</div>' : cleared ? '' : '<div class="level-badge">▶️ שחקו</div>'}
    `;
    if (unlocked) card.onclick = () => startBattle(i);
    list.appendChild(card);
  });
}

// ==================== BATTLE ====================
function startBattle(levelId) {
  currentLevelId = levelId;
  currentLevel = levels[levelId];
  battleQuestions = shuffle([...currentLevel.questions]);
  bqIndex = 0;
  battleScore = 0;
  currentMonsterIdx = 0;
  heroHp = heroMaxHp;
  isAnswering = false;

  questionsPerMonster = Math.ceil(battleQuestions.length / currentLevel.monsters.length);

  document.getElementById('battleLevelName').textContent = currentLevel.name;
  showScreen('battleScreen');

  spawnMonster();
}

function retryLevel() {
  startBattle(currentLevelId);
}

function spawnMonster() {
  const m = currentLevel.monsters[currentMonsterIdx];
  monsterHp = m.hp;
  monsterMaxHp = m.hp;
  document.getElementById('monsterSprite').textContent = m.emoji;
  document.getElementById('monsterSprite').className = 'fighter-sprite';
  document.getElementById('monsterName').textContent = m.name;
  updateHpBars();
  updateBattleProgress();

  // VS flash
  const vs = document.getElementById('vsFlash');
  vs.className = 'vs-flash show';
  setTimeout(() => vs.className = 'vs-flash', 1000);

  setTimeout(() => showQuestion(), 800);
}

function updateHpBars() {
  const heroPct = Math.max(0, (heroHp / heroMaxHp) * 100);
  const monPct = Math.max(0, (monsterHp / monsterMaxHp) * 100);
  const heroBar = document.getElementById('heroHpBar');
  const monBar = document.getElementById('monsterHpBar');
  heroBar.style.width = heroPct + '%';
  monBar.style.width = monPct + '%';
  heroBar.className = `hp-bar ${heroPct <= 30 ? 'low' : ''}`;
  monBar.className = `hp-bar ${monPct <= 30 ? 'low' : ''}`;
  document.getElementById('heroHpText').textContent = `${Math.max(0,heroHp)} / ${heroMaxHp}`;
  document.getElementById('monsterHpText').textContent = `${Math.max(0,monsterHp)} / ${monsterMaxHp}`;
}

function updateBattleProgress() {
  document.getElementById('battleProgress').textContent =
    `מפלצת ${currentMonsterIdx + 1} / ${currentLevel.monsters.length}`;
}

function showQuestion() {
  if (bqIndex >= battleQuestions.length) {
    // out of questions — monster auto-dies
    monsterHp = 0;
    monsterDefeated();
    return;
  }
  isAnswering = false;
  const q = battleQuestions[bqIndex];
  document.getElementById('qCategory').textContent = q.cat || currentLevel.desc;
  document.getElementById('qWord').textContent = q.word;
  document.getElementById('qPrompt').textContent = currentLevel.prompt;

  const optDiv = document.getElementById('qOptions');
  optDiv.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'q-btn';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(opt, q.answer, btn);
    optDiv.appendChild(btn);
  });
}

function handleAnswer(choice, correct, btnEl) {
  if (isAnswering) return;
  isAnswering = true;
  const allBtns = document.querySelectorAll('.q-btn');

  if (choice === correct) {
    // CORRECT — hero attacks monster
    btnEl.classList.add('correct-btn');
    battleScore++;
    const damage = currentLevel.boss ? 12 : Math.ceil(monsterMaxHp / questionsPerMonster) + 2;
    monsterHp -= damage;
    if (monsterHp < 0) monsterHp = 0;

    // Attack animation
    const heroSprite = document.getElementById('heroSprite');
    heroSprite.classList.add('attack-right');
    setTimeout(() => {
      heroSprite.classList.remove('attack-right');
      document.getElementById('monsterSprite').classList.add('hurt');
      showDamage('monsterFighter', `-${damage}`, 'hit');
      updateHpBars();
      setTimeout(() => {
        document.getElementById('monsterSprite').classList.remove('hurt');
        if (monsterHp <= 0) {
          monsterDefeated();
        } else {
          bqIndex++;
          showQuestion();
        }
      }, 500);
    }, 400);

  } else {
    // WRONG — monster attacks hero
    btnEl.classList.add('wrong-btn');
    allBtns.forEach(b => { if (b.textContent === correct) b.classList.add('correct-btn'); });
    const damage = currentLevel.boss ? 20 : 15;
    heroHp -= damage;
    if (heroHp < 0) heroHp = 0;

    setTimeout(() => {
      const monSprite = document.getElementById('monsterSprite');
      monSprite.classList.add('attack-left');
      setTimeout(() => {
        monSprite.classList.remove('attack-left');
        document.getElementById('heroSprite').classList.add('hurt');
        showDamage('heroFighter', `-${damage}`, 'hit');
        updateHpBars();
        setTimeout(() => {
          document.getElementById('heroSprite').classList.remove('hurt');
          if (heroHp <= 0) {
            showScreen('gameoverScreen');
          } else {
            bqIndex++;
            showQuestion();
          }
        }, 500);
      }, 400);
    }, 300);
  }
}

function showDamage(fighterId, text, type) {
  const el = document.getElementById(fighterId);
  const popup = document.createElement('div');
  popup.className = `damage-popup ${type}`;
  popup.textContent = text;
  popup.style.top = '20px';
  popup.style.right = '50%';
  popup.style.transform = 'translateX(50%)';
  el.style.position = 'relative';
  el.appendChild(popup);
  setTimeout(() => popup.remove(), 1000);
}

function monsterDefeated() {
  const monSprite = document.getElementById('monsterSprite');
  monSprite.classList.add('defeat');
  coins += currentLevel.boss ? 25 : 10;

  setTimeout(() => {
    currentMonsterIdx++;
    if (currentMonsterIdx >= currentLevel.monsters.length) {
      levelComplete();
    } else {
      spawnMonster();
    }
  }, 800);
}

function levelComplete() {
  const total = battleQuestions.length;
  const pct = battleScore / total;
  let stars = 0;
  if (pct >= 0.9) stars = 3;
  else if (pct >= 0.7) stars = 2;
  else if (pct >= 0.5) stars = 1;

  if (!clearedLevels.has(currentLevelId)) {
    totalStars += stars;
    clearedLevels.add(currentLevelId);
  }

  document.getElementById('victoryEmoji').textContent = currentLevel.boss ? '🐉' : '🎉';
  document.getElementById('victoryTitle').textContent = currentLevel.boss ? 'הדרקון הובס!' : 'ניצחון!';
  document.getElementById('victorySub').textContent = `סיימתם את ${currentLevel.name}`;
  document.getElementById('victoryStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  document.getElementById('lootCoins').textContent = currentLevel.boss ? 25 : 10;
  document.getElementById('lootScore').textContent = `${battleScore} / ${total}`;
  showScreen('victoryScreen');
}

// ==================== UTILS ====================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
