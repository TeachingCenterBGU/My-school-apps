<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חזרה למבחן בהנדסה - כיתה ה' (מורחב)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap');

        body {
            font-family: 'Rubik', sans-serif;
            background-color: #f0f8ff;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        h1 { color: #2c3e50; margin-bottom: 10px; }
        h2 { color: #555; font-size: 1.1em; }

        .visual-area {
            height: 220px;
            background: #fff;
            border: 2px solid #eef2f5;
            border-radius: 15px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            max-width: 90%;
            max-height: 90%;
            overflow: visible; /* מאפשר לטקסט לחרוג מעט אם צריך */
        }
        
        /* עיצוב טקסט בתוך ה-SVG */
        svg text {
            font-family: 'Rubik', sans-serif;
            font-weight: bold;
            text-anchor: middle; /* מרכז את הטקסט ביחס לנקודה */
            dominant-baseline: middle;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .option-btn {
            background: #e3f2fd;
            border: 2px solid #bbdefb;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.2s;
            color: #1565c0;
            font-weight: bold;
        }

        .option-btn:hover { background: #bbdefb; transform: translateY(-2px); }

        .option-btn.correct { background: #c8e6c9; border-color: #4caf50; color: #2e7d32; }
        .option-btn.wrong { background: #ffcdd2; border-color: #f44336; color: #c62828; }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
        }

        .next-btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            display: none;
            box-shadow: 0 4px 0 #e65100;
        }

        .next-btn:active { transform: translateY(4px); box-shadow: none; }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #eee;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #4caf50;
            width: 0%;
            transition: width 0.3s ease;
        }

        .hidden { display: none; }
        .grid-bg {
            background-image: linear-gradient(#e0e0e0 1px, transparent 1px), linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body>

<div class="container" id="start-screen">
    <h1>מבחן חזרה בהנדסה 📐</h1>
    <p>20 שאלות על משולשים, מרובעים, ישרים וזוויות.</p>
    <p>שימי לב לסימנים המיוחדים על הצלעות והזוויות!</p>
    <button class="next-btn" style="display:inline-block" onclick="startGame()">התחלי</button>
</div>

<div class="container hidden" id="quiz-screen">
    <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
    </div>
    <div id="question-container"></div>
    <div id="feedback" class="feedback"></div>
    <button id="next-btn" class="next-btn" onclick="nextQuestion()">לשאלה הבאה</button>
</div>

<div class="container hidden" id="end-screen">
    <h1>סיימת! 🎉</h1>
    <div style="font-size: 3em; color: #2196f3; margin: 20px 0;" id="final-score"></div>
    <p id="score-message"></p>
    <button class="next-btn" style="display:inline-block; background:#2196f3;" onclick="location.reload()">התחילי מחדש</button>
</div>

<script>
    const questions = [

        },
        {
            type: "calc",

            explanation: "במלבן, כל שתי צלעות שנוגעות אחת בשנייה יוצרות זווית של 90 מעלות (מאונכות)."
        },
        // --- חזרה לקלאסיקות עם שיפורים ---
        {
            type: "calc",
            text: "במשולש שווה שוקיים זווית הראש היא 100 מעלות. מה גודל זוויות הבסיס?",
            svg: `<svg viewBox="0 0 250 120">
                    <polygon points="20,100 230,100 125,20" fill="none" stroke="black" stroke-width="3"/>
                    <text x="125" y="50" font-size="16">100°</text>
                    <text x="40" y="90" font-size="16">?</text>
                    <text x="210" y="90" font-size="16">?</text>
                  </svg>`,
            options: ["40 מעלות כל אחת", "80 מעלות כל אחת", "100 מעלות כל אחת"],

        },
        {
            type: "visual",

                  </svg>`,

        },
        {
            type: "grid",

            explanation: "הישרים הכחולים חוצים זה את זה ויוצרים צורת 'פלוס' או 'איקס' בזווית ישרה. הירוקים מקבילים."
        },
        {
            type: "logic",
            text: "האם למשולש יכולות להיות שתי זוויות של 90 מעלות?",

        // --- עוד שאלות זיהוי ---

                    <text x="120" y="80" font-size="14">12 ס״מ</text>
                  </svg>`,
            options: ["שווה שוקיים", "שווה צלעות", "שונה צלעות"],
            correct: 2,
            explanation: "כל הצלעות באורכים שונים (8, 10, 12), לכן הוא משולש שונה צלעות."
        },
        {
            type: "logic",
            text: "איך נקראת הצלע שנמצאת מול הזווית של ה-90 מעלות במשולש ישר זווית?",
            svg: `<svg viewBox="0 0 200 120">
                     <polygon points="50,100 150,100 50,20" fill="none" stroke="black" stroke-width="2"/>
                     <rect x="50" y="80" width="20" height="20" fill="none" stroke="black"/>
                     <line x1="160" y1="60" x2="110" y2="60" stroke="red" marker-end="url(#arrow)" />
                     <text x="180" y="65" fill="red">?</text>
                  </svg>`,
            options: ["ניצב", "יתר", "גובה"],
            correct: 1,
            explanation: "הצלע הארוכה שמול הזווית הישרה נקראת 'יתר'."
        },
{
            type: "visual",
            text: "הביטי במחומש. כמה זוגות של קווים מקבילים מסומנים בשרטוט?",
            svg: `<svg viewBox="0 0 200 180">
                    <polygon points="50,160 150,160 150,90 100,30 50,90" fill="none" stroke="#ccc" stroke-width="2"/>
                    
                    <line x1="50" y1="160" x2="50" y2="90" stroke="blue" stroke-width="4"/>
                    
                    <line x1="150" y1="160" x2="150" y2="90" stroke="blue" stroke-width="4"/>

                    <text x="75" y="30" font-size="18" fill="purple">א</text>
                    <line x1="20" y1="130" x2="130" y2="130" stroke="black" stroke-width="3"/>

                    <line x1="170" y1="130" x2="280" y2="130" stroke="black" stroke-width="3"/>
                    <line x1="225" y1="130" x2="225" y2="50" stroke="black" stroke-width="3"/>

        {
            type: "grid",

            svg: `<svg viewBox="0 0 200 150" class="grid-bg">
                    <polygon points="40,120 160,120 40,40" fill="none" stroke="black" stroke-width="3"/>
                  </svg>`,
            options: ["הוא ישר זווית", "הוא קהה זווית", "הוא שווה צלעות"],
            correct: 0,
            explanation: "הצלעות יושבות בדיוק על קווי הרשת ונפגשות בפינה, לכן זו זווית ישרה."
        },
        {
            type: "calc",
            text: "שאלה אחרונה! משולש שווה צלעות. מה גודל כל זווית בו?",
            svg: `<svg viewBox="0 0 200 150">
                    <polygon points="50,130 150,130 100,43" fill="none" stroke="black" stroke-width="3"/>
                    <text x="100" y="90" font-size="20">?</text>
                  </svg>`,
            options: ["60 מעלות", "90 מעלות", "45 מעלות"],
            correct: 0,
            explanation: "במשולש שווה צלעות, כל הזוויות שוות. 180 לחלק ל-3 שווה 60."
        }
    ];

    let currentQuestion = 0;
    let score = 0;

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        const q = questions[currentQuestion];
        const container = document.getElementById('question-container');
        const progress = document.getElementById('progress');
        
        const percent = ((currentQuestion) / questions.length) * 100;
        progress.style.width = percent + '%';

        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        let html = `<h2>שאלה ${currentQuestion + 1} מתוך ${questions.length}</h2>`;
        
        if (q.svg) {
            html += `<div class="visual-area ${q.type === 'grid' ? 'grid-bg' : ''}">${q.svg}</div>`;
        }

        html += `<h3>${q.text}</h3>`;
        html += `<div class="options-grid">`;
        
        q.options.forEach((opt, index) => {
            html += `<div class="option-btn" onclick="checkAnswer(${index}, this)">${opt}</div>`;
        });
        
        html += `</div>`;
        
        container.innerHTML = html;
    }

    function checkAnswer(selectedIndex, btnElement) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.style.pointerEvents = 'none');

        const q = questions[currentQuestion];
        const feedbackEl = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');

        if (selectedIndex === q.correct) {
            btnElement.classList.add('correct');
            feedbackEl.innerHTML = "נכון מאוד! 🌟 " + q.explanation;
            feedbackEl.style.backgroundColor = "#e8f5e9";
            feedbackEl.style.color = "#2e7d32";
            score++;
        } else {
            btnElement.classList.add('wrong');
            buttons[q.correct].classList.add('correct'); 
            feedbackEl.innerHTML = "לא נורא. התשובה הנכונה היא: " + q.options[q.correct] + ".<br>" + q.explanation;
            feedbackEl.style.backgroundColor = "#ffebee";
            feedbackEl.style.color = "#c62828";
        }

        feedbackEl.style.display = 'block';
        nextBtn.style.display = 'inline-block';
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < questions.length) {
            renderQuestion();
        } else {
            endGame();
        }
    }

    function endGame() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        
        const finalScoreEl = document.getElementById('final-score');
        const messageEl = document.getElementById('score-message');
        
        finalScoreEl.textContent = `${score} / ${questions.length}`;
        
        if (score > 18) {
            messageEl.textContent = "וואו! אלופה אמיתית! את לגמרי מוכנה למבחן! 🏆";
        } else if (score > 15) {
            messageEl.textContent = "עבודה נהדרת! שליטה יפה מאוד בחומר. 💪";
        } else {
            messageEl.textContent = "כל הכבוד על ההתמדה! שווה לתרגל שוב את השאלות שטעית בהן. 📚";
        }
    }
</script>

</html>
