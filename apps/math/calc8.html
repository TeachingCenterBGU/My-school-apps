<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אלוף הכפל - כל המספרים</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
            border-top: 6px solid #4a90e2;
        }

        h1 { color: #2c3e50; margin-bottom: 0.5rem; }
        h2 { color: #34495e; font-size: 1.2rem; }

        /* מסך תפריט ראשי */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .menu-btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 20px;
            font-size: 1.5rem;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 0 #357abd;
        }

        .menu-btn:hover { background-color: #357abd; transform: translateY(-2px); }
        .menu-btn:active { transform: translateY(2px); box-shadow: none; }

        /* מסך משחק */
        .score-board {
            font-size: 1.1rem;
            color: #7f8c8d;
            margin-bottom: 1.5rem;
            background: #f5f5f5;
            padding: 5px 15px;
            border-radius: 15px;
            display: inline-block;
        }

        .question-box {
            font-size: 1.6rem;
            font-weight: bold;
            margin: 20px 0;
            color: #2c3e50;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        input[type="number"] {
            font-size: 1.5rem;
            padding: 10px;
            width: 100px;
            text-align: center;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            margin-bottom: 15px;
            outline: none;
        }
        
        input[type="number"]:focus { border-color: #4a90e2; }

        .action-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .action-btn:hover { background-color: #27ae60; }
        .secondary-btn { background-color: #e67e22; }
        .secondary-btn:hover { background-color: #d35400; }
        .home-btn { background-color: #95a5a6; margin-top: 20px; font-size: 1rem;}
        .home-btn:hover { background-color: #7f8c8d; }

        .message {
            margin-top: 15px;
            font-size: 1.3rem;
            height: 30px;
            font-weight: bold;
        }

        .correct { color: #27ae60; }
        .wrong { color: #c0392b; }
        .hidden { display: none; }

    </style>
</head>
<body>

<div class="container">
    
    <div id="menu-screen">
        <h1>מתרגלים את לוח הכפל 🧠</h1>
        <h2>בחר מספר כדי להתחיל מבחן:</h2>
        <div class="grid-menu">
            <button class="menu-btn" onclick="startTest(1)">1</button>
            <button class="menu-btn" onclick="startTest(2)">2</button>
            <button class="menu-btn" onclick="startTest(3)">3</button>
            <button class="menu-btn" onclick="startTest(4)">4</button>
            <button class="menu-btn" onclick="startTest(5)">5</button>
            <button class="menu-btn" onclick="startTest(6)">6</button>
            <button class="menu-btn" onclick="startTest(7)">7</button>
            <button class="menu-btn" onclick="startTest(8)">8</button>
            <button class="menu-btn" onclick="startTest(9)">9</button>
            <button class="menu-btn" onclick="startTest(10)">10</button>
        </div>
    </div>

    <div id="game-screen" class="hidden">
        <h1 id="game-title">כפולות של X</h1>
        <div class="score-board">
            שאלה <span id="current-q-num">0</span> מתוך <span id="total-q-num">30</span>
        </div>

        <div class="question-box" id="question-text"></div>
        <input type="number" id="answer-input" placeholder="?" autocomplete="off">
        <br>
        <button onclick="checkAnswer()" id="check-btn" class="action-btn">בדיקה</button>
        <div class="message" id="feedback-msg"></div>
        <button onclick="nextQuestion()" id="next-btn" class="action-btn secondary-btn hidden">השאלה הבאה</button>
        
        <br>
        <button onclick="showMenu()" class="action-btn home-btn">חזרה לתפריט</button>
    </div>

    <div id="end-screen" class="hidden">
        <h2>כל הכבוד! סיימת את המבחן! 🎉</h2>
        <p>אתה שולט בכפולות של <span id="finished-number"></span>!</p>
        <button onclick="showMenu()" class="action-btn">בחר מספר אחר</button>
        <button onclick="restartSameTest()" class="action-btn secondary-btn">התחל שוב</button>
    </div>

</div>

<script>
    let questions = [];
    let remainingQuestions = [];
    let currentQuestion = null;
    let questionCounter = 0;
    let currentBaseNum = 0;

    // תבניות לשאלות מילוליות כדי שיתאימו לכל מספר
    function generateWordProblems(base, type) {
        // type 'mult' = שאלות כפל
        // type 'div' = שאלות חילוק/השלמה
        
        // בוחרים מספרים רנדומליים לכפל (בין 2 ל-9) כדי לגוון
        const rand = () => Math.floor(Math.random() * 8) + 2; 

        if (type === 'mult') {
            const m1 = rand(); const m2 = rand(); const m3 = rand(); const m4 = rand(); const m5 = rand();
            return [
                { text: `חבילת מדבקות עולה ${base} שקלים. כמה יעלו ${m1} חבילות?`, answer: base * m1 },
                { text: `בכל קופסה יש ${base} כדורים. דני קנה ${m2} קופסאות. כמה כדורים יש לו?`, answer: base * m2 },
                { text: `רוני קוראת ${base} עמודים ביום. כמה עמודים תקרא ב-${m3} ימים?`, answer: base * m3 },
                { text: `בכל בניין יש ${base} קומות. בשכונה נבנו ${m4} בניינים כאלה. כמה קומות סה"כ?`, answer: base * m4 },
                { text: `לכל עוגה צריך ${base} ביצים. כמה ביצים צריך ל-${m5} עוגות?`, answer: base * m5 }
            ];
        } else { // div
            // כאן צריך שהתוצאה תהיה המכפלה, והתשובה היא הגורם החסר
            const d1 = rand(); const d2 = rand(); const d3 = rand(); const d4 = rand(); const d5 = rand();
            return [
                { text: `חילקתי ${base * d1} סוכריות שווה בשווה ל-${base} ילדים. כמה סוכריות קיבל כל ילד?`, answer: d1 },
                { text: `ספר עולה ${base} שקלים. שילמתי סך הכל ${base * d2} שקלים. כמה ספרים קניתי?`, answer: d2 },
                { text: `יש לי ${base * d3} תמונות ואני מדביק ${base} בכל עמוד באלבום. כמה עמודים אצטרך?`, answer: d3 },
                { text: `צריך לצעוד סה"כ ${base * d4} קילומטרים. אם הולכים ${base} ק"מ ביום, כמה ימים זה ייקח?`, answer: d4 },
                { text: `בכיתה יש ${base * d5} תלמידים והמורה סידרה אותם בשורות של ${base}. כמה שורות יש?`, answer: d5 }
            ];
        }
    }

    function generateQuestionsForNumber(num) {
        const qList = [];
        
        // 1. עשר שאלות כפולות פשוטות (1-10)
        for (let i = 1; i <= 10; i++) {
            qList.push({
                text: `${num} × ${i} = ?`,
                answer: num * i
            });
        }

        // 2. עשר שאלות השלמה (1-10)
        for (let i = 1; i <= 10; i++) {
            const product = i * num;
            qList.push({
                text: `${num} × _ = ${product}`,
                answer: i
            });
        }

        // 3. הוספת שאלות מילוליות דינמיות
        const multProblems = generateWordProblems(num, 'mult');
        const divProblems = generateWordProblems(num, 'div');

        return qList.concat(multProblems, divProblems);
    }

    function showMenu() {
        document.getElementById('menu-screen').classList.remove('hidden');
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
    }

    function startTest(num) {
        currentBaseNum = num;
        document.getElementById('game-title').innerText = "מתרגלים כפולות של " + num;
        
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        
        restartSameTest();
    }

    function restartSameTest() {
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        questions = generateQuestionsForNumber(currentBaseNum);
        remainingQuestions = [...questions]; 
        questionCounter = 0;
        
        document.getElementById('total-q-num').innerText = questions.length;
        document.getElementById('finished-number').innerText = currentBaseNum;
        
        nextQuestion();
    }

    function nextQuestion() {
        document.getElementById('feedback-msg').innerText = '';
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('check-btn').classList.remove('hidden');
        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').focus();

        if (remainingQuestions.length === 0) {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            return;
        }

        const randomIndex = Math.floor(Math.random() * remainingQuestions.length);
        currentQuestion = remainingQuestions[randomIndex];
        remainingQuestions.splice(randomIndex, 1);

        questionCounter++;
        document.getElementById('current-q-num').innerText = questionCounter;
        document.getElementById('question-text').innerText = currentQuestion.text;
    }

    function checkAnswer() {
        const input = document.getElementById('answer-input');
        const userAnswer = parseInt(input.value);
        const feedback = document.getElementById('feedback-msg');

        if (isNaN(userAnswer)) {
            feedback.innerText = "נא לכתוב מספר";
            feedback.className = "message wrong";
            return;
        }

        if (userAnswer === currentQuestion.answer) {
            feedback.innerText = "מעולה! נכון מאוד! 🌟";
            feedback.className = "message correct";
            document.getElementById('check-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
            document.getElementById('next-btn').focus();
        } else {
            feedback.innerText = "לא בדיוק. נסה שוב 💪";
            feedback.className = "message wrong";
            input.value = '';
            input.focus();
        }
    }

    document.getElementById('answer-input').addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            if (!document.getElementById('check-btn').classList.contains('hidden')) {
                checkAnswer();
            } else {
                nextQuestion();
            }
        }
    });

</script>

</body>
</html>
