<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧙‍♂️ קוסם הכפל - חוק הפילוג</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --magic-purple: #6c3fc5;
            --magic-pink: #e84393;
            --magic-gold: #fdcb6e;
            --magic-green: #00b894;
            --bg-dark: #1a1030;
            --bg-card: #2d1f5e;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(2px 2px at 20% 30%, #fff, transparent),
                radial-gradient(2px 2px at 40% 70%, #fff, transparent),
                radial-gradient(1px 1px at 60% 20%, #fff, transparent),
                radial-gradient(2px 2px at 80% 50%, #fff, transparent),
                radial-gradient(1px 1px at 10% 80%, #fff, transparent),
                radial-gradient(1px 1px at 70% 90%, #fff, transparent),
                radial-gradient(2px 2px at 50% 10%, #fff, transparent),
                radial-gradient(1px 1px at 90% 40%, #fff, transparent);
            pointer-events: none;
            animation: twinkle 4s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes twinkle { 0% { opacity: 0.5; } 100% { opacity: 1; } }

        .container { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; padding: 20px; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Rubik', sans-serif;
            background: rgba(255,255,255,0.05);
            color: #b8a9d4;
            transition: all 0.3s;
            text-decoration: none;
        }

        .back-btn:hover { border-color: var(--magic-gold); color: var(--magic-gold); background: rgba(253,203,110,0.1); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

        .header { text-align: center; padding: 15px 0; }

        .header h1 {
            font-size: 2.2rem; font-weight: 900;
            background: linear-gradient(135deg, var(--magic-gold), var(--magic-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .header .subtitle { font-size: 1rem; color: #b8a9d4; }

        .score-bar {
            display: flex; justify-content: space-around;
            background: var(--bg-card); border-radius: 16px; padding: 12px;
            margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1);
        }

        .score-item { text-align: center; }
        .score-item .label { font-size: 0.75rem; color: #b8a9d4; }
        .score-item .value { font-size: 1.5rem; font-weight: 900; color: var(--magic-gold); }
        .stars-display { display: flex; gap: 8px; justify-content: center; }
        .star { font-size: 1.5rem; opacity: 0.2; transition: all 0.5s; }
        .star.earned { opacity: 1; animation: popStar 0.5s ease; }

        @keyframes popStar { 0% { transform: scale(0); } 50% { transform: scale(1.5); } 100% { transform: scale(1); } }

        .game-card {
            background: var(--bg-card); border-radius: 24px; padding: 30px;
            border: 2px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); margin-bottom: 20px;
        }

        .problem-display { text-align: center; margin-bottom: 20px; }

        .problem-text { font-size: 2.5rem; font-weight: 900; color: #fff; direction: ltr; display: inline-block; }
        .problem-text .highlight { color: var(--magic-gold); }

        .visual-area { display: flex; justify-content: center; gap: 12px; margin: 15px 0; flex-wrap: wrap; }

        .group-box {
            background: rgba(255,255,255,0.05); border-radius: 16px; padding: 10px;
            border: 2px dashed rgba(255,255,255,0.15); min-width: 60px; text-align: center; transition: all 0.3s;
        }
        .group-box.active { border-color: var(--magic-gold); background: rgba(253,203,110,0.1); }
        .group-box.done { border-color: var(--magic-green); background: rgba(0,184,148,0.1); }
        .group-label { font-size: 0.8rem; color: #b8a9d4; margin-bottom: 6px; }
        .dot-row { display: flex; gap: 3px; justify-content: center; margin-bottom: 2px; }
        .dot { border-radius: 50%; display: inline-block; }

        .scroll-selector-row { display: flex; align-items: flex-end; justify-content: center; gap: 6px; flex-wrap: wrap; direction: ltr; }

        .scroll-selector { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .scroll-selector label { font-size: 0.7rem; color: #b8a9d4; }

        .scroll-selector select {
            font-size: 1.2rem; font-weight: 700; font-family: 'Rubik', sans-serif;
            padding: 8px 6px; border-radius: 12px;
            border: 3px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1);
            color: #fff; outline: none; cursor: pointer; text-align: center;
            min-width: 75px; appearance: none; -webkit-appearance: none; transition: border-color 0.3s;
        }

        .scroll-selector select:focus { border-color: var(--magic-gold); }
        .scroll-selector select option { background: #2d1f5e; color: #fff; }

        .plus-sign { font-size: 1.4rem; font-weight: 900; color: var(--magic-gold); padding-bottom: 10px; }
        .equals-sign { font-size: 1.4rem; font-weight: 900; color: #fff; padding-bottom: 10px; }
        .sum-display { font-size: 1.4rem; font-weight: 900; color: var(--magic-pink); padding-bottom: 10px; min-width: 40px; text-align: center; }

        .steps-area { margin-top: 20px; }

        .step {
            background: rgba(255,255,255,0.05); border-radius: 16px; padding: 18px;
            margin-bottom: 12px; border-right: 4px solid var(--magic-purple); transition: all 0.3s;
        }
        .step.current { border-right-color: var(--magic-gold); background: rgba(253,203,110,0.08); }
        .step.completed { border-right-color: var(--magic-green); background: rgba(0,184,148,0.06); }

        .step-header { font-size: 0.9rem; font-weight: 700; color: var(--magic-gold); margin-bottom: 12px; }

        .input-row { display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap; }

        .input-row input, .mult-input {
            width: 90px; font-size: 1.4rem; font-weight: 700; text-align: center; padding: 8px;
            border-radius: 12px; border: 3px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1); color: #fff; font-family: 'Rubik', sans-serif;
            outline: none; transition: border-color 0.3s;
        }
        .input-row input:focus, .mult-input:focus { border-color: var(--magic-gold); }

        .check-btn {
            padding: 10px 24px; font-size: 1.1rem; font-weight: 700; border: none;
            border-radius: 12px; cursor: pointer; font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, var(--magic-purple), var(--magic-pink));
            color: #fff; transition: transform 0.2s, box-shadow 0.2s;
        }
        .check-btn:hover { transform: scale(1.05); box-shadow: 0 5px 20px rgba(108,63,197,0.5); }
        .check-btn:active { transform: scale(0.98); }

        .feedback {
            text-align: center; padding: 12px; border-radius: 12px;
            margin-top: 12px; font-weight: 700; font-size: 1.1rem; display: none;
        }
        .feedback.correct { display: block; background: rgba(0,184,148,0.2); color: var(--magic-green); animation: popIn 0.4s ease; }
        .feedback.wrong { display: block; background: rgba(232,67,147,0.2); color: var(--magic-pink); animation: shake 0.4s ease; }

        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        .screen { text-align: center; padding: 30px 20px; }
        .screen .emoji-big { font-size: 5rem; margin-bottom: 15px; animation: float 3s ease-in-out infinite; }

        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .screen h2 {
            font-size: 1.8rem; font-weight: 900; margin-bottom: 10px;
            background: linear-gradient(135deg, var(--magic-gold), var(--magic-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .screen p { color: #b8a9d4; font-size: 1rem; margin-bottom: 20px; line-height: 1.8; }

        .big-btn {
            padding: 16px 50px; font-size: 1.3rem; font-weight: 700; border: none;
            border-radius: 50px; cursor: pointer; font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, var(--magic-gold), #f39c12);
            color: var(--bg-dark); transition: transform 0.2s;
            box-shadow: 0 8px 30px rgba(253,203,110,0.3);
        }
        .big-btn:hover { transform: scale(1.05); }

        .explanation {
            background: rgba(108,63,197,0.2); border-radius: 16px; padding: 18px;
            margin: 15px 0; border: 1px solid rgba(108,63,197,0.3);
            line-height: 1.8; font-size: 0.95rem; direction: ltr; text-align: center;
        }
        .explanation strong { color: var(--magic-gold); }

        .level-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px; }

        .level-btn {
            padding: 14px 24px; font-size: 1rem; font-weight: 700;
            border: 2px solid rgba(255,255,255,0.2); border-radius: 14px;
            cursor: pointer; font-family: 'Rubik', sans-serif;
            background: transparent; color: #fff; transition: all 0.3s;
        }
        .level-btn:hover { border-color: var(--magic-gold); background: rgba(253,203,110,0.1); }
        .level-btn .level-emoji { display: block; font-size: 1.5rem; margin-bottom: 4px; }
        .level-btn .level-desc { font-size: 0.75rem; color: #b8a9d4; margin-top: 4px; }

        .next-btn {
            margin-top: 15px; padding: 12px 36px; font-size: 1.1rem; font-weight: 700;
            border: none; border-radius: 14px; cursor: pointer; font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, var(--magic-green), #00cec9); color: #fff; display: none;
        }
        .next-btn.show { display: inline-block; }

        .confetti-piece {
            position: fixed; z-index: 999; pointer-events: none;
            animation: confettiFall 2s ease-out forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .mult-line {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-bottom: 10px; font-size: 1.2rem; font-weight: 600; direction: ltr;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <button class="back-btn" id="backBtn" onclick="goBack()">→ חזרה</button>
            <div></div>
        </div>

        <div class="header">
            <h1>🧙‍♂️ קוסם הכפל</h1>
            <div class="subtitle">חוק הפילוג — פרקי את הכפל לחתיכות!</div>
        </div>

        <div class="score-bar" id="scoreBar" style="display:none;">
            <div class="score-item">
                <div class="label">ניקוד</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="label">שאלה</div>
                <div class="value"><span id="qNum">1</span>/8</div>
            </div>
            <div class="score-item">
                <div class="stars-display" id="starsDisplay">
                    <span class="star">⭐</span><span class="star">⭐</span><span class="star">⭐</span>
                </div>
            </div>
        </div>

        <div class="game-card" id="gameArea"></div>
    </div>

    <script>
        let state = {
            screen: 'welcome', // welcome | game
            level: 0, questionIndex: 0, score: 0,
            totalQuestions: 8, questions: [],
            firstTryCorrect: 0, _attempts: 0,
            _userParts: null, _multResults: null
        };

        const COLORS = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c'];

        function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function goBack() {
            if (state.screen === 'game') {
                showWelcome();
            } else {
                window.location.href = '../../index.html';
            }
        }

        function makeQuestion(level) {
            let a, b, parts;
            if (level === 1) {
                a = rand(2, 9);
                const tens = rand(1, 9) * 10;
                const ones = rand(1, 9);
                b = tens + ones; parts = [tens, ones];
            } else if (level === 2) {
                a = rand(2, 9);
                const h = rand(1, 9) * 100, t = rand(1, 9) * 10, o = rand(1, 9);
                b = h + t + o; parts = [h, t, o];
            } else {
                a = rand(2, 6);
                const th = rand(1, 5) * 1000, h = rand(1, 9) * 100, t = rand(1, 9) * 10, o = rand(1, 9);
                b = th + h + t + o; parts = [th, h, t, o];
            }
            return { a, b, parts };
        }

        function generateQuestions(level) {
            const qs = [];
            for (let i = 0; i < state.totalQuestions; i++) qs.push(makeQuestion(level));
            return qs;
        }

        function getPlaceLabel(pv) {
            if (pv === 1000) return 'אלפים';
            if (pv === 100) return 'מאות';
            if (pv === 10) return 'עשרות';
            return 'יחידות';
        }

        function buildOptions(pv, max) {
            let o = '<option value="0">—</option>';
            for (let i = 1; i <= max; i++) o += `<option value="${i * pv}">${i * pv}</option>`;
            return o;
        }

        function updateSplitSum() {
            let sum = 0;
            document.querySelectorAll('.split-select').forEach(s => sum += parseInt(s.value) || 0);
            const el = document.getElementById('splitSum');
            if (el) el.textContent = sum || '?';
        }

        function showWelcome() {
            state.screen = 'welcome';
            document.getElementById('scoreBar').style.display = 'none';
            document.getElementById('backBtn').textContent = '→ חזרה';
            document.getElementById('gameArea').innerHTML = `
                <div class="screen">
                    <div class="emoji-big">🧙‍♂️</div>
                    <h2>ברוכה הבאה לקוסם הכפל!</h2>
                    <p>
                        הקסם שלנו הוא <strong style="color:#fdcb6e;">חוק הפילוג</strong>!<br>
                        כשצריך לכפול מספר גדול — אפשר לפרק אותו<br>
                        לחתיכות קטנות, לכפול כל חתיכה, ואז לחבר! ✨
                    </p>
                    <div class="explanation">
                        <strong>:דוגמה</strong> 4 × 13 = ?<br>
                        13 = 10 + 3<br>
                        4 × 10 = 40<br>
                        4 × 3 = 12<br>
                        40 + 12 = <strong>52</strong> 🎉
                    </div>
                    <p>בחרי רמת קושי:</p>
                    <div class="level-btns">
                        <button class="level-btn" onclick="startGame(1)">
                            <span class="level-emoji">🌟</span>
                            דו-ספרתי
                            <div class="level-desc">כמו 3 × 47</div>
                        </button>
                        <button class="level-btn" onclick="startGame(2)">
                            <span class="level-emoji">⚡</span>
                            תלת-ספרתי
                            <div class="level-desc">כמו 5 × 346</div>
                        </button>
                        <button class="level-btn" onclick="startGame(3)">
                            <span class="level-emoji">🔥</span>
                            ארבע-ספרתי
                            <div class="level-desc">כמו 4 × 2753</div>
                        </button>
                    </div>
                </div>
            `;
        }

        function startGame(level) {
            state.screen = 'game';
            state.level = level;
            state.questionIndex = 0;
            state.score = 0;
            state.firstTryCorrect = 0;
            state.questions = generateQuestions(level);
            document.getElementById('scoreBar').style.display = 'flex';
            document.getElementById('backBtn').textContent = '→ בחירת רמה';
            updateScoreBar();
            showQuestion();
        }

        function showQuestion() {
            const q = state.questions[state.questionIndex];
            state._attempts = 0;
            state._userParts = null;
            state._multResults = null;
            updateScoreBar();

            let placeValues;
            if (state.level === 1) placeValues = [10, 1];
            else if (state.level === 2) placeValues = [100, 10, 1];
            else placeValues = [1000, 100, 10, 1];

            let selectorsHTML = '';
            placeValues.forEach((pv, i) => {
                if (i > 0) selectorsHTML += `<span class="plus-sign">+</span>`;
                selectorsHTML += `
                    <div class="scroll-selector">
                        <label>${getPlaceLabel(pv)}</label>
                        <select class="split-select" id="split${i}" onchange="updateSplitSum()">
                            ${buildOptions(pv, 9)}
                        </select>
                    </div>`;
            });

            // Visual dots only for level 1
            let visualHTML = '';
            if (state.level === 1) {
                for (let p = 0; p < q.parts.length; p++) {
                    const color = COLORS[p];
                    const dotSize = Math.min(16, Math.max(8, 100 / q.parts[p]));
                    let dots = '';
                    for (let r = 0; r < q.a; r++) {
                        let row = '';
                        for (let c = 0; c < q.parts[p]; c++)
                            row += `<span class="dot" style="background:${color};width:${dotSize}px;height:${dotSize}px;"></span>`;
                        dots += `<div class="dot-row">${row}</div>`;
                    }
                    visualHTML += `<div class="group-box" id="group${p}"><div class="group-label">${q.a} × ${q.parts[p]}</div>${dots}</div>`;
                }
                visualHTML = `<div class="visual-area">${visualHTML}</div>`;
            }

            document.getElementById('gameArea').innerHTML = `
                <div class="problem-display">
                    <div class="problem-text"><span class="highlight">${q.a}</span> × <span class="highlight">${q.b.toLocaleString()}</span> = ?</div>
                </div>
                ${visualHTML}
                <div class="steps-area">
                    <div class="step current" id="step0">
                        <div class="step-header">🔮 שלב 1: פרקי את ${q.b.toLocaleString()}</div>
                        <div class="scroll-selector-row">
                            ${selectorsHTML}
                            <span class="equals-sign">=</span>
                            <span class="sum-display" id="splitSum">?</span>
                        </div>
                        <div style="text-align:center; margin-top:14px;">
                            <button class="check-btn" onclick="checkSplit()">בדקי ✨</button>
                        </div>
                        <div class="feedback" id="fb0"></div>
                    </div>
                    <div class="step" id="step1" style="display:none;"></div>
                    <div class="step" id="step2" style="display:none;"></div>
                    <div class="step" id="step3" style="display:none;"></div>
                </div>
                <div style="text-align:center;">
                    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">לשאלה הבאה ←</button>
                </div>
            `;
        }

        function checkSplit() {
            const q = state.questions[state.questionIndex];
            const vals = Array.from(document.querySelectorAll('.split-select')).map(s => parseInt(s.value) || 0);
            const fb = document.getElementById('fb0');
            const sum = vals.reduce((a, b) => a + b, 0);

            if (sum === q.b && vals.every(v => v > 0)) {
                state._userParts = vals;
                fb.className = 'feedback correct';
                fb.textContent = '🎉 מעולה! פירקת נכון!';
                document.getElementById('step0').className = 'step completed';
                showMultiplyStep();
            } else {
                state._attempts++;
                fb.className = 'feedback wrong';
                fb.textContent = vals.some(v => v === 0)
                    ? '🤔 צריך לבחור ערך בכל תיבה!'
                    : `🤔 הסכום הוא ${sum.toLocaleString()}, אבל צריך ${q.b.toLocaleString()}`;
            }
        }

        function showMultiplyStep() {
            const q = state.questions[state.questionIndex];
            const parts = state._userParts;
            const step1 = document.getElementById('step1');
            step1.style.display = 'block';

            let html = '<div class="step-header">⚡ שלב 2: כפלי כל חלק</div>';
            for (let i = 0; i < parts.length; i++) {
                html += `<div class="mult-line">${q.a} × ${parts[i].toLocaleString()} = <input class="mult-input" id="mult${i}" type="number"></div>`;
            }
            html += `<div style="text-align:center;"><button class="check-btn" onclick="checkMultiply()">בדקי ✨</button></div><div class="feedback" id="fb1"></div>`;

            step1.innerHTML = html;
            step1.className = 'step current';

            if (state.level === 1) {
                for (let i = 0; i < parts.length; i++) {
                    const g = document.getElementById('group' + i);
                    if (g) g.className = 'group-box active';
                }
            }
            document.getElementById('mult0').focus();
        }

        function checkMultiply() {
            const q = state.questions[state.questionIndex];
            const parts = state._userParts;
            const fb = document.getElementById('fb1');
            let allCorrect = true;
            const results = [];

            for (let i = 0; i < parts.length; i++) {
                const v = parseInt(document.getElementById(`mult${i}`).value) || 0;
                results.push(v);
                if (v !== q.a * parts[i]) allCorrect = false;
            }

            if (allCorrect) {
                fb.className = 'feedback correct';
                fb.textContent = '🌟 נכון מאוד!';
                document.getElementById('step1').className = 'step completed';
                state._multResults = results;
                showSumStep();
            } else {
                state._attempts++;
                fb.className = 'feedback wrong';
                let hint = '';
                for (let i = 0; i < parts.length; i++) {
                    if (results[i] !== q.a * parts[i]) { hint = ` בדקי שוב: ${q.a} × ${parts[i].toLocaleString()}`; break; }
                }
                fb.textContent = `🤔${hint || ' בדקי שוב...'}`;
            }
        }

        function showSumStep() {
            const q = state.questions[state.questionIndex];
            const results = state._multResults;
            const step2 = document.getElementById('step2');
            step2.style.display = 'block';

            const sumExpr = results.map(r => r.toLocaleString()).join(' + ');
            step2.innerHTML = `
                <div class="step-header">🎯 שלב 3: חברי הכל!</div>
                <div class="mult-line">${sumExpr} = <input class="mult-input" id="finalAns" type="number" style="width:100px;"></div>
                <div style="text-align:center;"><button class="check-btn" onclick="checkFinal()">בדקי ✨</button></div>
                <div class="feedback" id="fb2"></div>
            `;
            step2.className = 'step current';
            document.getElementById('finalAns').focus();
        }

        function checkFinal() {
            const q = state.questions[state.questionIndex];
            const ans = parseInt(document.getElementById('finalAns').value) || 0;
            const correct = q.a * q.b;
            const fb = document.getElementById('fb2');

            if (ans === correct) {
                fb.className = 'feedback correct';
                fb.textContent = '🌟 נכון!';
                document.getElementById('step2').className = 'step completed';

                if (state.level === 1) {
                    const parts = state._userParts;
                    for (let i = 0; i < parts.length; i++) {
                        const g = document.getElementById('group' + i);
                        if (g) g.className = 'group-box done';
                    }
                }
                showFullEquationStep();
            } else {
                state._attempts++;
                fb.className = 'feedback wrong';
                fb.textContent = '🤔 לא בדיוק... נסי לחבר שוב!';
            }
        }

        function showFullEquationStep() {
            const q = state.questions[state.questionIndex];
            const step3 = document.getElementById('step3');
            step3.style.display = 'block';

            step3.innerHTML = `
                <div class="step-header">✏️ שלב 4: כתבי את התרגיל המלא!</div>
                <div class="mult-line">
                    <input class="mult-input" id="eqA" type="number" style="width:70px;">
                    <span style="font-size:1.4rem; font-weight:900;">×</span>
                    <input class="mult-input" id="eqB" type="number" style="width:100px;">
                    <span style="font-size:1.4rem; font-weight:900;">=</span>
                    <input class="mult-input" id="eqResult" type="number" style="width:110px;">
                </div>
                <div style="text-align:center;"><button class="check-btn" onclick="checkFullEquation()">בדקי ✨</button></div>
                <div class="feedback" id="fb3"></div>
            `;
            step3.className = 'step current';
            document.getElementById('eqA').focus();
        }

        function checkFullEquation() {
            const q = state.questions[state.questionIndex];
            const a = parseInt(document.getElementById('eqA').value) || 0;
            const b = parseInt(document.getElementById('eqB').value) || 0;
            const r = parseInt(document.getElementById('eqResult').value) || 0;
            const correct = q.a * q.b;
            const fb = document.getElementById('fb3');

            if (a === q.a && b === q.b && r === correct) {
                fb.className = 'feedback correct';
                fb.innerHTML = `🎉 מושלם! ${q.a} × ${q.b.toLocaleString()} = ${correct.toLocaleString()}`;
                document.getElementById('step3').className = 'step completed';

                const points = state._attempts <= 0 ? 15 : state._attempts <= 2 ? 10 : 5;
                state.score += points;
                if (state._attempts <= 0) state.firstTryCorrect++;
                updateScoreBar();

                document.getElementById('nextBtn').className = 'next-btn show';
            } else {
                state._attempts++;
                fb.className = 'feedback wrong';
                if (a !== q.a || b !== q.b) {
                    fb.textContent = '🤔 בדקי שוב את המספרים של התרגיל...';
                } else {
                    fb.textContent = '🤔 המספרים נכונים, בדקי את התוצאה!';
                }
            }
        }

        function nextQuestion() {
            state.questionIndex++;
            if (state.questionIndex >= state.totalQuestions) showComplete();
            else showQuestion();
        }

        function showComplete() {
            document.getElementById('scoreBar').style.display = 'none';
            document.getElementById('backBtn').textContent = '→ חזרה';
            state.screen = 'welcome';
            const pct = state.firstTryCorrect / state.totalQuestions;
            const stars = pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : 1;
            const msg = stars === 3 ? 'את קוסמת אמיתית! 🧙‍♀️✨' : stars === 2 ? 'עבודה יפה מאוד! 💪' : 'כל הכבוד שהתאמנת! 🌟';
            spawnConfetti();

            document.getElementById('gameArea').innerHTML = `
                <div class="screen">
                    <div class="emoji-big">🏆</div>
                    <h2>${msg}</h2>
                    <p>
                        ניקוד: <strong style="color:#fdcb6e;">${state.score}</strong><br>
                        נכון מהנסיון הראשון: ${state.firstTryCorrect} מתוך ${state.totalQuestions}<br>
                        <span style="font-size:2rem;">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</span>
                    </p>
                    <button class="big-btn" onclick="showWelcome()">שחקי שוב! 🔄</button>
                </div>
            `;
        }

        function updateScoreBar() {
            document.getElementById('score').textContent = state.score;
            document.getElementById('qNum').textContent = state.questionIndex + 1;
            const stars = document.querySelectorAll('#starsDisplay .star');
            [2, 5, 7].forEach((n, i) => {
                if (state.firstTryCorrect >= n) stars[i].classList.add('earned');
                else stars[i].classList.remove('earned');
            });
        }

        function spawnConfetti() {
            const colors = ['#fdcb6e','#e84393','#00b894','#0984e3','#6c5ce7','#e74c3c'];
            for (let i = 0; i < 50; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                el.style.left = Math.random()*100+'vw'; el.style.top = '-10px';
                el.style.width = (Math.random()*10+6)+'px'; el.style.height = (Math.random()*10+6)+'px';
                el.style.background = colors[Math.floor(Math.random()*colors.length)];
                el.style.borderRadius = Math.random()>0.5?'50%':'2px';
                el.style.animationDelay = Math.random()*1.5+'s';
                el.style.animationDuration = (Math.random()*1.5+1.5)+'s';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 3500);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const el = document.activeElement;
                if (el && (el.tagName === 'INPUT' || el.tagName === 'SELECT')) {
                    const step = el.closest('.step');
                    if (step) { const btn = step.querySelector('.check-btn'); if (btn) btn.click(); }
                }
            }
        });

        showWelcome();
    </script>
</body>
</html>
