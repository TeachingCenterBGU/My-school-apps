<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מגיני הגלקסיה - אימון ממוקד</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas { display: block; }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            direction: ltr;
            text-align: left;
        }

        #input-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
        }

        input[type="number"] {
            font-size: 2rem;
            padding: 10px 20px;
            width: 150px;
            text-align: center;
            border: 3px solid #4a90e2;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border-radius: 50px;
            outline: none;
            box-shadow: 0 0 20px rgba(74, 144, 226, 0.5);
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 100;
        }

        h1 { font-size: 3rem; color: #4a90e2; margin-bottom: 10px; text-shadow: 0 0 20px #4a90e2; }
        p { font-size: 1.2rem; margin-bottom: 20px; color: #ccc; }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
            transition: transform 0.2s;
            margin-top: 20px;
        }
        .start-btn:hover { transform: scale(1.1); }
        
        /* עיצוב בחירת הכפולות */
        .multipliers-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
        }

        .mult-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #4a90e2;
            background: transparent;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mult-btn.active {
            background: #4a90e2;
            color: white;
            box-shadow: 0 0 10px #4a90e2;
        }

        .mult-btn:hover {
            border-color: #fff;
        }

        .error-msg {
            color: #e74c3c;
            height: 20px;
            font-weight: bold;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="hud">
        ❤️ <span id="livesVal">3</span><br>
        🏆 <span id="scoreVal">0</span>
    </div>

    <div id="startScreen" class="overlay">
        <h1>🚀 מגיני הגלקסיה</h1>
        <p>בחר את הכפולות שברצונך לתרגל:</p>
        
        <div class="multipliers-grid" id="buttonsContainer">
            </div>
        <div id="selectionError" class="error-msg"></div>

        <p style="margin-top: 20px; font-size: 1rem;">הקלד תשובה ולחץ ENTER לירי</p>
        <button class="start-btn" onclick="startGame()">התחל משחק</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1>המשחק נגמר!</h1>
        <p>ניקוד סופי: <span id="finalScore">0</span></p>
        <button class="start-btn" onclick="showStartScreen()">תפריט ראשי</button>
    </div>

    <div id="input-container">
        <input type="number" id="answerInput" placeholder="?" autocomplete="off">
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const input = document.getElementById('answerInput');
    const scoreVal = document.getElementById('scoreVal');
    const livesVal = document.getElementById('livesVal');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScore = document.getElementById('finalScore');
    const buttonsContainer = document.getElementById('buttonsContainer');
    const selectionError = document.getElementById('selectionError');

    let gameActive = false;
    let score = 0;
    let lives = 3;
    let meteors = [];
    let particles = [];
    let difficultySpeed = 1;
    
    // ניהול בחירת כפולות
    let selectedMultipliers = [2, 3, 4, 5, 6, 7, 8, 9];

    // יצירת הכפתורים במסך הפתיחה
    function initButtons() {
        buttonsContainer.innerHTML = '';
        for (let i = 2; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            btn.className = 'mult-btn active'; // פעיל כברירת מחדל
            btn.onclick = () => toggleMultiplier(i, btn);
            buttonsContainer.appendChild(btn);
        }
    }

    function toggleMultiplier(num, btnElement) {
        const index = selectedMultipliers.indexOf(num);
        if (index > -1) {
            selectedMultipliers.splice(index, 1);
            btnElement.classList.remove('active');
        } else {
            selectedMultipliers.push(num);
            btnElement.classList.add('active');
        }
        selectionError.innerText = '';
    }

    initButtons();

    class Meteor {
        constructor() {
            this.radius = 40;
            this.x = Math.random() * (canvas.width - 100) + 50;
            this.y = -50;
            
            // מהירות איטית (כמו שביקשת)
            this.speed = (Math.random() * 0.4 + 0.3) * difficultySpeed;
            
            // בחירת תרגיל על בסיס המספרים שנבחרו
            // n1 יהיה אחד מהמספרים שנבחרו
            this.n1 = selectedMultipliers[Math.floor(Math.random() * selectedMultipliers.length)];
            // n2 יהיה מספר אקראי בין 2 ל-9 (או כל מספר שתרצה לתרגל מולו)
            this.n2 = Math.floor(Math.random() * 9) + 2; 

            // לפעמים נהפוך את הסדר (למשל 7*3 במקום 3*7) לגיוון
            if (Math.random() > 0.5) {
                let temp = this.n1;
                this.n1 = this.n2;
                this.n2 = temp;
            }

            this.answer = this.n1 * this.n2;
            this.text = `${this.n1} × ${this.n2}`;
            
            this.color = `hsl(${Math.random() * 360}, 70%, 50%)`;
        }

        update() {
            this.y += this.speed;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 30px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.text, this.x, this.y);
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.vx = (Math.random() - 0.5) * 10;
            this.vy = (Math.random() - 0.5) * 10;
            this.life = 1.0;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= 0.02;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    function startGame() {
        if (selectedMultipliers.length === 0) {
            selectionError.innerText = "יש לבחור לפחות מספר אחד!";
            return;
        }

        score = 0;
        lives = 3;
        meteors = [];
        particles = [];
        difficultySpeed = 1;
        gameActive = true;
        
        scoreVal.innerText = score;
        livesVal.innerText = lives;
        
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        input.value = '';
        input.focus();
        
        requestAnimationFrame(gameLoop);
    }

    function showStartScreen() {
        gameOverScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
    }

    function gameOver() {
        gameActive = false;
        finalScore.innerText = score;
        gameOverScreen.classList.remove('hidden');
    }

    function gameLoop(timestamp) {
        if (!gameActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // כדור אחד כל פעם
        if (meteors.length === 0) {
            meteors.push(new Meteor());
        }

        for (let i = meteors.length - 1; i >= 0; i--) {
            let m = meteors[i];
            m.update();
            m.draw();

            if (m.y - m.radius > canvas.height) {
                lives--;
                livesVal.innerText = lives;
                meteors.splice(i, 1);
                
                canvas.style.transform = 'translate(5px, 5px)';
                setTimeout(()=> canvas.style.transform = 'none', 50);

                if (lives <= 0) gameOver();
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        }

        requestAnimationFrame(gameLoop);
    }

    function checkAnswer() {
        const val = parseInt(input.value);
        if (isNaN(val)) return;

        let hitIndex = -1;
        
        meteors.forEach((m, index) => {
            if (m.answer === val) {
                hitIndex = index;
            }
        });

        if (hitIndex !== -1) {
            const m = meteors[hitIndex];
            for(let k=0; k<20; k++) particles.push(new Particle(m.x, m.y, m.color));
            
            meteors.splice(hitIndex, 1);
            score += 10;
            scoreVal.innerText = score;
            
            if (score % 100 === 0) difficultySpeed += 0.1;
            
            input.value = '';
            input.style.borderColor = '#2ecc71';
            setTimeout(() => input.style.borderColor = '#4a90e2', 200);
        } else {
            input.style.borderColor = '#e74c3c';
            setTimeout(() => input.style.borderColor = '#4a90e2', 200);
        }
    }

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            checkAnswer();
            input.value = '';
        }
    });

    document.addEventListener('click', (e) => {
        // מונע פוקוס אם לוחצים על כפתורי הבחירה
        if(gameActive && !e.target.classList.contains('mult-btn')) input.focus();
    });

</script>
</body>
</html>
