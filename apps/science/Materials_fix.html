<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מבחן במדעים - כיתה ג' (גרסת הקלפים)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: right;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        /* Tabs styling */
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .tab-button:hover {
            background-color: #2980b9;
        }

        .tab-button.active {
            background-color: #e67e22;
            transform: scale(1.05);
            font-weight: bold;
        }

        .mixed-btn {
            background-color: #9b59b6;
        }
        .mixed-btn:hover { background-color: #8e44ad; }

        /* Card Style */
        .quiz-card {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .question-text {
            font-weight: bold;
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #2c3e50;
            line-height: 1.4;
        }

        .options-area {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 10px 0;
            cursor: pointer;
            padding: 12px;
            border-radius: 10px;
            background-color: #f8f9fa;
            border: 2px solid #eee;
            transition: 0.2s;
        }

        label:hover {
            background-color: #e8f4f8;
        }

        input[type="radio"] { margin-left: 10px; }

        select {
            padding: 10px;
            font-size: 1.1em;
            border-radius: 8px;
            width: 100%;
            margin-top: 10px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-family: inherit;
            box-sizing: border-box;
        }

        /* Controls */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        .btn {
            border: none;
            padding: 12px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .check-btn { background-color: #27ae60; color: white; }
        .next-btn { background-color: #34495e; color: white; display: none; }
        
        .progress-bar {
            text-align: center;
            font-size: 0.9em;
            color: #7f8c8d;
            margin-top: 15px;
        }

        .feedback {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }

        .correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .open-note { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }

    </style>
</head>
<body>

<div class="container">
    <h1>🔬 חזרת המדעים שלי 🌍</h1>
    
    <div class="tabs">
        <button class="tab-button" onclick="startQuiz('A')">חלק א'</button>
        <button class="tab-button" onclick="startQuiz('B')">חלק ב'</button>
        <button class="tab-button" onclick="startQuiz('C')">חלק ג'</button>
        <button class="tab-button mixed-btn" onclick="startQuiz('Mixed')">🎲 ערבב הכל!</button>
    </div>

    <div id="quiz-container">
        <div style="text-align: center; margin-top: 50px; color: #7f8c8d;">
            בחרי קטגוריה כדי להתחיל לתרגל!
        </div>
    </div>

    <div id="controls-area" class="controls" style="display: none;">
        <button id="check-btn" class="btn check-btn" onclick="handleCheck()">בדיקה</button>
        <button id="next-btn" class="btn next-btn" onclick="renderNextQuestion()">השאלה הבאה ⮕</button>
        <div class="progress-bar" id="progress"></div>
    </div>
</div>

<script>
    // --- DATA ---
    const questionsA = [
        { type: 'A', q: "מהו מוצר?", options: ["דבר שנמצא בטבע כמו שהוא.", "חפץ שנוצר על ידי האדם מחומרים שונים כדי לשמש אותו.", "סוג של אדמה.", "פסולת שצריך לזרוק."], ans: 1 },
        { type: 'A', q: "איזה מהבאים הוא חומר ולא מוצר?", options: ["שולחן עץ", "בקבוק פלסטיק", "צמר", "סוודר"], ans: 2 },
        { type: 'A', q: "מהי תערובת?", options: ["חומר אחד בלבד שנמצא בכלי", "ערבוב של שני חומרים או יותר יחד", "חומר שנעלם במים", "מוצר חדש שקונים בחנות"], ans: 1 },
        { type: 'A', q: "כיצד ניתן להפריד תערובת של חול וברגים?", options: ["בעזרת מסננת (סינון)", "בעזרת מגנט (מגנטיות)", "בעזרת אידוי המים", "אי אפשר להפריד ביניהם"], ans: 1 },
        { type: 'A', q: "מהי התכונה המבדילה שמאפשרת להפריד אבנים מחול בעזרת כברה (מסננת גדולה)?", options: ["צבע", "ריח", "גודל הגרגרים", "מסיסות במים"], ans: 2 },
        { type: 'A', q: "מה קורה לסוכר כשאנחנו מערבבים אותו בתה חם?", options: ["הוא נעלם ולא קיים יותר", "הוא שוקע לקרקעית ולא משתנה", "הוא ניתך והופך לנוזל", "הוא מתמוסס ונוצרת תמיסה"], ans: 3 },
        { type: 'A', q: "איזה מהחומרים לא מתמוסס במים?", options: ["סוכר", "מלח", "שמן", "כולם לא מתמוססים"], ans: 2 },
        { type: 'A', q: "למה חשוב למחזר חומרים?", options: ["כדי שיהיה לנו יותר זבל", "כדי לשמור על משאבי הטבע", "כי זה מבזבז זמן", "כדי ללכלך את הסביבה"], ans: 1 },
        { type: 'A', q: "מהי הדרך הטובה ביותר להפריד מי מלח לקבלת המלח?", options: ["סינון", "הצפה", "אידוי (חימום)", "מגנט"], ans: 2 },
        { type: 'A', q: "איזה חפץ יימשך למגנט?", options: ["כוס זכוכית", "סיכת ביטחון מברזל", "מחק גומי", "כפית פלסטיק"], ans: 1 },
        { type: 'A', q: "מדוע ידיות של סירים עשויות מפלסטיק או עץ?", options: ["כי אלו חומרים יפים", "כי הם מוליכים חום היטב", "כי הם מבודדים", "כי הם חזקים ממתכת"], ans: 2 }
    ];

    const questionsB = [
        { type: 'B', text: "השולחן הוא ___ שהנגר הכין מעץ.", ans: "מוצר" },
        { type: 'B', text: "העץ הוא ___ שמשמש לבניית רהיטים.", ans: "חומר גלם" },
        { type: 'B', text: "סלט ירקות הוא דוגמה ל___ של מוצקים.", ans: "תערובת" },
        { type: 'B', text: "כאשר מערבבים מלח במים, המלח ___ במים.", ans: "מתמוסס" },
        { type: 'B', text: "מים שמומס בתוכם סוכר נקראים ___.", ans: "תמיסה" },
        { type: 'B', text: "כדי להפריד אטבים מברזל מחול, נשתמש בתכונת ה___.", ans: "מגנטיות" },
        { type: 'B', text: "כשאנחנו משתמשים בצנצנת ריקה לאחסון עפרונות, אנו עושים ___.", ans: "שימוש חוזר" },
        { type: 'B', text: "המגנט מושך אליו חפצים העשויים מ___.", ans: "ברזל" },
        { type: 'B', text: "המתכת היא חומר שהוא ___ טוב.", ans: "מוליך חום" }
    ];

    const questionsC = [
        { type: 'C', q: "הסבירו במילים שלכם: מה ההבדל בין 'חומר' לבין 'מוצר'? תנו דוגמה." },
        { type: 'C', q: "תארו את השלבים להפרדת תערובת של מים, חול ומלח." },
        { type: 'C', q: "ציינו שתי תכונות של הזכוכית שהופכות אותה למתאימה לחלונות." },
        { type: 'C', q: "בחרו מוצר מהקלמר. מאיזה חומר הוא עשוי ולמה בחרו בחומר זה?" },
        { type: 'C', q: "באיזו כפית כדאי לערבב שוקו חם (מתכת או פלסטיק)? נמקו." }
    ];

    const wordBank = ["חומר גלם", "מתמוסס", "שימוש חוזר", "תערובת", "מוצר", "מגנטיות", "תמיסה", "מוליך חום", "ברזל", "מבודד"];

    // --- STATE ---
    let currentDeck = [];
    let currentIndex = 0;

    // --- LOGIC ---

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startQuiz(mode) {
        currentIndex = 0;
        if (mode === 'A') currentDeck = shuffle([...questionsA]);
        else if (mode === 'B') currentDeck = shuffle([...questionsB]);
        else if (mode === 'C') currentDeck = shuffle([...questionsC]);
        else if (mode === 'Mixed') {
            currentDeck = shuffle([...questionsA, ...questionsB, ...questionsC]);
        }

        document.getElementById('controls-area').style.display = 'block';
        
        // UI Highlight
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        event?.target.classList.add('active');

        renderNextQuestion();
    }

    function renderNextQuestion() {
        if (currentIndex >= currentDeck.length) {
            document.getElementById('quiz-container').innerHTML = `
                <div style="text-align:center;">
                    <h2>כל הכבוד! 🎉</h2>
                    <p>סיימת את כל החפיסה.</p>
                    <button class="btn" style="background:#3498db; color:white;" onclick="location.reload()">תרגול חדש</button>
                </div>`;
            document.getElementById('controls-area').style.display = 'none';
            return;
        }

        const q = currentDeck[currentIndex];
        const container = document.getElementById('quiz-container');
        const nextBtn = document.getElementById('next-btn');
        const checkBtn = document.getElementById('check-btn');
        
        nextBtn.style.display = 'none';
        checkBtn.style.display = 'block';
        
        let html = `<div class="quiz-card">`;
        
        if (q.type === 'A') {
            html += `<div class="question-text">${q.q}</div><div class="options-area">`;
            q.options.forEach((opt, i) => {
                html += `<label><input type="radio" name="opt" value="${i}"> ${opt}</label>`;
            });
            html += `</div>`;
        } 
        else if (q.type === 'B') {
            let selectHtml = `<select id="ans-select"><option value="">בחרי מילה...</option>`;
            wordBank.sort().forEach(w => selectHtml += `<option value="${w}">${w}</option>`);
            selectHtml += `</select>`;
            html += `<div class="question-text">${q.text.replace('___', '______')}</div>`;
            html += `<div class="options-area">${selectHtml}</div>`;
        }
        else if (q.type === 'C') {
            html += `<div class="question-text">${q.q}</div>`;
            html += `<textarea id="open-ans" placeholder="כתבי כאן את התשובה שלך..."></textarea>`;
        }

        html += `<div id="feedback" class="feedback"></div></div>`;
        container.innerHTML = html;

        document.getElementById('progress').innerText = `שאלה ${currentIndex + 1} מתוך ${currentDeck.length}`;
    }

    function handleCheck() {
        const q = currentDeck[currentIndex];
        const feedback = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');
        const checkBtn = document.getElementById('check-btn');
        let isCorrect = false;
        let isSpecial = false;

        if (q.type === 'A') {
            const selected = document.querySelector('input[name="opt"]:checked');
            if (!selected) return alert("אנא בחרי תשובה");
            if (parseInt(selected.value) === q.ans) isCorrect = true;
        } 
        else if (q.type === 'B') {
            const val = document.getElementById('ans-select').value;
            if (!val) return alert("אנא בחרי מילה מהרשימה");
            if (val === q.ans) isCorrect = true;
        }
        else if (q.type === 'C') {
            isSpecial = true; // Open questions don't have auto-check
        }

        feedback.style.display = 'block';
        if (isSpecial) {
            feedback.innerHTML = "נשמע מעולה! השאלה הזו פתוחה - הראי לאמא או אבא שבדקו את הניסוח שלך. ⭐";
            feedback.className = "feedback open-note";
        } else if (isCorrect) {
            feedback.innerText = "נכון מאוד! כל הכבוד! ✅";
            feedback.className = "feedback correct";
        } else {
            feedback.innerText = "לא בדיוק, כדאי לנסות שוב או לבדוק בחומר הלימוד. ❌";
            feedback.className = "feedback incorrect";
        }

        checkBtn.style.display = 'none';
        nextBtn.style.display = 'block';
        currentIndex++;
    }
</script>

</body>
</html>
