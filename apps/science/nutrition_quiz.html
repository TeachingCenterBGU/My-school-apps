<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

<!-- ============ Firebase AI Logic — בדיקת תשובות עם Gemini ============ -->
<script type="module">
// ==============================================
// Firebase AI Logic — בדיקת תשובות פתוחות עם Gemini
// ==============================================
//
// הפעלה (פעם אחת):
// 1. Firebase Console → AI Services → AI Logic → Get started
// 2. בחרי "Gemini Developer API" (חינמי!)
// 3. זהו! לא צריך Blaze plan בכלל.
//
// עד שמפעילים — השאלות עדיין עובדות, פשוט בלי בדיקת AI.
// ==============================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";

let aiService = null;
let aiModel = null;
let aiAvailable = false;

const firebaseConfig = {
    apiKey: "AIzaSyAi0YrEfLEr7GK2VRjJ9FOuhz4066_7T5M",
    authDomain: "homework-barad.firebaseapp.com",
    databaseURL: "https://homework-barad-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "homework-barad",
    storageBucket: "homework-barad.firebasestorage.app",
    messagingSenderId: "324035760311",
    appId: "1:324035760311:web:2b9793e3924cc2840a3d32"
};

const app = initializeApp(firebaseConfig, "ai-app");
const auth = getAuth(app);

// ==============================
// System Prompt — הפרומפט לבדיקת תשובות
// ==============================
const TUTOR_SYSTEM_PROMPT = `אתה חונך סבלני וחם לילדה בכיתה ה' בבית ספר יסודי בישראל.
היא כותבת תשובות לשאלות פתוחות בנושא מזון ומערכת העיכול.

הנחיות חשובות:
• התעלם משגיאות כתיב לחלוטין ואל תתקן אותן, אלא אם הן מונעות ממך להבין את המשפט.
• התמקד אך ורק בבדיקה האם התשובה נכונה מבחינת התוכן.
• אם התשובה נכונה — אמור את זה בשמחה עם חיזוק חיובי, והוסף פרט מעניין קשור.
• אם התשובה חלקית — תתחיל בחיזוק חיובי על מה שנכון, ואז שאל שאלת מכוון אחת כדי לעזור לה להשלים.
• אם התשובה לא נכונה — תחזק את המאמץ, ותן רמז או שאלה מכוונת שתעזור לה לחשוב מחדש. אל תגיד את התשובה!
• תמיד תתחיל בחיזוק חיובי על המאמץ.
• כתוב בעברית פשוטה, בגובה העיניים של ילדה בת 10-11.
• תשובה קצרה — 2-4 משפטים מספיקים.
• אל תשתמש בכוכביות או בפורמט מורכב. כתוב טקסט רגיל.

בסוף כל תשובה, הוסף בשורה נפרדת:
[ציון: X/3]
כאשר: 3 = תשובה מלאה ונכונה, 2 = חלקית, 1 = לא נכונה אבל ניסתה, 0 = ריק או לא רלוונטי`;

// ==============================
// אתחול Firebase AI Logic
// ==============================
async function initAI() {
    try {
        // ניסיון 1: Firebase AI Logic API חדש (firebase/ai)
        const aiModule = await import(
            "https://www.gstatic.com/firebasejs/11.8.1/firebase-ai.js"
        );
        const { getAI, getGenerativeModel, GoogleAIBackend } = aiModule;
        
        // Gemini Developer API — חינמי!
        aiService = getAI(app, { backend: new GoogleAIBackend() });
        aiModel = getGenerativeModel(aiService, { 
            model: "gemini-2.5-flash",
            systemInstruction: TUTOR_SYSTEM_PROMPT,
            generationConfig: {
                temperature: 0.3,
                maxOutputTokens: 1500,
            }
        });
        aiAvailable = true;
        console.log("✅ Firebase AI Logic initialized (Gemini Developer API)");
        
    } catch (err1) {
        console.warn("⚠️ firebase-ai.js not available, trying firebase-vertexai.js...", err1.message);
        
        try {
            // ניסיון 2: Vertex AI API ישן (fallback)
            const vtxModule = await import(
                "https://www.gstatic.com/firebasejs/11.8.1/firebase-vertexai.js"
            );
            const { getVertexAI, getGenerativeModel } = vtxModule;
            
            aiService = getVertexAI(app);
            aiModel = getGenerativeModel(aiService, { 
                model: "gemini-2.5-flash",
                systemInstruction: TUTOR_SYSTEM_PROMPT,
                generationConfig: {
                    temperature: 0.3,
                    maxOutputTokens: 1500,
                }
            });
            aiAvailable = true;
            console.log("✅ Vertex AI initialized (fallback)");
            
        } catch (err2) {
            console.warn("⚠️ AI not available:", err2.message);
            aiAvailable = false;
        }
    }
    
    return aiAvailable;
}

// בדיקת מצב התחברות + אתחול AI
onAuthStateChanged(auth, async (user) => {
    if (user && !aiAvailable) {
        console.log("👤 User signed in:", user.displayName);
        await initAI();
    }
    window._aiStatus = { available: aiAvailable, signedIn: !!user };
    window.dispatchEvent(new Event('ai-status-changed'));
});

// ==============================
// פונקציית בדיקת תשובה עם AI
// ==============================
window.checkWithAI = async function(question, expectedAnswer, studentAnswer) {
    if (!aiAvailable || !aiModel) {
        return {
            success: false,
            error: "AI_NOT_AVAILABLE",
            message: "בדיקת AI לא זמינה כרגע. בדקי שהתחברת עם חשבון גוגל."
        };
    }

    const prompt = `השאלה: ${question}

התשובה המצופה (לשימושך הפנימי בלבד — אל תחשפי אותה!): ${expectedAnswer}

התשובה של התלמידה: ${studentAnswer}

בדוק את התשובה לפי ההנחיות שלך ותן משוב.`;

    try {
        const result = await aiModel.generateContent(prompt);
        const response = result.response;
        const text = response.text();
        
        // חילוץ הציון
        const scoreMatch = text.match(/\[ציון:\s*(\d)\/3\]/);
        const score = scoreMatch ? parseInt(scoreMatch[1]) : null;
        const feedbackText = text.replace(/\[ציון:\s*\d\/3\]/, '').trim();

// ============ STATE ============
let currentSection = null;
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let sectionScores = {};
let openQuestionAttempts = 0; // כמה ניסיונות בשאלה פתוחה נוכחית
let totalOpenScore = 0;       // סכום ציוני AI

// ============ FUNCTIONS ============
function startSection(sectionId) {
    if (sectionId === 'all') {
        // תרגול מלא — רק שאלות אמריקאיות (בלי פתוחות)
        currentQuestions = [];
        sections.forEach(s => {
            currentQuestions.push(...s.questions.filter(q => q.type !== 'open'));
        });
        shuffleArray(currentQuestions);
        currentSection = 'all';
    } else {
        currentQuestions = [...sections[sectionId].questions];
        shuffleArray(currentQuestions);
        currentSection = sectionId;
    }
    
    currentIndex = 0;
    score = 0;
    totalOpenScore = 0;
    answered = false;
    
    document.getElementById('sectionScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');
    document.getElementById('resultsScreen').classList.add('hidden');
    
    showQuestion();
}

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function showQuestion() {
    const q = currentQuestions[currentIndex];
    const total = currentQuestions.length;
    
    document.getElementById('progressText').textContent = `שאלה ${currentIndex + 1} מתוך ${total}`;
    document.getElementById('progressBar').style.width = ((currentIndex) / total * 100) + '%';
    document.getElementById('nextBtn').style.display = 'none';
    answered = false;
    openQuestionAttempts = 0;
    
    // Check if it's an open question
    if (q.type === 'open') {
        showOpenQuestion(q);
        return;
    }
    
    let badgeClass = 'badge-basic';
    let badgeText = '📘 ידע בסיסי';
    if (q.type === 'analysis') {
        badgeClass = 'badge-analysis';
        badgeText = '📊 ניתוח טקסט';
    } else if (q.type === 'experiment') {
        badgeClass = 'badge-experiment';
        badgeText = '🧪 ניתוח ניסוי';
    }
    
    let contextHtml = '';
    if (q.context) {
        const contextClass = q.type === 'experiment' ? '' : 'text-analysis';
        const titleText = q.type === 'experiment' ? '🔬 תיאור הניסוי:' : '📄 קראו את הטקסט:';
        contextHtml = `
            <div class="context-box ${contextClass}">
                <div class="context-box-title">${titleText}</div>
                ${q.context.replace(/\n/g, '<br>')}
            </div>`;
    }
    
    let optionsHtml = q.options.map((opt, i) => 
        `<button class="option-btn" onclick="checkAnswer(${i})" id="opt-${i}">${opt}</button>`
    ).join('');
    
    document.getElementById('questionArea').innerHTML = `
        <div class="question-card">
            <span class="question-type-badge ${badgeClass}">${badgeText}</span>
            ${contextHtml}
            <div class="question-text">${q.text}</div>
            <div class="options-list">${optionsHtml}</div>
            <div id="feedback"></div>
        </div>`;
}

// ============ OPEN QUESTION DISPLAY ============
function showOpenQuestion(q) {
    const aiStatus = window._aiStatus || { available: false, signedIn: false };
    
    let noticeHtml = '';
    if (!aiStatus.signedIn) {
        noticeHtml = `
            <div class="ai-setup-notice">
                <strong>🔑 כדי לקבל בדיקה חכמה מה-AI, צריך להתחבר:</strong>

                    padding: 8px 20px; border: none; border-radius: 10px;
                    background: linear-gradient(135deg, #4285f4, #356ac3); color: white;
                    font-family: 'Rubik', sans-serif; font-weight: 600; cursor: pointer;
                    margin-top: 6px; font-size: 0.9em;
                ">🔐 התחברות עם Google</button>
                <div style="margin-top: 6px; font-size: 0.8em; color: #888;">
                    גם בלי — אפשר לכתוב תשובה ולראות את התשובה הנכונה
                </div>
            </div>`;
    } else if (!aiStatus.available) {
        noticeHtml = `
            <div class="ai-setup-notice">
                <strong>⚠️ בדיקת AI לא פעילה כרגע</strong>
                צריך להפעיל Firebase AI Logic ב-Firebase Console
                (AI Services → AI Logic → Get started → Gemini Developer API).
                בינתיים — כתבי תשובה ותוכלי לראות את התשובה הנכונה.
            </div>`;
    }
    
    document.getElementById('questionArea').innerHTML = `
        <div class="question-card">
            <span class="question-type-badge badge-open">${q.context ? '🧪 ניסוי + תשובה פתוחה' : '✍️ שאלה פתוחה'}</span>
            ${noticeHtml}
            ${q.context ? `<div class="context-box">
                <div class="context-box-title">🔬 תיאור הניסוי:</div>
                ${q.context.replace(/\n/g, '<br>')}
            </div>` : ''}
            <div class="question-text">${q.text}</div>
            <div class="open-answer-area">
                <textarea id="openAnswer" placeholder="${q.shortAnswer ? 'כתבי תשובה קצרה — כמה מילים...' : 'כתבי את התשובה שלך כאן...'}" 
                    style="${q.shortAnswer ? 'min-height: 50px;' : ''}"
                    oninput="updateCharCount(this)"></textarea>
                <div class="char-count" id="charCount">0 תווים</div>
                <button class="submit-answer-btn" id="submitOpenBtn" onclick="submitOpenAnswer()">
                    🤖 שלחי לבדיקה
                </button>
            </div>
            <div id="feedback"></div>
            <div id="hintArea"></div>
        </div>`;
}

function updateCharCount(textarea) {
    document.getElementById('charCount').textContent = textarea.value.length + ' תווים';
}

// ============ SUBMIT OPEN ANSWER ============
async function submitOpenAnswer() {
    const textarea = document.getElementById('openAnswer');
    const answer = textarea.value.trim();
    const q = currentQuestions[currentIndex];
    
    if (answer.length < 3) {
        document.getElementById('feedback').innerHTML = 
            '<div class="feedback wrong">✏️ כתבי תשובה קצת יותר ארוכה...</div>';
        return;
    }
    
    openQuestionAttempts++;
    
    // Disable input while checking
    textarea.disabled = true;
    document.getElementById('submitOpenBtn').disabled = true;
    
    const feedbackEl = document.getElementById('feedback');
    const aiStatus = window._aiStatus || { available: false, signedIn: false };
    
    // Show loading
    if (aiStatus.available) {
        feedbackEl.innerHTML = `
            <div class="ai-loading">
                🤖 הבודק החכם קורא את התשובה שלך
                <div class="dots"><span></span><span></span><span></span></div>
            </div>`;
        
        // Call AI
        const result = await window.checkWithAI(q.text, q.expectedAnswer, answer);
        
        if (result.success) {
            const scoreEmoji = result.score >= 3 ? '🌟' : result.score >= 2 ? '👍' : '💪';
            
            feedbackEl.innerHTML = `
                <div class="feedback ai-feedback">
                    <div style="font-weight:700; margin-bottom:6px;">${scoreEmoji} משוב מהבודק החכם:</div>
                    <div class="ai-hint-text">${result.feedback}</div>
                </div>`;
            
            // If score is 3/3, mark as fully correct
            if (result.score >= 3) {
                totalOpenScore += 3;
                answered = true;
                document.getElementById('nextBtn').style.display = 'block';
                if (currentIndex === currentQuestions.length - 1) {
                    document.getElementById('nextBtn').textContent = '📊 לתוצאות';
                }
                score++;
            } else if (result.score >= 2) {
                // Partial — allow retry or move on
                totalOpenScore += 2;
                showRetryOrContinue(q);
            } else {
                // Incorrect — allow retry with hint
                totalOpenScore += result.score || 0;
                showRetryOrContinue(q);
            }
        } else {
            // AI failed — fallback to showing correct answer
            feedbackEl.innerHTML = `
                <div class="feedback wrong">
                    ⚠️ ${result.message}
                </div>`;
            showFallbackAnswer(q);
        }
    } else {
        // No AI — show correct answer
        showFallbackAnswer(q);
    }
}

function showRetryOrContinue(q) {
    const hintArea = document.getElementById('hintArea');
    const textarea = document.getElementById('openAnswer');
    
    if (openQuestionAttempts < 2) {
        // Allow retry
        textarea.disabled = false;
        document.getElementById('submitOpenBtn').disabled = false;
        
        hintArea.innerHTML = `
            <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
                <button class="try-again-btn" onclick="retryOpen()">✏️ לנסות שוב</button>
                <button class="try-again-btn" onclick="showHint()" style="border-color: #ff9800; color: #ff9800;">
                    💡 רמז
                </button>
                <button class="try-again-btn" onclick="showCorrectAndContinue()" style="border-color: #66bb6a; color: #2e7d32;">
                    ← המשך לשאלה הבאה
                </button>
            </div>`;
    } else {
        // Max retries — show answer and continue
        showCorrectAndContinue();
    }
}

function retryOpen() {
    const textarea = document.getElementById('openAnswer');
    textarea.disabled = false;
    textarea.focus();
    document.getElementById('submitOpenBtn').disabled = false;
    document.getElementById('hintArea').innerHTML = '';
}

function showHint() {
    const q = currentQuestions[currentIndex];
    if (q.hint) {
        document.getElementById('hintArea').innerHTML = `
            <div class="feedback" style="background:#fff8e1; border:1px solid #ffcc02; color:#6d4c00; margin-top:10px;">
                💡 <strong>רמז:</strong> ${q.hint}
            </div>
            <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
                <button class="try-again-btn" onclick="retryOpen()">✏️ לנסות שוב</button>
                <button class="try-again-btn" onclick="showCorrectAndContinue()" style="border-color: #66bb6a; color: #2e7d32;">
                    ← המשך לשאלה הבאה
                </button>
            </div>`;
    }
}

function showCorrectAndContinue() {
    const q = currentQuestions[currentIndex];
    answered = true;
    
    document.getElementById('hintArea').innerHTML = `
        <div class="feedback correct" style="margin-top:10px;">
            <div style="font-weight:700; margin-bottom:6px;">✅ התשובה המלאה:</div>
            <div class="ai-hint-text">${q.expectedAnswer}</div>
        </div>`;
    
    document.getElementById('nextBtn').style.display = 'block';
    if (currentIndex === currentQuestions.length - 1) {
        document.getElementById('nextBtn').textContent = '📊 לתוצאות';
    }
}

function showFallbackAnswer(q) {
    document.getElementById('hintArea').innerHTML = `
        <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
            <button class="try-again-btn" onclick="showCorrectAndContinue()" style="border-color: #66bb6a; color: #2e7d32;">
                📖 ראי את התשובה הנכונה
            </button>
        </div>`;
    
    document.getElementById('openAnswer').disabled = false;
    document.getElementById('submitOpenBtn').disabled = false;
}

// ============ MULTIPLE CHOICE CHECK ============
function checkAnswer(selected) {
    if (answered) return;
    answered = true;
    
    const q = currentQuestions[currentIndex];
    const correct = q.correct;
    const feedbackEl = document.getElementById('feedback');
    
    document.querySelectorAll('.option-btn').forEach(btn => btn.classList.add('disabled'));
    
    if (selected === correct) {
        score++;
        document.getElementById(`opt-${selected}`).classList.add('correct');
        feedbackEl.innerHTML = `<div class="feedback correct">✅ נכון מאוד! ${q.explanation}</div>`;
    } else {
        document.getElementById(`opt-${selected}`).classList.add('wrong');
        document.getElementById(`opt-${correct}`).classList.add('show-correct');
        feedbackEl.innerHTML = `<div class="feedback wrong">❌ לא מדויק. ${q.explanation}</div>`;
    }
    
    document.getElementById('nextBtn').style.display = 'block';
    
    if (currentIndex === currentQuestions.length - 1) {
        document.getElementById('nextBtn').textContent = '📊 לתוצאות';
    }
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex >= currentQuestions.length) {
        showResults();
    } else {
        showQuestion();
    }
}

function showResults() {
    const total = currentQuestions.length;
    const pct = Math.round(score / total * 100);
    let emoji = '🌟';
    let msg = 'מעולה!';
    if (pct < 50) { emoji = '💪'; msg = 'כדאי לחזור על החומר'; }
    else if (pct < 70) { emoji = '👍'; msg = 'לא רע! עוד קצת תרגול'; }
    else if (pct < 90) { emoji = '🎉'; msg = 'כל הכבוד!'; }
    
    // Save score
    if (currentSection !== 'all' && currentSection !== null) {
        sectionScores[currentSection] = { score, total };
        const scoreEl = document.getElementById(`score-${currentSection}`);
        if (scoreEl) scoreEl.textContent = `${score}/${total}`;
    }
    
    // Report score to app-tracker if available
    if (typeof saveAppScore === 'function') {
        saveAppScore('nutrition-quiz', score, total);
    }
    
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('resultsScreen').classList.remove('hidden');
    document.getElementById('resultsScreen').innerHTML = `
        <div class="results-card">
            <div class="results-emoji">${emoji}</div>
            <div class="results-score">${score} / ${total}</div>
            <div class="results-text">${pct}% — ${msg}</div>
            <button class="nav-btn primary" onclick="goToSections()" style="margin:10px 5px">🔄 תרגול נוסף</button>
            <a href="../../grade-5.html" class="back-home">🏠 חזרה לעמוד הכיתה</a>
        </div>`;
}

function goToSections() {
    document.getElementById('sectionScreen').classList.remove('hidden');
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('resultsScreen').classList.add('hidden');
}

// Listen for AI status changes to update UI
window.addEventListener('ai-status-changed', () => {
    // If we're currently showing an open question, refresh the notice
    if (currentQuestions[currentIndex]?.type === 'open' && !answered) {
        showOpenQuestion(currentQuestions[currentIndex]);
    }
});
</script>
