<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מגיני הגלקסיה V2</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* הקנבס תופס את כל המסך */
        canvas {
            display: block;
        }

        /* ממשק עליון (חיים וניקוד) */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none; /* כדי שהעכבר לא יתקע עליו */
            direction: ltr;
            text-align: left;
        }

        /* תיבת הקלט */
        #input-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
        }

        input[type="number"] {
            font-size: 2rem;
            padding: 10px 20px;
            width: 150px;
            text-align: center;
            border: 3px solid #4a90e2;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border-radius: 50px;
            outline: none;
            box-shadow: 0 0 20px rgba(74, 144, 226, 0.5);
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* מסכי פתיחה וסיום */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 100;
        }

        h1 { font-size: 3rem; color: #4a90e2; margin-bottom: 10px; text-shadow: 0 0 20px #4a90e2; }
        p { font-size: 1.5rem; margin-bottom: 30px; }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
            transition: transform 0.2s;
        }

        button:hover { transform: scale(1.1); }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="hud">
        ❤️ <span id="livesVal">3</span><br>
        🏆 <span id="scoreVal">0</span>
    </div>

    <div id="startScreen" class="overlay">
        <h1>🚀 מגיני הגלקסיה</h1>
        <p>יש להקליד את התשובה וללחוץ ENTER כדי לירות</p>
        <button onclick="startGame()">התחל משחק</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1>המשחק נגמר!</h1>
        <p>ניקוד סופי: <span id="finalScore">0</span></p>
        <button onclick="startGame()">נסה שוב</button>
    </div>

    <div id="input-container">
        <input type="number" id="answerInput" placeholder="?" autocomplete="off">
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // התאמת גודל הקנבס למסך
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas(); // הפעלה ראשונית

    const input = document.getElementById('answerInput');
    const scoreVal = document.getElementById('scoreVal');
    const livesVal = document.getElementById('livesVal');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScore = document.getElementById('finalScore');

    let gameActive = false;
    let score = 0;
    let lives = 3;
    let meteors = [];
    let particles = [];
    let spawnRate = 2000;
    let lastSpawnTime = 0;
    let difficultySpeed = 1;

    class Meteor {
        constructor() {
            this.radius = 40;
            this.x = Math.random() * (canvas.width - 100) + 50;
            this.y = -50;
            this.speed = (Math.random() * 0.5 + 0.5) * difficultySpeed; // מהירות
            
            this.n1 = Math.floor(Math.random() * 9) + 2;
            this.n2 = Math.floor(Math.random() * 9) + 2;
            this.answer = this.n1 * this.n2;
            this.text = `${this.n1} × ${this.n2}`;
            
            this.color = `hsl(${Math.random() * 360}, 70%, 50%)`;
        }

        update() {
            this.y += this.speed;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 30px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.text, this.x, this.y);
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.vx = (Math.random() - 0.5) * 10;
            this.vy = (Math.random() - 0.5) * 10;
            this.life = 1.0;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= 0.02;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    function startGame() {
        score = 0;
        lives = 3;
        meteors = [];
        particles = [];
        spawnRate = 2000;
        difficultySpeed = 1;
        gameActive = true;
        
        scoreVal.innerText = score;
        livesVal.innerText = lives;
        
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        input.value = '';
        input.focus();
        
        requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        gameActive = false;
        finalScore.innerText = score;
        gameOverScreen.classList.remove('hidden');
    }

    function gameLoop(timestamp) {
        if (!gameActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // יצירת מטאורים
        if (timestamp - lastSpawnTime > spawnRate) {
            meteors.push(new Meteor());
            lastSpawnTime = timestamp;
            // הגברת קושי קלה
            if (spawnRate > 500) spawnRate -= 10;
        }

        // ציור ועדכון מטאורים
        for (let i = meteors.length - 1; i >= 0; i--) {
            let m = meteors[i];
            m.update();
            m.draw();

            // בדיקת פגיעה ברצפה
            if (m.y - m.radius > canvas.height) {
                lives--;
                livesVal.innerText = lives;
                meteors.splice(i, 1);
                
                // אפקט רעידה
                canvas.style.transform = 'translate(5px, 5px)';
                setTimeout(()=> canvas.style.transform = 'none', 50);

                if (lives <= 0) gameOver();
            }
        }

        // ציור חלקיקים (פיצוצים)
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.update();
            p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        }

        requestAnimationFrame(gameLoop);
    }

    // בדיקת תשובה
    function checkAnswer() {
        const val = parseInt(input.value);
        if (isNaN(val)) return;

        // חיפוש המטאור הנכון (הכי נמוך קודם)
        let hitIndex = -1;
        let lowestY = -1000;

        meteors.forEach((m, index) => {
            if (m.answer === val && m.y > lowestY) {
                hitIndex = index;
                lowestY = m.y;
            }
        });

        if (hitIndex !== -1) {
            // בום!
            const m = meteors[hitIndex];
            // יצירת פיצוץ
            for(let k=0; k<20; k++) particles.push(new Particle(m.x, m.y, m.color));
            
            meteors.splice(hitIndex, 1);
            score += 10;
            scoreVal.innerText = score;
            
            // העלאת רמה כל 100 נקודות
            if (score % 100 === 0) difficultySpeed += 0.2;
            
            input.value = '';
            input.style.borderColor = '#2ecc71'; // ירוק לרגע
            setTimeout(() => input.style.borderColor = '#4a90e2', 200);
        } else {
            // טעות
            input.style.borderColor = '#e74c3c'; // אדום לרגע
            setTimeout(() => input.style.borderColor = '#4a90e2', 200);
        }
    }

    // הקשבה לאנטר
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            checkAnswer();
            input.value = ''; // ניקוי תמיד
        }
    });

    // וידוא שהפוקוס נשאר בתיבה
    document.addEventListener('click', () => {
        if(gameActive) input.focus();
    });

</script>
</body>
</html>
