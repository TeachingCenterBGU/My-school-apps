<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>משחק מיון אותיות דינמי</title>
  <style>
    :root{
      --bg1:#fff8e7;
      --bg2:#fef3c7;
      --card:#ffffff;
      --ink:#3b2f2f;
      --accent:#f59e0b;
      --accent2:#10b981;
      --accent3:#60a5fa;
      --accent4:#a855f7;
      --danger:#ef4444;
      --shadow:0 10px 25px rgba(0,0,0,0.12);
      --radius:20px;
    }

    * { box-sizing: border-box; }

    body{
      margin:0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--ink);
      min-height: 100vh;
    }

    .container{
      max-width:1200px;
      margin:0 auto;
      padding:20px;
    }

    h1{
      text-align:center;
      font-size:clamp(28px,4vw,48px);
      margin:10px 0 8px;
    }

    .subtitle{
      text-align:center;
      font-size:clamp(18px,2.5vw,24px);
      margin-bottom:20px;
    }

    .topbar{
      display:flex;
      gap:12px;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    .pill{
      background:var(--card);
      border-radius:999px;
      padding:12px 18px;
      box-shadow:var(--shadow);
      font-size:20px;
      font-weight:bold;
    }

    .btn{
      border:none;
      border-radius:999px;
      padding:12px 18px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      box-shadow:var(--shadow);
      background:var(--accent);
      color:white;
      transition: transform 0.2s;
    }

    .btn:hover{
      transform:scale(1.05);
    }

    .instructions{
      background:rgba(255,255,255,0.8);
      border-radius:var(--radius);
      padding:16px;
      margin-bottom:18px;
      box-shadow:var(--shadow);
      text-align:center;
      font-size:20px;
    }

    .game-layout{
      display:grid;
      grid-template-columns: 1.15fr 1fr;
      gap:20px;
      align-items:start;
    }

    .words-panel, .letters-panel{
      background:rgba(255,255,255,0.7);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--shadow);
    }

    .panel-title{
      text-align:center;
      font-size:28px;
      margin:6px 0 18px;
      font-weight:bold;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
      gap:16px;
    }

    .word-card{
      background:var(--card);
      border-radius:22px;
      padding:14px;
      box-shadow:var(--shadow);
      text-align:center;
      cursor:grab;
      user-select:none;
      border:4px solid transparent;
      transition:transform 0.15s ease, border-color 0.15s ease;
      min-height:140px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }

    .word-card:hover{ transform:scale(1.03); border-color:#fde68a; }
    .word-card.dragging{ opacity:0.5; }

    .emoji{ font-size:48px; }
    .word-text{ font-size:28px; font-weight:bold; }

    .dropzones{
      display:grid;
      grid-template-columns:1fr;
      gap:18px;
    }

    .dropzone{
      background:var(--card);
      border-radius:22px;
      border:4px dashed #d1d5db;
      min-height:140px;
      padding:14px;
      box-shadow:var(--shadow);
    }

    .dropzone.active{ background:#f0fdf4; border-color:var(--accent2); }

    .dropzone-header{
      display:flex;
      align-items:center;
      gap:12px;
      font-size:28px;
      font-weight:bold;
      margin-bottom:12px;
    }

    .letter-badge{
      width:50px;
      height:50px;
      border-radius:50%;
      display:inline-flex;
      justify-content:center;
      align-items:center;
      color:white;
      font-size:28px;
    }

    /* צבעים משתנים לאותיות */
    .badge-0 { background:#f97316; }
    .badge-1 { background:#3b82f6; }
    .badge-2 { background:#10b981; }

    .dropzone-body{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      min-height:50px;
    }

    .mini-card{
      background:#fff7ed;
      border-radius:12px;
      padding:6px 10px;
      font-size:20px;
      font-weight:bold;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    .mobile-buttons{
      margin-top:20px;
      background:rgba(255,255,255,0.8);
      border-radius:var(--radius);
      padding:16px;
    }

    .letter-actions{
      display:flex;
      justify-content:center;
      gap:12px;
    }

    .letter-action-btn{
      flex:1;
      max-width:100px;
      height:60px;
      font-size:28px;
      font-weight:bold;
      border:none;
      border-radius:15px;
      cursor:pointer;
      color:white;
    }

    .message{
      margin-top:18px;
      text-align:center;
      font-size:24px;
      font-weight:bold;
      min-height:35px;
    }

    .success{ color:#15803d; }
    .error{ color:var(--danger); }

    @media (max-width: 900px){
      .game-layout{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎈 משחק המיון הגדול 🎈</h1>
    <div class="subtitle" id="gameSubtitle">מיינו את המילים לפי האות הפותחת</div>

    <div class="topbar">
      <div class="pill">ניקוד: <span id="score">0</span> / <span id="total">0</span></div>
      <button class="btn" id="resetBtn">הגרל סט אותיות חדש</button>
    </div>

    <div class="instructions">
      לחצו על כרטיס לשמיעה, וגררו לאות הנכונה (או השתמשו בכפתורי האותיות למטה).
    </div>

    <div class="game-layout">
      <section class="words-panel">
        <div class="panel-title">המילים שלנו</div>
        <div class="cards" id="cardsContainer"></div>

        <div class="mobile-buttons">
          <div class="selected-word-box" id="selectedWordBox" style="text-align:center; font-size:24px; margin-bottom:10px; font-weight:bold;">בחרו מילה...</div>
          <div class="letter-actions" id="mobileActionButtons"></div>
        </div>
      </section>

      <section class="letters-panel">
        <div class="panel-title">לאן זה שייך?</div>
        <div class="dropzones" id="dropzonesContainer"></div>
        <div class="message" id="message"></div>
      </section>
    </div>
  </div>

  <script>
    // מאגר מילים ענק
    const letterPool = {
      "א": [{w:"אריה", e:"🦁"}, {w:"אגס", e:"🍐"}, {w:"אווירון", e:"✈️"}],
      "ב": [{w:"בית", e:"🏠"}, {w:"בובה", e:"🪆"}, {w:"ביצה", e:"🥚"}],
      "ג": [{w:"גלידה", e:"🍦"}, {w:"גמל", e:"🐫"}, {w:"גזר", e:"🥕"}],
      "ד": [{w:"דג", e:"🐟"}, {w:"דוב", e:"🐻"}, {w:"דלת", e:"🚪"}],
      "ה": [{w:"היפו", e:"🦛"}, {w:"הגה", e:"🎡"}, {w:"הר", e:"⛰️"}],
      "ו": [{w:"ורד", e:"🌹"}, {w:"וו", e:"🪝"}, {w:"וילון", e:"🪟"}],
      "ז": [{w:"זברה", e:"🦓"}, {w:"זית", e:"🫒"}, {w:"זבוב", e:"🪰"}],
      "ח": [{w:"חתול", e:"🐱"}, {w:"חלב", e:"🥛"}, {w:"חלון", e:"🪟"}],
      "ט": [{w:"טלפון", e:"📱"}, {w:"טווס", e:"🦚"}, {w:"טרקטור", e:"🚜"}],
      "י": [{w:"ילד", e:"👦"}, {w:"יד", e:"✋"}, {w:"ירח", e:"🌙"}],
      "כ": [{w:"כדור", e:"⚽"}, {w:"כובע", e:"🧢"}, {w:"כיסא", e:"🪑"}],
      "ל": [{w:"לב", e:"❤️"}, {w:"לימון", e:"🍋"}, {w:"לחם", e:"🍞"}],
      "מ": [{w:"מכונית", e:"🚗"}, {w:"מפתח", e:"🔑"}, {w:"מפה", e:"🗺️"}],
      "נ": [{w:"נחש", e:"🐍"}, {w:"נר", e:"🕯️"}, {w:"נעל", e:"👟"}],
      "ס": [{w:"סוס", e:"🐎"}, {w:"סירה", e:"⛵"}, {w:"ספר", e:"📚"}],
      "ע": [{w:"עוגה", e:"🍰"}, {w:"עין", e:"👁️"}, {w:"עץ", e:"🌳"}],
      "פ": [{w:"פרח", e:"🌸"}, {w:"פיל", e:"🐘"}, {w:"פסנתר", e:"🎹"}],
      "צ": [{w:"צב", e:"🐢"}, {w:"ציפור", e:"🐦"}, {w:"צפרדע", e:"🐸"}],
      "ק": [{w:"קוף", e:"🐒"}, {w:"קשת", e:"🌈"}, {w:"קומקום", e:"🫖"}],
      "ר": [{w:"רכבת", e:"🚂"}, {w:"ראש", e:"👤"}, {w:"רימון", e:"🍎"}],
      "ש": [{w:"שמש", e:"☀️"}, {w:"שעון", e:"⌚"}, {w:"שולחן", e:"🪑"}],
      "ת": [{w:"תפוח", e:"🍎"}, {w:"תיק", e:"🎒"}, {w:"תרנגול", e:"🐓"}]
    };

    let usedLetterSets = []; // מעקב אחרי מה שהיה בסשן
    let currentWords = [];
    let currentLetters = [];
    let score = 0;
    let selectedWordId = null;

    const cardsContainer = document.getElementById("cardsContainer");
    const dropzonesContainer = document.getElementById("dropzonesContainer");
    const mobileActionButtons = document.getElementById("mobileActionButtons");
    const scoreEl = document.getElementById("score");
    const totalEl = document.getElementById("total");
    const messageEl = document.getElementById("message");
    const selectedWordBox = document.getElementById("selectedWordBox");

    function speakWord(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "he-IL";
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    function getRandomLetters(count) {
      let allKeys = Object.keys(letterPool);
      // סינון אותיות שכבר השתמשנו בהן בסשן הנוכחי
      let availableKeys = allKeys.filter(k => !usedLetterSets.includes(k));
      
      // אם נגמרו האותיות, מתחילים סבב חדש של זיכרון
      if (availableKeys.length < count) {
        usedLetterSets = [];
        availableKeys = allKeys;
      }

      const shuffled = availableKeys.sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, count);
      
      // הוספה לרשימת המשומשים
      usedLetterSets.push(...selected);
      return selected;
    }

    function initGame() {
      // איפוס נתונים
      score = 0;
      selectedWordId = null;
      currentWords = [];
      scoreEl.textContent = "0";
      messageEl.textContent = "";
      selectedWordBox.textContent = "בחרו מילה...";
      
      // בחירת אותיות
      currentLetters = getRandomLetters(3);
      document.getElementById("gameSubtitle").textContent = `מיינו לפי האותיות: ${currentLetters.join(" , ")}`;

      // בניית רשימת מילים
      currentLetters.forEach(letter => {
        letterPool[letter].forEach(item => {
          currentWords.push({ ...item, letter: letter });
        });
      });

      // ערבוב מילים
      currentWords = currentWords.sort(() => 0.5 - Math.random());
      totalEl.textContent = currentWords.length;

      renderUI();
    }

    function renderUI() {
      // 1. יצירת כרטיסי מילים
      cardsContainer.innerHTML = "";
      currentWords.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "word-card";
        card.draggable = true;
        card.innerHTML = `
          <div class="emoji">${item.e}</div>
          <div class="word-text">${item.w}</div>
        `;
        
        card.onclick = () => {
          speakWord(item.w);
          selectedWordId = index;
          selectedWordBox.textContent = `נבחרה: ${item.w}`;
          document.querySelectorAll(".word-card").forEach(c => c.style.outline = "");
          card.style.outline = "5px solid var(--accent)";
        };

        card.ondragstart = (e) => {
          e.dataTransfer.setData("text", index);
          card.classList.add("dragging");
        };
        card.ondragend = () => card.classList.remove("dragging");
        
        cardsContainer.appendChild(card);
      });

      // 2. יצירת אזורי גרירה וכפתורי מובייל
      dropzonesContainer.innerHTML = "";
      mobileActionButtons.innerHTML = "";

      currentLetters.forEach((letter, idx) => {
        // אזור גרירה
        const dz = document.createElement("div");
        dz.className = "dropzone";
        dz.dataset.letter = letter;
        dz.innerHTML = `
          <div class="dropzone-header">
            <span class="letter-badge badge-${idx}">${letter}</span>
            <span>מילים ב-${letter}</span>
          </div>
          <div class="dropzone-body" id="zone-${letter}"></div>
        `;

        dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("active"); };
        dz.ondragleave = () => dz.classList.remove("active");
        dz.ondrop = (e) => {
          e.preventDefault();
          dz.classList.remove("active");
          const id = e.dataTransfer.getData("text");
          handleMatch(id, letter);
        };
        dropzonesContainer.appendChild(dz);

        // כפתור מובייל
        const btn = document.createElement("button");
        btn.className = `letter-action-btn badge-${idx}`;
        btn.textContent = letter;
        btn.onclick = () => {
          if (selectedWordId === null) {
            messageEl.textContent = "קודם תבחרו מילה מלמעלה!";
            messageEl.className = "message error";
            return;
          }
          handleMatch(selectedWordId, letter);
        };
        mobileActionButtons.appendChild(btn);
      });
    }

    function handleMatch(wordId, targetLetter) {
      const item = currentWords[wordId];
      if (!item) return;

      if (item.letter === targetLetter) {
        // הצלחה
        const zone = document.getElementById(`zone-${targetLetter}`);
        const mini = document.createElement("div");
        mini.className = "mini-card";
        mini.textContent = `${item.e} ${item.w}`;
        zone.appendChild(mini);

        // הסרת הכרטיס המקורי
        const cardEls = document.querySelectorAll(".word-card");
        cardEls.forEach(c => {
            if(c.querySelector(".word-text").textContent === item.w) c.style.display = "none";
        });

        score++;
        scoreEl.textContent = score;
        messageEl.textContent = "כל הכבוד! נכון מאוד 🌟";
        messageEl.className = "message success";
        selectedWordId = null;
        selectedWordBox.textContent = "בחרו מילה...";
        
        if (score === currentWords.length) {
          messageEl.textContent = "ניצחתם! איזה אלופים! 🎉";
          speakWord("כל הכבוד, סיימתם את כל המילים");
        }
      } else {
        messageEl.textContent = "אופס, נסו אות אחרת... 😊";
        messageEl.className = "message error";
      }
    }

    document.getElementById("resetBtn").onclick = initGame;

    // התחלה ראשונה
    initGame();
  </script>
</body>
</html>
