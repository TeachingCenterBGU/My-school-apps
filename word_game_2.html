<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>משחק מיון אותיות דינמי</title>
  <style>
    :root{
      --bg1:#fff8e7;
      --bg2:#fef3c7;
      --card:#ffffff;
      --ink:#3b2f2f;
      --accent:#f59e0b;
      --accent2:#10b981;
      --danger:#ef4444;
      --shadow:0 10px 25px rgba(0,0,0,0.12);
      --radius:20px;
    }

    * { box-sizing: border-box; }

    body{
      margin:0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--ink);
    }

    .container{
      max-width:1250px;
      margin:0 auto;
      padding:20px;
    }

    h1{
      text-align:center;
      font-size:clamp(28px,4vw,48px);
      margin:10px 0 8px;
    }

    .subtitle{
      text-align:center;
      font-size:clamp(18px,2.4vw,24px);
      margin-bottom:20px;
    }

    .setup-box,
    .words-panel,
    .letters-panel{
      background:rgba(255,255,255,0.75);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--shadow);
    }

    .setup-box{
      margin-bottom:18px;
    }

    .setup-title{
      font-size:28px;
      text-align:center;
      margin-bottom:12px;
      font-weight:bold;
    }

    .setup-row{
      display:flex;
      gap:12px;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:12px;
    }

    .letter-input{
      width:80px;
      height:68px;
      font-size:38px;
      text-align:center;
      border-radius:16px;
      border:2px solid #d1d5db;
      background:white;
    }

    .btn{
      border:none;
      border-radius:999px;
      padding:12px 18px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      box-shadow:var(--shadow);
      background:var(--accent);
      color:white;
    }

    .btn:hover{
      transform:translateY(-1px);
    }

    .topbar{
      display:flex;
      gap:12px;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      margin:18px 0;
    }

    .pill{
      background:var(--card);
      border-radius:999px;
      padding:12px 18px;
      box-shadow:var(--shadow);
      font-size:20px;
      font-weight:bold;
    }

    .instructions{
      background:rgba(255,255,255,0.8);
      border-radius:var(--radius);
      padding:16px;
      margin-bottom:18px;
      box-shadow:var(--shadow);
      text-align:center;
      font-size:22px;
      line-height:1.5;
    }

    .sound-note{
      font-size:18px;
      margin-top:8px;
      color:#6b4f1d;
    }

    .game-layout{
      display:grid;
      grid-template-columns:1.15fr 1fr;
      gap:20px;
      align-items:start;
    }

    .panel-title{
      text-align:center;
      font-size:28px;
      margin:6px 0 18px;
      font-weight:bold;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:16px;
    }

    .word-card{
      background:var(--card);
      border-radius:22px;
      padding:14px;
      box-shadow:var(--shadow);
      text-align:center;
      cursor:grab;
      user-select:none;
      border:4px solid transparent;
      transition:transform 0.15s ease, border-color 0.15s ease;
      min-height:150px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:8px;
    }

    .word-card:hover{
      transform:scale(1.03);
      border-color:#fde68a;
    }

    .word-card.dragging{
      opacity:0.55;
    }

    .emoji{
      font-size:54px;
      line-height:1;
    }

    .word-text{
      font-size:32px;
      font-weight:bold;
    }

    .tap-hint{
      font-size:15px;
      color:#777;
    }

    .dropzones{
      display:grid;
      grid-template-columns:1fr;
      gap:18px;
    }

    .dropzone{
      background:var(--card);
      border-radius:22px;
      border:4px dashed #d1d5db;
      min-height:170px;
      padding:14px;
      box-shadow:var(--shadow);
      transition:background 0.15s ease, border-color 0.15s ease;
    }

    .dropzone.active{
      background:#f0fdf4;
      border-color:var(--accent2);
    }

    .dropzone-header{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      font-size:38px;
      font-weight:bold;
      margin-bottom:12px;
      flex-wrap:wrap;
    }

    .letter-badge{
      width:64px;
      height:64px;
      border-radius:50%;
      display:inline-flex;
      justify-content:center;
      align-items:center;
      color:white;
      font-size:38px;
      font-weight:bold;
      background:#f97316;
    }

    .dropzone-body{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      min-height:70px;
      justify-content:center;
      align-items:flex-start;
    }

    .mini-card{
      background:#fff7ed;
      border-radius:16px;
      padding:8px 12px;
      font-size:24px;
      font-weight:bold;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
    }

    .mobile-buttons{
      margin-top:20px;
      background:rgba(255,255,255,0.8);
      border-radius:var(--radius);
      padding:16px;
      box-shadow:var(--shadow);
    }

    .mobile-buttons h3{
      margin-top:0;
      text-align:center;
      font-size:26px;
    }

    .selected-word-box{
      text-align:center;
      min-height:60px;
      font-size:30px;
      font-weight:bold;
      margin-bottom:14px;
      color:#7c2d12;
    }

    .letter-actions{
      display:flex;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .letter-action-btn{
      min-width:88px;
      min-height:68px;
      font-size:34px;
      font-weight:bold;
      border:none;
      border-radius:18px;
      cursor:pointer;
      color:white;
      box-shadow:var(--shadow);
      background:#3b82f6;
    }

    .message{
      margin-top:18px;
      text-align:center;
      font-size:28px;
      font-weight:bold;
      min-height:40px;
    }

    .success{ color:#15803d; }
    .error{ color:var(--danger); }

    .small-note{
      text-align:center;
      font-size:16px;
      color:#666;
      margin-top:10px;
    }

    @media (max-width: 900px){
      .game-layout{
        grid-template-columns:1fr;
      }
    }
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #888;
      margin-top: 40px;
      border-top: 1px solid rgba(0,0,0,0.05);
      }
    </style>
</head>
<body>
  <div class="container">
    <h1>🎈 משחק מיון אותיות 🎈</h1>
    <div class="setup-box">
      <div class="setup-title">בחרו 3 אותיות</div>
      <div class="setup-row">
        <input id="letter1" class="letter-input" maxlength="1" value="ה" />
        <input id="letter2" class="letter-input" maxlength="1" value="ו" />
        <input id="letter3" class="letter-input" maxlength="1" value="ז" />
      </div>
      <div class="setup-row">
        <button class="btn" id="generateBtn">צור משחק</button>
        <button class="btn" id="randomBtn">אותיות אקראיות</button>
      </div>
      <div class="small-note">למשל: ה ו ז / ח כ ל / ק ג ע</div>
    </div>

    <div class="topbar">
      <div class="pill">ניקוד: <span id="score">0</span> / <span id="total">0</span></div>
      <button class="btn" id="resetBtn">ערבב מחדש</button>
      <button class="btn" id="speakAllBtn">השמע את כל המילים</button>
    </div>

    <div class="instructions">
      לחצו על כרטיס כדי לשמוע את המילה. לאחר מכן גררו אותה לריבוע עם האות הנכונה, או לחצו על האות הנכונה בתחתית הרשימה.
    </div>

    <div class="game-layout">
      <section class="words-panel">
        <div class="panel-title">המילים</div>
        <div class="cards" id="cardsContainer"></div>

        <div class="mobile-buttons">
          <h3>אותיות לבחירה</h3>
          <div class="selected-word-box" id="selectedWordBox">לא נבחרה מילה</div>
          <div class="letter-actions" id="letterActions"></div>
        </div>
      </section>

      <section class="letters-panel">
        <div class="panel-title">המיון</div>
        <div class="dropzones" id="dropzones"></div>
        <div class="message" id="message"></div>
      </section>
    </div>
  </div>

  <footer class="footer">
    נוצר באהבה על ידי אלינה גולדשטיין-לויטין ❤️
  </footer>

  <script>
    const WORD_BANK = {
      "א": [
        { word: "אריה", emoji: "🦁", letter: "א" },
        { word: "אוטו", emoji: "🚗", letter: "א" },
        { word: "אבטיח", emoji: "🍉", letter: "א" }
      ],
      "ב": [
        { word: "בננה", emoji: "🍌", letter: "ב" },
        { word: "בית", emoji: "🏠", letter: "ב" },
        { word: "בלון", emoji: "🎈", letter: "ב" }
      ],
      "ג": [
        { word: "גזר", emoji: "🥕", letter: "ג" },
        { word: "גמל", emoji: "🐪", letter: "ג" },
        { word: "גלידה", emoji: "🍦", letter: "ג" }
      ],
      "ד": [
        { word: "דג", emoji: "🐟", letter: "ד" },
        { word: "דבורה", emoji: "🐝", letter: "ד" },
        { word: "דגל", emoji: "🏳️", letter: "ד" }
      ],
      "ה": [
        { word: "הר", emoji: "⛰️", letter: "ה" },
        { word: "היפופוטם", emoji: "🦛", letter: "ה" },
        { word: "הליקופטר", emoji: "🚁", letter: "ה" }
      ],
      "ו": [
        { word: "ורד", emoji: "🌹", letter: "ו" },
        { word: "וילון", emoji: "🪟", letter: "ו" },
        { word: "וופל", emoji: "🧇", letter: "ו" }
      ],
      "ז": [
        { word: "זברה", emoji: "🦓", letter: "ז" },
        { word: "זית", emoji: "🫒", letter: "ז" },
        { word: "זחל", emoji: "🐛", letter: "ז" }
      ],
      "ח": [
        { word: "חתול", emoji: "🐱", letter: "ח" },
        { word: "חלב", emoji: "🥛", letter: "ח" },
        { word: "חלון", emoji: "🪟", letter: "ח" }
      ],
      "ט": [
        { word: "טלה", emoji: "🐑", letter: "ט" },
        { word: "טיל", emoji: "🚀", letter: "ט" },
        { word: "טבעת", emoji: "💍", letter: "ט" }
      ],
      "י": [
        { word: "יד", emoji: "✋", letter: "י" },
        { word: "ים", emoji: "🌊", letter: "י" },
        { word: "יונה", emoji: "🕊️", letter: "י" }
      ],
      "כ": [
        { word: "כדור", emoji: "⚽", letter: "כ" },
        { word: "כובע", emoji: "🧢", letter: "כ" },
        { word: "כיסא", emoji: "🪑", letter: "כ" }
      ],
      "ל": [
        { word: "לב", emoji: "❤️", letter: "ל" },
        { word: "לימון", emoji: "🍋", letter: "ל" },
        { word: "לחם", emoji: "🍞", letter: "ל" }
      ],
      "מ": [
        { word: "מטרייה", emoji: "☂️", letter: "מ" },
        { word: "מכונית", emoji: "🚙", letter: "מ" },
        { word: "מלפפון", emoji: "🥒", letter: "מ" }
      ],
      "נ": [
        { word: "נר", emoji: "🕯️", letter: "נ" },
        { word: "נמר", emoji: "🐯", letter: "נ" },
        { word: "נעל", emoji: "👟", letter: "נ" }
      ],
      "ס": [
        { word: "סוס", emoji: "🐴", letter: "ס" },
        { word: "ספר", emoji: "📘", letter: "ס" },
        { word: "סירה", emoji: "⛵", letter: "ס" }
      ],
      "ע": [
        { word: "עין", emoji: "👁️", letter: "ע" },
        { word: "עוגה", emoji: "🎂", letter: "ע" },
        { word: "עץ", emoji: "🌳", letter: "ע" }
      ],
      "פ": [
        { word: "פרח", emoji: "🌸", letter: "פ" },
        { word: "פיל", emoji: "🐘", letter: "פ" },
        { word: "פטרייה", emoji: "🍄", letter: "פ" }
      ],
      "צ": [
        { word: "צב", emoji: "🐢", letter: "צ" },
        { word: "ציפור", emoji: "🐦", letter: "צ" },
        { word: "צלחת", emoji: "🍽️", letter: "צ" }
      ],
      "ק": [
        { word: "קוף", emoji: "🐒", letter: "ק" },
        { word: "קערה", emoji: "🥣", letter: "ק" },
        { word: "קשת", emoji: "🌈", letter: "ק" }
      ],
      "ר": [
        { word: "רכבת", emoji: "🚂", letter: "ר" },
        { word: "רימון", emoji: "🔴", letter: "ר" },
        { word: "רגל", emoji: "🦵", letter: "ר" }
      ],
      "ש": [
        { word: "שמש", emoji: "☀️", letter: "ש" },
        { word: "שעון", emoji: "⏰", letter: "ש" },
        { word: "שועל", emoji: "🦊", letter: "ש" }
      ],
      "ת": [
        { word: "תות", emoji: "🍓", letter: "ת" },
        { word: "תפוח", emoji: "🍎", letter: "ת" },
        { word: "תיק", emoji: "🎒", letter: "ת" }
      ]
    };

    let currentLetters = [];
    let currentWords = [];
    let score = 0;
    let selectedWordId = null;

    const cardsContainer = document.getElementById("cardsContainer");
    const scoreEl = document.getElementById("score");
    const totalEl = document.getElementById("total");
    const messageEl = document.getElementById("message");
    const selectedWordBox = document.getElementById("selectedWordBox");
    const dropzonesEl = document.getElementById("dropzones");
    const letterActionsEl = document.getElementById("letterActions");
    const subtitleEl = document.getElementById("subtitle");

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function normalizeLetter(value) {
      return (value || "").trim().charAt(0);
    }

    function speakWord(text) {
      if (!("speechSynthesis" in window)) {
        alert("הדפדפן לא תומך בהשמעת קול.");
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "he-IL";
      utterance.rate = 0.85;
      utterance.pitch = 1.05;
      window.speechSynthesis.speak(utterance);
    }

    function showMessage(text, type="") {
      messageEl.textContent = text;
      messageEl.className = "message " + type;
    }

    function getChosenLetters() {
      const letters = [
        normalizeLetter(document.getElementById("letter1").value),
        normalizeLetter(document.getElementById("letter2").value),
        normalizeLetter(document.getElementById("letter3").value)
      ];

      const unique = [...new Set(letters)].filter(Boolean);
      return unique;
    }

    function buildDropzones() {
      dropzonesEl.innerHTML = "";
      currentLetters.forEach(letter => {
        const zone = document.createElement("div");
        zone.className = "dropzone";
        zone.dataset.letter = letter;
        zone.innerHTML = `
          <div class="dropzone-header">
            <span class="letter-badge">${letter}</span>
            <span>מילים שמתחילות ב-${letter}</span>
          </div>
          <div class="dropzone-body" id="zone-${letter}"></div>
        `;

        zone.addEventListener("dragover", (e) => {
          e.preventDefault();
          zone.classList.add("active");
        });

        zone.addEventListener("dragleave", () => {
          zone.classList.remove("active");
        });

        zone.addEventListener("drop", (e) => {
          e.preventDefault();
          zone.classList.remove("active");
          const cardId = e.dataTransfer.getData("text/plain");
          handleDropById(cardId, letter);
        });

        dropzonesEl.appendChild(zone);
      });
    }

    function buildMobileButtons() {
      letterActionsEl.innerHTML = "";
      currentLetters.forEach(letter => {
        const btn = document.createElement("button");
        btn.className = "letter-action-btn";
        btn.textContent = letter;
        btn.dataset.letter = letter;
        btn.addEventListener("click", () => {
          if (selectedWordId === null) {
            showMessage("קודם בחרו מילה", "error");
            return;
          }
          handleDropById(selectedWordId, letter);
        });
        letterActionsEl.appendChild(btn);
      });
    }

    function createCard(item, index) {
      const card = document.createElement("div");
      card.className = "word-card";
      card.draggable = true;
      card.dataset.id = index;
      card.dataset.word = item.word;
      card.dataset.letter = item.letter;

      card.innerHTML = `
        <div class="emoji">${item.emoji}</div>
        <div class="word-text">${item.word}</div>
        <div class="tap-hint">לחץ לשמיעה</div>
      `;

      card.addEventListener("click", () => {
        speakWord(item.word);
        selectedWordId = index;
        selectedWordBox.textContent = `נבחרה מילה: ${item.word}`;
        document.querySelectorAll(".word-card").forEach(c => c.style.outline = "");
        card.style.outline = "5px solid #fbbf24";
      });

      card.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", index);
        card.classList.add("dragging");
      });

      card.addEventListener("dragend", () => {
        card.classList.remove("dragging");
      });

      return card;
    }

    function renderCards() {
      cardsContainer.innerHTML = "";
      currentWords.forEach((item, index) => {
        cardsContainer.appendChild(createCard(item, index));
      });
    }

    function placeMiniCard(item, zoneLetter) {
      const zone = document.getElementById(`zone-${zoneLetter}`);
      const mini = document.createElement("div");
      mini.className = "mini-card";
      mini.textContent = `${item.emoji} ${item.word}`;
      mini.addEventListener("click", () => speakWord(item.word));
      zone.appendChild(mini);
    }

    function updateScore() {
      scoreEl.textContent = score;
      if (score === currentWords.length && currentWords.length > 0) {
        showMessage("כל הכבוד! מיינת את כל המילים נכון! 🎉", "success");
        speakWord("כל הכבוד");
      }
    }

    function handleDropById(cardId, targetLetter) {
      const item = currentWords[cardId];
      const cardEl = document.querySelector(`.word-card[data-id="${cardId}"]`);
      if (!item || !cardEl) return;

      if (item.letter === targetLetter) {
        placeMiniCard(item, targetLetter);
        cardEl.remove();
        score++;
        selectedWordId = null;
        selectedWordBox.textContent = "לא נבחרה מילה";
        showMessage("מצוין! תשובה נכונה 👏", "success");
        updateScore();
      } else {
        showMessage("נסה שוב 😊", "error");
      }
    }

    function resetCurrentGame() {
      if (!currentLetters.length) return;
      score = 0;
      selectedWordId = null;
      scoreEl.textContent = "0";
      selectedWordBox.textContent = "לא נבחרה מילה";
      showMessage("");
      currentWords = shuffle(currentLetters.flatMap(letter => WORD_BANK[letter] || []));
      totalEl.textContent = currentWords.length;

      currentLetters.forEach(letter => {
        const zone = document.getElementById(`zone-${letter}`);
        if (zone) zone.innerHTML = "";
      });

      renderCards();
    }

    function generateGame() {
      const chosen = getChosenLetters();

      if (chosen.length !== 3) {
        alert("נא לבחור 3 אותיות שונות.");
        return;
      }

      const unsupported = chosen.filter(letter => !WORD_BANK[letter]);
      if (unsupported.length) {
        alert("אין עדיין מילים עבור האותיות: " + unsupported.join(" , "));
        return;
      }
    }

    function randomLetters() {
      const allLetters = Object.keys(WORD_BANK);
      const shuffled = shuffle(allLetters).slice(0, 3);
      document.getElementById("letter1").value = shuffled[0];
      document.getElementById("letter2").value = shuffled[1];
      document.getElementById("letter3").value = shuffled[2];
      generateGame();
    }

    document.getElementById("generateBtn").addEventListener("click", generateGame);
    document.getElementById("randomBtn").addEventListener("click", randomLetters);
    document.getElementById("resetBtn").addEventListener("click", resetCurrentGame);

    document.getElementById("speakAllBtn").addEventListener("click", async () => {
      for (const item of currentWords) {
        speakWord(item.word);
        await new Promise(resolve => setTimeout(resolve, 1400));
      }
    });

    ["letter1","letter2","letter3"].forEach(id => {
      document.getElementById(id).addEventListener("input", (e) => {
        e.target.value = normalizeLetter(e.target.value);
      });
    });

    generateGame();
  </script>
</body>
</html>
