<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לומדים תנ"ך בכיף - ספר בראשית</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rubik', sans-serif; background-color: #f0f9ff; }
        .game-btn { transition: all 0.2s; }
        .game-btn:active { transform: scale(0.95); }
        
        /* עיצוב Select להשלמת מילים */
        select.cloze-select {
            background-color: #ffffff;
            border: 2px solid #7c3aed;
            color: #4c1d95;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: bold;
            margin: 0 5px;
            cursor: pointer;
            font-family: 'Rubik', sans-serif;
            font-size: 1rem;
        }
        select.cloze-select:focus { outline: none; box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.3); }
        
        .correct-answer { background-color: #dcfce7 !important; border-color: #16a34a !important; color: #16a34a !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #ef4444 !important; }

        /* הגדרות להדפסה בלבד */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background-color: white; }
            .print-line { border-bottom: 1px solid #000; height: 35px; margin-top: 5px; }
            .avoid-break { page-break-inside: avoid; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col items-center">

    <div id="app" class="w-full max-w-3xl p-4 no-print">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-purple-600 mb-2">✨ לומדים למבחן בתנ"ך ✨</h1>
            <p class="text-lg text-gray-600">פרקים כ"ח, כ"ט, ל"א</p>
        </header>

        <nav class="grid grid-cols-2 gap-3 mb-6">
            <button onclick="startSection('cloze')" class="game-btn bg-blue-100 hover:bg-blue-200 text-blue-800 p-3 rounded-xl font-bold border-2 border-blue-300">📖 השלמת סיפור</button>
            <button onclick="startSection('trivia')" class="game-btn bg-green-100 hover:bg-green-200 text-green-800 p-3 rounded-xl font-bold border-2 border-green-300">🧠 ידע כללי</button>
            <button onclick="startSection('who')" class="game-btn bg-yellow-100 hover:bg-yellow-200 text-yellow-800 p-3 rounded-xl font-bold border-2 border-yellow-300">👤 מי אני?</button>
            <button onclick="startSection('values')" class="game-btn bg-pink-100 hover:bg-pink-200 text-pink-800 p-3 rounded-xl font-bold border-2 border-pink-300">💡 מסרים וביטויים</button>
        </nav>
        
        <button onclick="printTest()" class="w-full game-btn bg-gray-800 text-white p-3 rounded-xl font-bold mb-6 shadow-lg">🖨️ הדפסת מבחן לדוגמה</button>

        <main id="game-area" class="bg-white p-6 rounded-2xl shadow-xl min-h-[400px] relative border-t-4 border-purple-500">
            <div id="welcome-msg" class="text-center py-10">
                <p class="text-xl font-medium">בחרי פעילות למעלה כדי להתחיל! בהצלחה! 💖</p>
                <div class="text-7xl mt-6 animate-bounce">👩‍🏫</div>
            </div>
            
            <div id="dynamic-content"></div>
        </main>
    </div>

    <div id="print-area" class="print-only p-8 max-w-4xl mx-auto"></div>

    <script>
        // --- מאגר הנתונים ---
        
const clozeData = [
            {
                chapter: "פרק כ'ח - חלום יעקב",
                text: "יעקב יצא מבאר שבע והלך ל___. בלילה הוא חלם על ___ שראשו בשמיים ו___ עולים ויורדים בו. ה' הבטיח לתת לו את הארץ ולשמור עליו. בבוקר יעקב לקח את האבן, הפך אותה ל___ (אבן זיכרון) וקרא למקום ___. הוא נדר שאם יחזור בשלום, הוא יתן לה' ___ מכל מה שיהיה לו.",
                words: ["חרן", "סולם", "מלאכים", "מצבה", "בית אל", "מעשר"]
            },
            {
                chapter: "פרק כ'ט - המפגש והחתונה",
                text: "ליד הבאר חיכו שלושה עדרי צאן כי האבן הייתה ___. יעקב ראה את רחל, קיבל כוח וגלל את האבן לבד. הוא עבד אצל לבן ___ שנים כדי להתחתן איתה, והן עברו לו מהר 'כ___ אחדים' בגלל אהבתו. בחתונה לבן רימה אותו ונתן לו את ___, בטענה שלא נותנים את ה___ לפני הבכירה.",
                words: ["כבדה", "שבע", "ימים", "לאה", "צעירה"]
            },
            {
                chapter: "פרק ל'א - הבריחה והברית",
                text: "אחרי ___ שנה בבית לבן, יעקב ברח. רחל גנבה את ה___ של אביה והחביאה אותם בכרה ה___. לבן רדף אחריו אבל ה' הזהיר אותו בחלום. בסוף הם כרתו ברית בהר ה___ והבטיחו שיהיה ביניהם ___ ולא יפגעו זה בזה.",
                words: ["עשרים", "תרפים", "גמל", "גלעד", "שלום"]
            }
        ];
const triviaQuestions = [
            { q: "לאן ברח יעקב מפני עשו?", a: "לחרן (לבית לבן)", options: ["למצרים", "למדבר", "לחרן (לבית לבן)", "לירושלים"] },
            { q: "מה עשה יעקב עם האבן בבוקר?", a: "הפך אותה למצבה ושפך שמן", options: ["זרק אותה", "בנה ממנה כיסא", "הפך אותה למצבה ושפך שמן", "לקח אותה בתיק"] },
            { q: "כמה שנים עבד יעקב עבור רחל (בפעם הראשונה)?", a: "7 שנים", options: ["שנה אחת", "7 שנים", "14 שנים", "חודש אחד"] },
            { q: "מהו השם השני של המקום 'לוז'?", a: "בית אל", options: ["בית לחם", "ירושלים", "בית אל", "חברון"] },
            { q: "מה הבטיח יעקב בנדר שלו?", a: "לתת מעשר (עשירית) לה'", options: ["לבנות ארמון", "לתת מעשר (עשירית) לה'", "לא לחזור הביתה", "לכתוב ספר"] },
            { q: "מדוע הרועים חיכו ליד הבאר?", a: "כי האבן הייתה כבדה מדי", options: ["כי הם היו עייפים", "כי לא היו מים", "כי האבן הייתה כבדה מדי", "הם חיכו ליעקב"] },
            { q: "מה הייתה התרמית (הרמאות) של לבן?", a: "החליף את רחל בלאה בחתונה", options: ["לא נתן אוכל ליעקב", "החליף את רחל בלאה בחתונה", "גנב את הכבשים", "לא נתן לו לישון"] },
            { q: "מדוע יעקב ברח מלבן בלי להגיד?", a: "הוא פחד שלבן לא ייתן לו ללכת", options: ["כי הוא גנב כסף", "הוא פחד שלבן לא ייתן לו ללכת", "כי נמאס לו לעבוד", "סתם ככה"] },
            { q: "איפה רחל החביאה את התרפים?", a: "בכרה הגמל (מתחת לאוכף)", options: ["בכיס השמלה", "בכרה הגמל (מתחת לאוכף)", "מתחת לאבן", "בתוך האוהל"] },
            { q: "מה אלוהים אמר ללבן בחלום?", a: "לא לדבר עם יעקב מטוב ועד רע", options: ["להחזיר את הבנות", "לא לדבר עם יעקב מטוב ועד רע", "לתת ליעקב מתנה", "לחזור הביתה מיד"] },
            { q: "איך קיבל לבן את יעקב כשנפגשו לראשונה?", a: "רץ לקראתו, חיבק ונישק אותו", options: ["גירש אותו מהבית", "רץ לקראתו, חיבק ונישק אותו", "ביקש ממנו כסף", "שלח את בניו להילחם בו"] },
            { q: "איך הגיבו רחל ולאה כשיעקב הציע לברוח?", a: "הסכימו ואמרו שלא קיבלו ירושה מאביהן", options: ["כעסו עליו", "הסכימו ואמרו שלא קיבלו ירושה מאביהן", "פחדו להצטרף", "רצו להישאר בחרן"] },
	      { q: "כמה פעמים החליף לבן את המשכורת של יעקב (לפי דברי יעקב)?", a: "10 פעמים ('עשרת מונים')", options: ["פעם אחת", "10 פעמים ('עשרת מונים')", "7 פעמים", "הוא לא החליף אף פעם"] },
            { q: "כמה שנים בסך הכל היה יעקב בבית לבן?", a: "20 שנה", options: ["7 שנים", "14 שנה", "20 שנה", "40 שנה"] },
            { q: "מה ראה יעקב בחלום?", a: "סולם שמלאכים עולים ויורדים בו", options: ["את הבית שלו", "סולם שמלאכים עולים ויורדים בו", "כבשים רבות", "את עשו רודף אחריו"] }
        ];

        const whoQuestions = [
            { q: "אמרתי: 'לא ייעשה כן במקומנו, לתת הצעירה לפני הבכירה'", a: "לבן" },
            { q: "חלמתי על סולם ומלאכים", a: "יעקב" },
            { q: "לקחתי (גנבתי) את התרפים של אבא שלי", a: "רחל" },
            { q: "היו לי עיניים רכות", a: "לאה" },
            { q: "רדפתי אחרי יעקב עד הר הגלעד", a: "לבן" },
            { q: "גללתי את האבן הכבדה מעל פי הבאר לבד", a: "יעקב" },
            { q: "הזהרתי את לבן בחלום הלילה לא לפגוע ביעקב", a: "אלוהים" },
            { q: "באתי לבאר עם הצאן כי אני רועה", a: "רחל" }
        ];
        
        const valueQuestions = [
            { q: "מה לומדים מההשוואה בין יעקב לרועים ליד הבאר?", a: "שיעקב חרוץ ויוזם, והרועים מחכים לאחרים", options: ["שיעקב חזק יותר פיזית", "שיעקב חרוץ ויוזם, והרועים מחכים לאחרים", "שהרועים חכמים יותר", "שאין הבדל ביניהם"] },
            { q: "מה מלמד הפסוק: 'ויהיו בעיניו כימים אחדים באהבתו אותה'?", a: "כשפועלים מתוך אהבה, הזמן עובר מהר", options: ["שיעקב לא ידע לחשב זמן", "שהעבודה הייתה קלה מאוד", "כשפועלים מתוך אהבה, הזמן עובר מהר", "שלבן רימה אותו בשעות"] },
            { q: "מה המשמעות של הביטוי 'מידה כנגד מידה' בסיפור?", a: "יעקב רימה את אביו, ולבן רימה את יעקב בחתונה", options: ["לבן נתן ליעקב מתנות", "יעקב רימה את אביו, ולבן רימה את יעקב בחתונה", "רחל גנבה תרפים", "יעקב עבד קשה"] },
            { q: "מה מסמל הסולם בחלום יעקב?", a: "את הקשר בין השמיים לארץ (תפילה)", options: ["כלי עבודה לבנייה", "דרך לברוח מהר", "את הקשר בין השמיים לארץ (תפילה)", "סולם לטיפוס על עצים"] },
            { q: "מה מלמד אותנו יעקב כשהוא עובד אצל לבן?", a: "חריצות ויושר ('בכל כוחי עבדתי')", options: ["שכדאי להיות ערמומי", "חריצות ויושר ('בכל כוחי עבדתי')", "שצריך לנוח הרבה", "שכדאי לבקש כסף"] },
            { q: "מה המשמעות של השם 'בית אל'?", a: "בית האלוהים - מקום קדוש", options: ["הבית של יעקב", "בית האלוהים - מקום קדוש", "בית לחם", "בית ספר"] },
            { q: "מה מסמלת המצבה שיעקב הקים?", a: "זיכרון למפגש עם ה'", options: ["סימן דרך לא ללכת לאיבוד", "זיכרון למפגש עם ה'", "שולחן לאוכל", "גדר לצאן"] },
            { q: "מה הייתה המטרה של הברית בגלעד?", a: "לקבוע גבול של שלום בין יעקב ללבן", options: ["להתחיל מלחמה", "לקבוע גבול של שלום בין יעקב ללבן", "שילדים ישחקו שם", "לבנות בית חדש"] }
        ];

        const characters = ["יעקב", "רחל", "לאה", "לבן", "אלוהים", "עשו", "יצחק"];

        // --- לוגיקה ---

        let currentSection = '';
        let currentIdx = 0;
        let score = 0;
        let currentShuffledOptions = []; // כדי למנוע בעיות עם גרשיים

        function startSection(section) {
            currentSection = section;
            currentIdx = 0;
            score = 0;
            document.getElementById('welcome-msg').classList.add('hidden');
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('dynamic-content');
            container.innerHTML = '';
            container.className = ""; 

            if (currentSection === 'cloze') renderCloze(container);
            else if (currentSection === 'trivia') renderQuiz(container, triviaQuestions);
            else if (currentSection === 'who') renderWho(container);
            else if (currentSection === 'values') renderQuiz(container, valueQuestions);
        }

        // --- לוגיקה להשלמת סיפור (Select Box) ---
        function renderCloze(container) {
            if (currentIdx >= clozeData.length) {
                showFinishScreen(container, "סיימת את כל הסיפורים! אלופה! 📚");
                return;
            }

            const data = clozeData[currentIdx];
            let html = `<div class="text-center w-full max-w-2xl mx-auto">`;
            html += `<h2 class="text-2xl font-bold mb-6 text-purple-700 underline">${data.chapter}</h2>`;
            html += `<p class="mb-4 text-sm text-gray-500">הוראות: בחרי את המילה הנכונה מתוך הרשימה בכל תיבה.</p>`;
            
            // הכנת רשימת אפשרויות לכל תיבה (מערבבים את המילים של הפרק הנוכחי)
            const optionsList = [...data.words].sort(() => Math.random() - 0.5);
            let optionsHtml = `<option value="">בחרי...</option>`;
            optionsList.forEach(w => {
                optionsHtml += `<option value="${w}">${w}</option>`;
            });

            // בניית הטקסט
            let textHtml = data.text;
            let counter = 0;
            // נחליף כל קו תחתון בתיבת בחירה
            // אנו מניחים שהסדר של words תואם את סדר ההופעה בטקסט
            
            // שיטה בטוחה להחלפה סדרתית
            data.words.forEach((correctWord, i) => {
                 textHtml = textHtml.replace("___", `
                    <select id="cloze-${i}" class="cloze-select" data-correct="${correctWord}">
                        ${optionsHtml}
                    </select>
                 `);
            });

            html += `<div class="bg-blue-50 p-6 rounded-xl text-xl leading-loose mb-8 text-right shadow-inner">${textHtml}</div>`;
            
            html += `<div class="mt-8 text-center"><button onclick="checkCloze()" class="bg-purple-600 text-white px-8 py-3 rounded-full text-xl font-bold shadow-lg hover:bg-purple-700 transform hover:scale-105 transition">בדיקה ✅</button></div>`;
            html += `<p id="feedback" class="text-center mt-4 text-xl font-bold min-h-[30px]"></p>`;
            html += `</div>`;

            container.innerHTML = html;
        }

        function checkCloze() {
            const currentData = clozeData[currentIdx];
            let allCorrect = true;
            let selects = document.querySelectorAll('.cloze-select');
            
            selects.forEach(select => {
                const userVal = select.value;
                const correctVal = select.getAttribute('data-correct');
                
                select.classList.remove('correct-answer', 'wrong-answer');
                
                if (userVal === correctVal) {
                    select.classList.add('correct-answer');
                } else {
                    select.classList.add('wrong-answer');
                    allCorrect = false;
                }
            });

            const feedbackEl = document.getElementById('feedback');
            if (allCorrect) {
                feedbackEl.innerText = "כל הכבוד! צדקת בהכל! 🎉";
                feedbackEl.className = "text-center mt-4 text-xl font-bold text-green-600";
                setTimeout(() => {
                    currentIdx++;
                    renderContent();
                }, 2000);
            } else {
                feedbackEl.innerText = "יש טעויות, נסי לתקן את האדומים... 💪";
                feedbackEl.className = "text-center mt-4 text-xl font-bold text-red-500";
            }
        }

        // --- פונקציות טריוויה וערכים (תוקן הבאג עם הגרשיים) ---
        
        function renderQuiz(container, questionsArray) {
            if (currentIdx >= questionsArray.length) {
                showFinishScreen(container, `סיימת! ענית נכון על ${score} מתוך ${questionsArray.length} שאלות!`);
                return;
            }
            const q = questionsArray[currentIdx];
            
            // שמירת האפשרויות המעורבבות במשתנה גלובלי כדי לגשת אליהן לפי אינדקס (מונע באגים של גרשיים)
            currentShuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            let html = `<div class="w-full max-w-lg mx-auto">`;
            html += `<div class="mb-4 text-gray-500 text-sm font-bold">שאלה ${currentIdx + 1} מתוך ${questionsArray.length}</div>`;
            html += `<h2 class="text-2xl font-bold mb-6 text-center leading-relaxed">${q.q}</h2>`;
            html += `<div class="space-y-3" id="options-container">`;
            
            // יצירת הכפתורים - מעבירים רק את האינדקס לפונקציה!
            currentShuffledOptions.forEach((opt, index) => {
                html += `<button onclick="handleTriviaClick(this, ${index})" class="w-full text-right bg-white border-2 border-gray-200 p-4 rounded-xl hover:bg-blue-50 text-lg transition-colors font-medium">${opt}</button>`;
            });
            
            html += `</div>`;
            html += `<p id="quiz-feedback" class="text-center mt-6 text-xl font-bold h-8"></p>`;
            html += `<div class="text-center mt-4"><button id="next-btn" onclick="nextQuestion()" class="hidden bg-blue-600 text-white px-8 py-2 rounded-full font-bold shadow-md">לשאלה הבאה ⬅️</button></div></div>`;
            container.innerHTML = html;
        }

        function handleTriviaClick(btnElement, optionIndex) {
            // בדיקה אם כבר ענו כדי למנוע לחיצות כפולות
            if (document.getElementById('next-btn').classList.contains('inline-block')) return;

            // שליפת השאלה הנוכחית לפי סוג החלק
            let qArray = currentSection === 'trivia' ? triviaQuestions : valueQuestions;
            let currentQ = qArray[currentIdx];
            
            // בדיקת התשובה
            const selectedText = currentShuffledOptions[optionIndex];
            const correctText = currentQ.a;
            
            const feedback = document.getElementById('quiz-feedback');
            
            if (selectedText === correctText) {
                btnElement.classList.remove('bg-white', 'border-gray-200');
                btnElement.classList.add('bg-green-100', 'border-green-500');
                feedback.innerText = "תשובה נכונה! כל הכבוד! 👏";
                feedback.className = "text-center mt-6 text-xl font-bold text-green-600";
                score++;
            } else {
                btnElement.classList.remove('bg-white', 'border-gray-200');
                btnElement.classList.add('bg-red-100', 'border-red-500');
                feedback.innerText = "אופס... התשובה הנכונה היא: " + correctText;
                feedback.className = "text-center mt-6 text-xl font-bold text-red-500";
            }
            
            document.getElementById('next-btn').classList.remove('hidden');
            document.getElementById('next-btn').classList.add('inline-block');
        }

        function nextQuestion() {
            currentIdx++;
            renderContent();
        }

        // --- מי אני (תוקן הבאג עם הגרשיים) ---
        function renderWho(container) {
             if (currentIdx >= whoQuestions.length) {
                showFinishScreen(container, `סיימת את חידון הדמויות! כל הכבוד!`);
                return;
            }
            if (currentIdx === 0) whoQuestions.sort(() => Math.random() - 0.5);

            const q = whoQuestions[currentIdx];
            let html = `<div class="text-center w-full max-w-2xl mx-auto">`;
            html += `<div class="mb-4 text-gray-500 text-sm">חידה ${currentIdx + 1}</div>`;
            html += `<h2 class="text-3xl font-bold mb-10 text-purple-800 leading-normal">" ${q.q} "</h2>`;
            html += `<div class="grid grid-cols-2 md:grid-cols-4 gap-4">`;
            
            // כאן אין בעיה של גרשיים כי הדמויות הן מילים פשוטות, אבל ליתר ביטחון נשתמש בגישה בטוחה
            characters.forEach(char => {
                // escape single quotes just in case, though characters array is safe currently
                const safeChar = char.replace(/'/g, "\\'"); 
                const safeAnswer = q.a.replace(/'/g, "\\'");
                html += `<button onclick="checkWhoAnswer(this, '${safeChar}', '${safeAnswer}')" class="bg-yellow-50 border-2 border-yellow-300 p-4 rounded-xl font-bold hover:bg-yellow-200 text-lg shadow-sm transition transform hover:-translate-y-1">${char}</button>`;
            });
            html += `</div>`;
            html += `<p id="who-feedback" class="mt-8 text-xl font-bold min-h-[30px]"></p>`;
            html += `</div>`;
            container.innerHTML = html;
        }

        function checkWhoAnswer(btn, selected, correct) {
             // מניעת לחיצות חוזרות
             if (btn.parentElement.getAttribute('data-locked') === 'true') return;

             const feedback = document.getElementById('who-feedback');
             if (selected === correct) {
                 feedback.innerText = "נכון מאוד! 🌟";
                 feedback.className = "mt-6 text-xl font-bold text-green-600";
                 btn.parentElement.setAttribute('data-locked', 'true');
                 setTimeout(() => {
                     currentIdx++;
                     renderContent();
                 }, 1500);
             } else {
                 feedback.innerText = "לא בדיוק, נסי שוב... 🤔";
                 feedback.className = "mt-6 text-xl font-bold text-red-500";
             }
        }

        function showFinishScreen(container, msg) {
            container.innerHTML = `
                <div class="text-center py-10">
                    <h2 class="text-6xl mb-6">🏆</h2>
                    <p class="text-2xl font-bold mb-8 text-purple-800">${msg}</p>
                    <button onclick="location.reload()" class="bg-purple-600 text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-purple-700">חזרה להתחלה</button>
                </div>
            `;
        }

        // --- הדפסה (ללא שינוי, עובד טוב) ---
        function printTest() {
            const printArea = document.getElementById('print-area');
            let html = `
                <div class="text-center mb-6 border-b-2 border-black pb-4">
                    <h1 class="text-2xl font-bold">מבחן בתנ"ך - ספר בראשית (פרקים כ"ח, כ"ט, ל"א)</h1>
                    <p class="mt-2 text-lg">שם התלמידה: ___________________    |    תאריך: ___________________</p>
                </div>
            `;

            // חלק א: שאלות אמריקאיות
            html += `<h3 class="text-xl font-bold mb-3 underline">חלק א': הקיפי את התשובה הנכונה (40 נקודות)</h3>`;
            const mixedTrivia = [...triviaQuestions, ...valueQuestions].sort(() => 0.5 - Math.random()).slice(0, 10);
            mixedTrivia.forEach((q, idx) => {
                html += `<div class="mb-4 avoid-break">
                    <p class="font-bold text-lg">${idx+1}. ${q.q}</p>
                    <div class="mr-4 mt-1 grid grid-cols-2 gap-2 text-sm">
                        ${q.options.map(opt => `<span>⚪ ${opt}</span>`).join('')}
                    </div>
                </div>`;
            });

            // חלק ב: מי אמר למי
            html += `<h3 class="text-xl font-bold mt-6 mb-3 underline">חלק ב': מי אני? (20 נקודות)</h3>`;
            html += `<div class="bg-gray-100 p-2 mb-4 text-center text-sm border border-black font-bold">מחסן דמויות: ${characters.join('  |  ')}</div>`;
            const mixedWho = [...whoQuestions].sort(() => 0.5 - Math.random()).slice(0, 5);
            mixedWho.forEach((q, idx) => {
                html += `<div class="mb-3 flex items-center text-lg avoid-break">
                    <span class="ml-2 w-8">${idx+1}.</span>
                    <span class="ml-2">"${q.q}"</span>
                    <span class="flex-grow border-b-2 border-dotted border-black h-6"></span>
                </div>`;
            });

            // חלק ג: השלמת משפטים
            html += `<h3 class="text-xl font-bold mt-6 mb-3 underline">חלק ג': השלימי את המילים החסרות (15 נקודות)</h3>`;
            const sentences = [
                {t: "יעקב חלם על סולם שראשו מגיע ל______.", a: "שמיים"},
                {t: "יעקב קרא למקום החלום בשם ______.", a: "בית אל"},
                {t: "רחל הגיעה לבאר כי היא הייתה ______.", a: "רועה"},
                {t: "לבן אמר: 'לא יעשה כן במקומנו לתת הצעירה לפני ה______'.", a: "בכירה"},
                {t: "יעקב ולבן כרתו ברית בהר ה______.", a: "גלעד"}
            ];
            html += `<div class="bg-gray-100 p-2 mb-4 text-center text-sm border border-black font-bold">מחסן מילים: בכירה | רועה | שמיים | גלעד | בית אל</div>`;
            sentences.forEach((s, idx) => {
                html += `<div class="mb-3 text-lg avoid-break">${idx+1}. ${s.t.replace('______', '______________')}</div>`;
            });

            // חלק ד: שאלות פתוחות
            html += `<h3 class="text-xl font-bold mt-8 mb-4 underline">חלק ד': שאלות פתוחות (25 נקודות)</h3>`;
            const openQuestions = [
                "מדוע יעקב בכה כאשר הוא פגש את רחל ליד הבאר?",
                "מה הבטיח אלוהים ליעקב בחלום הסולם?",
                "הסבירי את הביטוי: 'ויהיו בעיניו כימים אחדים'. על מי הוא נאמר ולמה?",
                "מדוע ברח יעקב מבית לבן בלי להגיד שלום?",
                "מה ההבדל בין ההתנהגות של יעקב ליד הבאר להתנהגות הרועים?",
                "מה היה הנדר שנדר יעקב אחרי שהתעורר מהחלום בבית אל?",
                "למה רחל גנבה את התרפים (לדעתך או לפי הסיפור)?",
                "מה הייתה הרמאות של לבן בליל החתונה?",
                "מה סימלה הקמת ה'מצבה' על ידי יעקב בבוקר?",
                "בסוף פרק ל'א, יעקב ולבן כורתים ברית. מה הם מבטיחים אחד לשני?"
            ];
            
            openQuestions.forEach((q, idx) => {
                html += `<div class="mb-4 avoid-break">
                    <p class="font-bold text-lg mb-1">${idx+1}. ${q}</p>
                    <div class="print-line"></div>
                    <div class="print-line"></div>
                </div>`;
            });

            html += `<div class="text-center mt-8 font-bold text-2xl">בהצלחה רבה! ❤️</div>`;

            printArea.innerHTML = html;
            setTimeout(() => {
                window.print();
            }, 500);
        }
    </script>
</body>
</html>
