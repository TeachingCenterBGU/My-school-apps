<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>משחק הזיכרון - אותיות ומילים</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0f7fa;
            text-align: center;
            margin: 0;
            padding: 10px;
            user-select: none;
        }

        /* סרגל עליון */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px; 
            margin: 0 auto 10px;
        }

        h1 { color: #006064; margin: 0; font-size: 1.8em; }

        /* כפתור רמקול */
        #sound-toggle {
            background: white;
            border: 2px solid #00acc1;
            color: #00838f;
            font-size: 1.5em;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center; justify-content: center;
        }
        #sound-toggle.sound-on {
            background: #00acc1; color: white;
        }

        /* כפתורי רמות */
        .levels {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .level-btn {
            background: white;
            border: 2px solid #00acc1;
            color: #00838f;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .level-btn.active {
            background: #00acc1;
            color: white;
            font-weight: bold;
            transform: scale(1.05);
        }

        /* לוח המשחק */
        .game-board {
            display: grid;
            gap: 15px; 
            margin: 0 auto;
            perspective: 1000px;
        }

        /* הקלף */
        .card {
            background-color: white;
            border-radius: 15px;
            aspect-ratio: 1;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s, box-shadow 0.3s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        /* קלפים תואמים */
        .card.matched {
            transform: rotateY(180deg);
            cursor: default;
            box-shadow: 0 0 15px #ffd700, inset 0 0 10px rgba(255,215,0,0.5);
            border: 3px solid #ffd700;
            animation: pulse 1s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.05); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        /* הצדדים */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
        }

        .front {
            background: linear-gradient(135deg, #4dd0e1, #00acc1);
            font-size: 3em; 
            color: white;
        }
        .front::after { content: "❓"; }

        .back {
            background-color: #fff;
            border: 2px solid transparent;
            transform: rotateY(180deg);
            font-size: 3.5em;
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background: #ff7043;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        #celebration {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.98);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 100;
            font-size: 2em;
            border: 4px solid #ffd700;
        }
        
        .next-level-btn {
            margin-top: 20px;
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button id="sound-toggle" class="sound-on" title="הפעל/השתק הקראה">🔊</button>
        <h1>משחק אותיות ומילים 🎉</h1>
    </div>

    <div class="levels">
        <button class="level-btn" onclick="startGame(4)">4 זוגות</button>
        <button class="level-btn" onclick="startGame(8)">8 זוגות</button>
        <button class="level-btn" onclick="startGame(16)">16 קלפים</button>
        <button class="level-btn" onclick="startGame(20)">20 קלפים</button>
        <button class="level-btn" onclick="startGame(99)">הכל יחד!</button>
    </div>

    <div class="game-board" id="board"></div>

    <div id="celebration">
        כל הכבוד! אלופה! 🏆<br>
        <button class="next-level-btn" onclick="startNextLevel()">לשלב הבא! ➡️</button>
    </div>

    <br>
    <a href="index.html" class="back-btn">חזרה למסך הראשי</a>

    <audio id="success-sound" src="https://actions.google.com/sounds/v1/cartoon/pop.ogg"></audio>

    <script>
        // מאגר הנתונים של המשחק: חיבור בין אות, אימוג'י והקלטות
        const gameData = {
            'א': { emoji: '🦁', letterAudio: 'Aleph1.mp3', wordAudio: 'aryeh.mp3' },
            'ב': { emoji: '🦆', letterAudio: 'beit.mp3', wordAudio: 'barvaz.mp3' },
            'ג': { emoji: '🐪', letterAudio: 'gimel_1.mp3', wordAudio: 'gamal.mp3' },
            'ד': { emoji: '🐻', letterAudio: 'dalet_1.mp3', wordAudio: 'dov.mp3' },
            'ה': { emoji: '⛰️', letterAudio: 'hei_1.mp3', wordAudio: 'har.mp3' },
            'ו': { emoji: '🌹', letterAudio: 'vav_1.mp3', wordAudio: 'vered.mp3' },
            'ז': { emoji: '🦓', letterAudio: 'zain_1.mp3', wordAudio: 'zebra.mp3' },
            'ח': { emoji: '🐱', letterAudio: 'chet_1.mp3', wordAudio: 'chatul.mp3' },
            'ט': { emoji: '🚜', letterAudio: 'tet.mp3', wordAudio: 'traktor.mp3' },
            'י': { emoji: '🦉', letterAudio: 'yud.mp3', wordAudio: 'yanshuf.mp3' },
            'כ': { emoji: '🐶', letterAudio: 'chaf_1.mp3', wordAudio: 'kelev.mp3' },
            'ל': { emoji: '🤡', letterAudio: 'lamed.mp3', wordAudio: 'leitzan.mp3' },
            'מ': { emoji: '🚗', letterAudio: 'mem_1.mp3', wordAudio: 'mechonit.mp3' },
            'נ': { emoji: '🐍', letterAudio: 'nun.mp3', wordAudio: 'nachash.mp3' },
            'ס': { emoji: '🐴', letterAudio: 'samech.mp3', wordAudio: 'sus.mp3' },
            'ע': { emoji: '🐭', letterAudio: 'ain.mp3', wordAudio: 'achbar.mp3' },
            'פ': { emoji: '🐘', letterAudio: 'peh_1.mp3', wordAudio: 'pil.mp3' },
            'צ': { emoji: '🐢', letterAudio: 'tzadik_1.mp3', wordAudio: 'tzav.mp3' },
            'ק': { emoji: '🐵', letterAudio: 'kuf.mp3', wordAudio: 'kof.mp3' },
            'ר': { emoji: '🚂', letterAudio: 'reish.mp3', wordAudio: 'rakevet.mp3' },
            'ש': { emoji: '☀️', letterAudio: 'shin.mp3', wordAudio: 'shemesh.mp3' },
            'ת': { emoji: '🍎', letterAudio: 'taf_1.mp3', wordAudio: 'tapuach.mp3' },
        };

        const colors = ['#d32f2f', '#1976d2', '#388e3c', '#fbc02d', '#8e24aa', '#e64a19', '#5d4037', '#00796b', '#f57c00'];
        const levelsOrder = [4, 8, 16, 20, 99];
        let currentLevelIndex = 0; 

        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let matchedCount = 0;
        let totalPairs = 0;
        let isSoundOn = true; 

        function playCardSound(filename) {
            if (!isSoundOn || !filename) return;
            const audio = new Audio('letters/' + filename);
            audio.play().catch(e => console.log("Audio play error:", e));
        }

        const soundToggleBtn = document.getElementById('sound-toggle');
        soundToggleBtn.addEventListener('click', () => {
            isSoundOn = !isSoundOn;
            soundToggleBtn.classList.toggle('sound-on', isSoundOn);
            soundToggleBtn.textContent = isSoundOn ? '🔊' : '🔇';
        });

        function startGame(numCards) {
            currentLevelIndex = levelsOrder.indexOf(numCards);
            
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = Array.from(document.querySelectorAll('.level-btn')).find(b => b.textContent.includes(numCards) || (numCards===99 && b.textContent.includes("הכל")));
            if(activeBtn) activeBtn.classList.add('active');

            const board = document.getElementById('board');
            board.innerHTML = '';
            document.getElementById('celebration').style.display = 'none';
            matchedCount = 0;
            hasFlippedCard = false;
            lockBoard = false;

            const allKeys = Object.keys(gameData);
            let selectedKeys = [];
            
            if (numCards === 99) {
                selectedKeys = [...allKeys];
            } else {
                let tempKeys = [...allKeys];
                const pairsNeeded = numCards / 2;
                for (let i = 0; i < pairsNeeded; i++) {
                    const randomIndex = Math.floor(Math.random() * tempKeys.length);
                    selectedKeys.push(tempKeys[randomIndex]);
                    tempKeys.splice(randomIndex, 1);
                }
            }

            totalPairs = selectedKeys.length;
            let deck = [];

            // יצירת הקלפים: אחד לאות ואחד לאימוג'י לכל זוג
            selectedKeys.forEach(key => {
                const color = colors[Math.floor(Math.random() * colors.length)];
                const data = gameData[key];
                
                // קלף אות
                deck.push({
                    matchKey: key,
                    display: key,
                    audioFile: data.letterAudio,
                    color: color
                });
                
                // קלף אימוג'י
                deck.push({
                    matchKey: key,
                    display: data.emoji,
                    audioFile: data.wordAudio,
                    color: color
                });
            });

            // ערבוב הקלפים
            deck.sort(() => 0.5 - Math.random());

            let columns = 4;
            let maxWidth = '1000px'; 

            if (numCards === 4) { columns = 2; maxWidth = '400px'; }
            if (numCards === 8) { columns = 4; maxWidth = '700px'; }
            if (numCards === 16) { columns = 4; maxWidth = '700px'; }
            if (numCards === 20) { columns = 5; maxWidth = '850px'; }
            if (numCards === 99) { columns = 9; maxWidth = '1200px'; }

            if (window.innerWidth < 600) {
                 maxWidth = '100%'; 
                 if (numCards > 8) columns = 4;
                 if (numCards > 20) columns = 4; 
            }

            board.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
            board.style.maxWidth = maxWidth;

            deck.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.matchKey = item.matchKey;
                card.dataset.audioFile = item.audioFile;
                
                const frontFace = document.createElement('div');
                frontFace.classList.add('front');

                const backFace = document.createElement('div');
                backFace.classList.add('back');
                backFace.textContent = item.display;
                backFace.style.color = item.color;
                backFace.style.borderColor = item.color;

                card.appendChild(frontFace);
                card.appendChild(backFace);

                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function startNextLevel() {
            if (currentLevelIndex < levelsOrder.length - 1) {
                currentLevelIndex++;
                startGame(levelsOrder[currentLevelIndex]);
            } else {
                currentLevelIndex = 0;
                startGame(levelsOrder[0]);
            }
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flipped');
            playCardSound(this.dataset.audioFile);

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.matchKey === secondCard.dataset.matchKey;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            if (isSoundOn) {
                setTimeout(() => {
                     document.getElementById('success-sound').play();
                }, 400);
            }

            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            
            matchedCount++;
            if (matchedCount === totalPairs) {
                setTimeout(() => {
                    document.getElementById('celebration').style.display = 'block';
                }, 800);
            }

            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1200);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        startGame(4);
    </script>
</body>
</html>
