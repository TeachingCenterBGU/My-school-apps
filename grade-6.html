    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כיתה ו' - כאן לומדות ולומדים</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .section-divider { padding: 0 14px; margin-bottom: 12px; }
        .section-divider-line { border: 0; border-top: 1px dashed #ddd; margin: 0; }
        .section-divider-label { font-size: 0.8em; color: #aaa; text-align: center; margin-top: 6px; }
        .card-actions { display: none !important; }

        /* באנר הכנה לשנה הבאה */
        .summer-banner {
            background: linear-gradient(135deg, #f3e5f5, #ede7f6);
            border: 2px solid #8e24aa;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .summer-banner .icon { font-size: 2em; flex-shrink: 0; }
        .summer-banner .title { font-weight: bold; color: #6a1b9a; font-size: 1.05em; }
        .summer-banner .desc { color: #555; font-size: 0.9em; margin-top: 2px; }
    </style>
</head>

<body>

<div class="container">
    <header class="main-header" style="padding: 15px; margin-bottom: 25px;">
        <h1 style="font-size: 1.8em;">כאן לומדות ולומדים בכיף 🎓</h1>
    </header>

    <main class="grades-container">
        <section class="grade-col grade-6">
            <div class="grade-header">
                <h2 class="grade-title">כיתה ו' 🚀</h2>
                <a href="index.html" class="back-btn">🏠 חזרה לראשי</a>
            </div>

            <div class="summer-banner">
                <span class="icon">🎒</span>
                <div>
                    <div class="title">מתכוננות לכיתה ו'!</div>
                    <div class="desc">כאן נאסוף בקיץ משחקים ותרגולים שיעזרו להתכונן לשנה הבאה</div>
                </div>
            </div>

            <!-- קופסת שיעורי בית — מוסתרת עד שהמשו"ב יופעל מחדש -->
            <div id="hw-container-6" class="homework-box" style="display:none;">
                <p style="text-align:center; color:#888;">אין שיעורי בית 🎉</p>
            </div>

            <!-- ===== חשבון ===== -->
            <details class="subject-box" open>
                <summary class="subject-title">📐 חשבון</summary>
                <div class="apps-grid">
                    <!-- חזרה על כיתה ה': שברים, אחוזים — אפשר להעביר לכאן כרטיסיות -->
                    <div class="card" data-app-id="fractions_game">
                        <a class="card-main" href="apps/math/fractions_game.html">
                            <span class="icon">🍕</span>
                            <span class="card-title">משחק השברים</span>
                            <span class="card-desc">חזרה על שברים מכיתה ה'</span>
                        </a>
                    </div>
                    <!-- כרטיסיות חדשות נוספות כאן -->
                </div>
            </details>

            <!-- ===== עברית ===== -->
            <details class="subject-box" open>
                <summary class="subject-title">📖 עברית</summary>
                <div class="apps-grid">
                    <!-- כרטיסיות נוספות כאן -->
                </div>
            </details>

            <!-- ===== אנגלית ===== -->
            <details class="subject-box" open>
                <summary class="subject-title">🗣️ אנגלית</summary>
                <div class="apps-grid">
                    <!-- כרטיסיות נוספות כאן -->
                </div>
            </details>

            <!-- ===== מדעים ===== -->
            <details class="subject-box" open>
                <summary class="subject-title">🔬 מדעים</summary>
                <div class="apps-grid">
                    <!-- כרטיסיות נוספות כאן -->
                </div>
            </details>

            <!-- ===== הכנה לשנה הבאה ===== -->
            <details class="subject-box" open>
                <summary class="subject-title">🎒 הכנה לכיתה ו'</summary>
                <div class="apps-grid">
                    <!-- אפליקציות הכנה: חזרה מרוכזת וחומרי הכנה לשנה הבאה -->
                </div>
            </details>

        </section>
    </main>

    <footer>
        <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px auto; max-width: 200px;">
        נבנה באהבה ללמידה ע"י ענבל צרפתי-ברעד &copy; 2026
    </footer>
</div>

<script src="homework_data.js"></script>
<script src="homework_manual.js"></script>

    navigator.serviceWorker.register('sw.js');
